<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
  <title id="t">Intentionally broken fixture: dangling references and duplicate ids</title>
  <!-- R1: fill points at a gradient that does not exist -->
  <rect x="10" y="10" width="180" height="60" rx="10" fill="url(#missingGradient)"/>
  <!-- R1: clip-path points at a clipPath that does not exist -->
  <g clip-path="url(#missingClip)">
    <circle cx="300" cy="60" r="30" fill="#22c55e"/>
  </g>
  <!-- R2: two gradients share one id; first match wins silently -->
  <defs>
    <linearGradient id="dup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#ff0000"/>
    </linearGradient>
    <linearGradient id="dup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0000ff"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
  </defs>
  <rect x="10" y="90" width="180" height="60" rx="10" fill="url(#dup)"/>
  <text x="20" y="180" font-size="14" fill="#1f2937">引用完整性示例</text>
</svg>
