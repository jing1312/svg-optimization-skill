<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-labelledby="gbT gbD">
  <title id="gbT">晨山咖啡推广 banner：深烘暗调、铜版线刻与衬线大字的克制版式</title>
  <desc id="gbD">示例：非内置品牌如何走同一套流程 —— 推导色板、语义 motif、细线秩序、门禁验证。</desc>
  <defs>
    <linearGradient id="gbGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171310"/>
      <stop offset="1" stop-color="#1d1812"/>
    </linearGradient>
  </defs>

  <!-- 底、框、角标 -->
  <rect width="1100" height="300" fill="url(#gbGround)"/>
  <rect x="16" y="16" width="1068" height="268" fill="none" stroke="#e9dcc3" stroke-opacity="0.16" stroke-width="1"/>
  <g stroke="#c9a86a" stroke-opacity="0.55" stroke-width="1.4" fill="none">
    <path d="M20 34 V20 H34"/>
    <path d="M1066 20 H1080 V34"/>
    <path d="M20 266 V280 H34"/>
    <path d="M1080 266 V280 H1066"/>
  </g>

  <!-- motif：铜版线刻咖啡杯，杯内藏晨山日出 -->
  <g data-motif="fresh-brew" data-motif-message="杯内的山形与初升日点，指清晨山场现萃" transform="translate(56 78)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 30 C 42 20, 50 16, 46 6" stroke="#c9a86a" stroke-opacity="0.7" stroke-width="1.4"/>
    <path d="M74 32 C 70 22, 78 18, 74 8" stroke="#c9a86a" stroke-opacity="0.7" stroke-width="1.4"/>
    <path d="M16 44 H 120 C 127 44, 131 49, 131 55 C 131 97, 101 126, 68 126 C 35 126, 5 97, 5 55 C 5 49, 9 44, 16 44 Z" stroke="#c9a86a" stroke-width="1.8"/>
    <path d="M131 58 C 154 58, 154 94, 131 94" stroke="#c9a86a" stroke-width="1.6"/>
    <path d="M36 102 L 58 74 L 73 89 L 89 69 L 103 102" stroke="#e9dcc3" stroke-opacity="0.85" stroke-width="1.5"/>
    <circle cx="47" cy="63" r="6.5" stroke="#c9a86a" stroke-width="1.4"/>
    <path d="M-2 136 H 138" stroke="#c9a86a" stroke-opacity="0.8" stroke-width="1.4"/>
    <path d="M12 144 H 124" stroke="#c9a86a" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- 文本区 -->
  <text x="300" y="92" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#c9a86a" letter-spacing="5">ALTITUDE 1900 M · SLOW-ROASTED DAILY</text>
  <text x="300" y="158" data-role="banner-title" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="46" font-weight="700" fill="#efe7d8">晨山咖啡 · 每日新鲜烘焙</text>
  <text x="300" y="198" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#c4b49a">海拔一千九百米日晒豆 · 四十八小时内送达杯中</text>

  <!-- CTA：文字链接 + 细线箭头，不用胶囊按钮 -->
  <g data-role="cta">
    <text x="300" y="244" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="17" font-weight="600" fill="#efe7d8">立即订购</text>
    <line x1="300" y1="254" x2="368" y2="254" stroke="#c9a86a" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="388" y1="238" x2="452" y2="238" stroke="#c9a86a" stroke-width="1.2"/>
    <path d="M446 233 l 8 5 l -8 5" fill="none" stroke="#c9a86a" stroke-width="1.2"/>
  </g>

  <!-- 右侧竖排铭牌 -->
  <text transform="translate(1046 44) rotate(90)" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#948a70" letter-spacing="4">MORNING MOUNTAIN COFFEE</text>

  <!-- 页脚铭线 -->
  <text x="1016" y="266" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-size="11" font-style="italic" fill="#948a70">示例品牌 · 由 style-library §3 从主色推导</text>
</svg>
