<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-labelledby="gbTitle gbDesc">
  <title id="gbTitle">晨山咖啡推广 banner：从品牌主色推导的暖调梦幻渐变，语义化热气 motif</title>
  <desc id="gbDesc">示例：非内置品牌如何走同一套流程 —— 推导色板、写 motif brief、六层预算、门禁验证。</desc>
  <defs>
    <linearGradient id="gbBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ee"/>
      <stop offset="1" stop-color="#f9ead9"/>
    </linearGradient>
    <radialGradient id="gbHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gbCta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b34700"/>
      <stop offset="1" stop-color="#8f3a06"/>
    </linearGradient>
    <clipPath id="gbEdge"><rect x="0" y="0" width="1100" height="300"/></clipPath>
  </defs>

  <!-- 1 base · 2 halo -->
  <rect width="1100" height="300" fill="url(#gbBase)"/>
  <ellipse cx="180" cy="90" rx="300" ry="160" fill="url(#gbHalo)"/>

  <!-- 边缘裁切装饰（唯一允许的出界元素） -->
  <g clip-path="url(#gbEdge)" data-role="edge-clipped-bubbles">
    <circle cx="1096" cy="18" r="96" fill="#c2410c" fill-opacity="0.08"/>
    <circle cx="1058" cy="286" r="70" fill="#d97706" fill-opacity="0.1"/>
  </g>

  <!-- motif: 现磨现萃 —— 杯身 + 上升热气 -->
  <g data-motif="fresh-brew" data-motif-message="热气代表每日早晨现磨现萃" transform="translate(96 74)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 58 h 96 a 8 8 0 0 1 8 8 c 0 34 -23 54 -56 54 s -56 -20 -56 -54 a 8 8 0 0 1 8 -8 z" fill="#43301f" stroke="none"/>
    <path d="M122 70 c 24 0 24 34 0 34" stroke="#43301f" stroke-width="7"/>
    <path d="M44 34 c 0 -10 10 -10 10 -20 M66 34 c 0 -12 10 -12 10 -22 M88 34 c 0 -10 10 -10 10 -20" stroke="#c2410c" stroke-width="6"/>
  </g>

  <!-- 3 shadow · 4 liner · 5 gloss 略（横幅场景只保留必要层） -->

  <text x="316" y="130" data-role="banner-title" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="36" font-weight="700" fill="#3a2a18">晨山咖啡 · 每日新鲜烘焙</text>
  <text x="316" y="176" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="18" fill="#6b5136">海拔一千九百米日晒豆 · 四十八小时内送达杯中</text>

  <g data-role="cta">
    <rect x="316" y="208" width="190" height="48" rx="24" fill="url(#gbCta)"/>
    <text x="411" y="238" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#ffffff">立即订购</text>
  </g>

  <text x="1076" y="282" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#75563a">示例品牌 · 由 style-library.md §3 从主色 #c2410c 推导</text>
</svg>
