<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 730" width="860" height="730" role="img" aria-labelledby="popupTitle">
  <title id="popupTitle">知了学习扩展弹窗 mockup：深色浏览器背景上的语义化 Logo 与功能行</title>
  <desc>深色浏览器背景中浮起一张浅色弹窗卡片，包含 Logo、三个语义功能行和主 CTA 开始核验。</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0e1530"/>
    </linearGradient>
    <radialGradient id="bgGlowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#f0ebff"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="1" stop-color="#3b5bdb"/>
    </linearGradient>
    <radialGradient id="logoHaloJ" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceffb"/>
    </linearGradient>
    <linearGradient id="shieldJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c6ee0"/>
    </linearGradient>
    <filter id="cardLift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7c74e8" flood-opacity="0.35"/>
    </filter>
    <filter id="liftJ" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#8b7cf6" flood-opacity="0.25"/>
    </filter>
    <filter id="ctaLift" x="-40%" y="-40%" width="180%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
    <clipPath id="cardClip"><rect x="120" y="100" width="620" height="560" rx="28"/></clipPath>
    <clipPath id="tileClipJ"><rect x="16" y="16" width="64" height="64" rx="20"/></clipPath>
    <!-- Logo glyph adapted from Lucide book-open-check, ISC license -->
    <symbol id="logoJ" viewBox="0 0 96 96">
      <circle cx="48" cy="46" r="44" fill="url(#logoHaloJ)"/>
      <circle cx="48" cy="48" r="40" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 7"/>
      <circle cx="48" cy="8" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="88" cy="48" r="4.5" fill="#8b7cf6" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="48" cy="88" r="4.5" fill="#ffb3d9" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="8" cy="48" r="4.5" fill="#7ee8e0" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="16" y="16" width="64" height="64" rx="20" fill="url(#tileJ)" filter="url(#liftJ)"/>
      <rect x="21" y="21" width="54" height="54" rx="16" fill="none" stroke="#8b7cf6" stroke-opacity="0.4" stroke-width="1.4"/>
      <path d="M48 39.5c-2.5-2-5.4-2.7-9.2-2.7h-6.3v18.4h6.3c3.8 0 6.7.7 9.2 2.7z" fill="#f6f4ff" stroke="#2b2f55" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M48 39.5c2.5-2 5.4-2.7 9.2-2.7h6.3v18.4H57c-3.8 0-6.7.7-9.2 2.7z" fill="#ffffff" stroke="#2b2f55" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M39.5 48.5l5 5 12-12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M39.5 48.5l5 5 12-12" fill="none" stroke="#38bdf8" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g clip-path="url(#tileClipJ)"><rect x="16" y="16" width="64" height="24" fill="#ffffff" opacity="0.55"/></g>
      <path d="M66 55l9 3.2v6.3c0 5.3-3.8 8.9-9 10.5-5.2-1.6-9-5.2-9-10.5v-6.3z" fill="url(#shieldJ)" stroke="#ffffff" stroke-width="1.4"/>
      <path d="M61.6 64.6l3 3 5.8-5.8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect data-role="browser-backdrop" width="860" height="730" fill="#0b1020"/>
  <ellipse cx="430" cy="380" rx="430" ry="300" fill="url(#bgGlowV)"/>
  <ellipse cx="700" cy="120" rx="300" ry="200" fill="url(#bgGlowC)"/>

  <g data-role="browser-chrome">
    <rect x="40" y="24" width="780" height="52" rx="14" fill="#101830" stroke="#22305a" stroke-width="1"/>
    <circle cx="70" cy="50" r="6" fill="#fb7185"/>
    <circle cx="92" cy="50" r="6" fill="#fbbf24"/>
    <circle cx="114" cy="50" r="6" fill="#34d399"/>
    <rect x="140" y="38" width="380" height="24" rx="12" fill="#0b1020" stroke="#22305a" stroke-width="1"/>
    <circle cx="158" cy="50" r="5" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <text x="172" y="55" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#9aa7c7">扩展弹窗 · 实时预览</text>
  </g>

  <rect x="120" y="100" width="620" height="560" rx="28" fill="url(#cardGrad)" filter="url(#cardLift)"/>
  <rect x="127" y="107" width="606" height="546" rx="22" fill="none" stroke="#8b7cf6" stroke-opacity="0.25" stroke-width="1.4"/>
  <g clip-path="url(#cardClip)"><rect x="120" y="100" width="620" height="120" fill="#ffffff" opacity="0.5"/></g>

  <g data-role="logo" data-logo-intent="knowledge verification" data-icon-source="lucide" data-icon-name="book-open-check" data-icon-license="ISC" data-logo-secondary-motif="chapter relationship + verification shield">
    <use href="#logoJ" x="156" y="132" width="56" height="56"/>
  </g>
  <text x="228" y="158" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="600" fill="#2b2f55">知了学习</text>
  <text x="228" y="184" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">知识组织与核验助手</text>
  <line x1="156" y1="212" x2="704" y2="212" stroke="#8b7cf6" stroke-opacity="0.22" stroke-width="1.4"/>

  <g data-motif="chapter-relations" data-motif-message="章节概念自动连成关系网" transform="translate(156 236)">
    <rect width="44" height="44" rx="12" fill="#ffffff" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.4"/>
    <path d="M9 29c7-9 19-9 26 0" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 4"/>
    <circle cx="9" cy="29" r="4" fill="#38bdf8"/>
    <circle cx="22" cy="16" r="4.5" fill="#8b7cf6"/>
    <circle cx="35" cy="29" r="4" fill="#ffb3d9"/>
  </g>
  <text x="216" y="256" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#2b2f55">章节关系网</text>
  <text x="216" y="278" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">每章概念自动连成可核验的关系图</text>

  <g data-motif="review-path" data-motif-message="复习按掌握度逐步推进" transform="translate(156 320)">
    <rect width="44" height="44" rx="12" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.5" stroke-width="1.4"/>
    <path d="M8 30c8 2 12-12 20-10" fill="none" stroke="#8b7cf6" stroke-width="1.8" stroke-dasharray="3 4"/>
    <circle cx="8" cy="30" r="3.5" fill="#c4b5fd"/>
    <circle cx="20" cy="22" r="3.5" fill="#8b7cf6"/>
    <circle cx="33" cy="16" r="5" fill="#38bdf8"/>
    <path d="M31 16l1.6 1.6 3-3" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="216" y="340" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#2b2f55">复习路径</text>
  <text x="216" y="362" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">按掌握度推进，每一步复习都可回溯</text>

  <g data-motif="export-pack" data-motif-message="笔记卡片提纲一键打包导出" transform="translate(156 404)">
    <rect width="44" height="44" rx="12" fill="#ffffff" stroke="#7ee8e0" stroke-width="1.4"/>
    <rect x="9" y="14" width="26" height="18" rx="4" fill="none" stroke="#0ea5b7" stroke-width="1.8"/>
    <path d="M9 20h26" stroke="#0ea5b7" stroke-width="1.8"/>
    <path d="M22 24v9m0 0l-3.5-3.5M22 33l3.5-3.5" fill="none" stroke="#0ea5b7" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="216" y="424" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#2b2f55">资料导出包</text>
  <text x="216" y="446" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">笔记、卡片和提纲一键打包导出</text>

  <g data-role="cta">
    <rect x="156" y="492" width="224" height="52" rx="26" fill="url(#ctaGrad)" filter="url(#ctaLift)"/>
    <g clip-path="url(#cardClip)"><rect x="156" y="492" width="224" height="20" rx="10" fill="#ffffff" opacity="0.22"/></g>
    <text x="268" y="525" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="2">开始核验</text>
  </g>
  <text x="704" y="518" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">本学期已核验卡片 128 张</text>
  <text x="704" y="540" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#0369a1">核验通过率 96%</text>

  <text x="430" y="628" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#4f4b78">本季主题 · J 梦幻极光（可切换 K 夏日汽水）</text>
</svg>
