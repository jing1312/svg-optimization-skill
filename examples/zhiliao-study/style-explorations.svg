          <circle cx="8" cy="26" r="6"/>
          <circle cx="57" cy="11" r="7"/>
          <circle cx="106" cy="26" r="6"/>
          <path d="M54 11l2.4 2.4 5-5" stroke="#d94f30" stroke-width="2.2" stroke-linecap="round"/>
        </g>
      </g>
    </g>
