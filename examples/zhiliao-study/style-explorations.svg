<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" width="1060" height="770" role="img" aria-labelledby="seTitle">
  <title id="seTitle">风格轴探索：Q 墨线手稿与 R 星夜霓虹，两种非季节换色的新风格</title>
  <desc>不同于季节主题的换色逻辑，这两行探索不同的质感轴：纸面墨线单色手稿、暗底霓虹渐变描边。</desc>
  <defs>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f4f4fb"/>
    </linearGradient>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1a"/>
      <stop offset="1" stop-color="#141432"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ctaR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="haloR1" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloR2" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.55"/>
    </filter>
    <filter id="liftR" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
    <filter id="panelLift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <clipPath id="clipTQ"><rect x="80" y="174" width="640" height="176" rx="18"/></clipPath>
    <clipPath id="clipPQ"><rect x="740" y="174" width="240" height="176" rx="18"/></clipPath>
    <clipPath id="clipTR"><rect x="80" y="494" width="640" height="176" rx="18"/></clipPath>
    <clipPath id="clipPR"><rect x="740" y="494" width="240" height="176" rx="18"/></clipPath>
  </defs>

  <rect width="1060" height="770" fill="url(#pageGrad)"/>
  <text x="60" y="56" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="26" font-weight="600" fill="#2b2f55">风格轴探索 · 不是换色，是换质感</text>
  <text x="60" y="86" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#5a608f">Q/R 与季节主题正交：语义 brief、测量与结构门禁不变，质感逻辑完全不同</text>

