        <text x="228" y="176" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" fill="#6b6157">把章节连成关系网，让每次复习都有据可查</text>
        <g data-motif="chapter-relations" data-motif-message="章节用墨线连成关系网，朱红只标记已核验" transform="translate(872 214)" stroke="#2f2a24" fill="none" stroke-width="1.8">
