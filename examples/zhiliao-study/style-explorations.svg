          <path d="M48 39.5c-2.5-2-5.4-2.7-9.2-2.7h-6.3v18.4h6.3c3.8 0 6.7.7 9.2 2.7z" fill="none" stroke="#2f2a24" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M48 39.5c2.5-2 5.4-2.7 9.2-2.7h6.3v18.4H57c-3.8 0-6.7.7-9.2 2.7z" fill="none" stroke="#2f2a24" stroke-width="2.2" stroke-linejoin="round"/>
