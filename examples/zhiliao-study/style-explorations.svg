    <circle cx="96" cy="150" r="16" fill="#fdfcf8" stroke="#2f2a24" stroke-width="1.6"/>
    <text x="96" y="156" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" font-weight="600" fill="#2f2a24">Q</text>
    <text x="124" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="600" fill="#2f2a24">墨线手稿</text>
    <text x="240" y="156" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#6b6157">纸面 + 单色墨线插画，唯一强调色朱红只留给核验</text>
    <g data-role="banner-thumb" clip-path="url(#clipTQ)">
      <g transform="translate(80 174) scale(0.5818)">
