        <circle cx="760" cy="270" r="1.4" fill="#cbd5e1" opacity="0.35"/>
        <circle cx="60" cy="300" r="95" fill="none" stroke="url(#neonGrad)" stroke-opacity="0.35" stroke-width="2"/>
