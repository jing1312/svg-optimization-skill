<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 960" width="1320" height="960" role="img" aria-labelledby="ogTitle">
  <title id="ogTitle">华丽梦幻插画样板：六个产品动作各一张语义卡</title>
  <desc>章节关系、提纲生成、复习路径、卡片核验、课堂波形、资料导出包，六个图案各自只用一句话解释。</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f7efff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f4ff"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfcff"/>
      <stop offset="1" stop-color="#eceafb"/>
    </linearGradient>
    <radialGradient id="haloV" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloC" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloP" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#ffb3d9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffb3d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c6ee0"/>
    </linearGradient>
    <filter id="cardLift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c74e8" flood-opacity="0.2"/>
    </filter>
    <clipPath id="clipG1"><rect x="50" y="140" width="380" height="340" rx="22"/></clipPath>
    <clipPath id="clipG2"><rect x="470" y="140" width="380" height="340" rx="22"/></clipPath>
    <clipPath id="clipG3"><rect x="890" y="140" width="380" height="340" rx="22"/></clipPath>
    <clipPath id="clipG4"><rect x="50" y="520" width="380" height="340" rx="22"/></clipPath>
    <clipPath id="clipG5"><rect x="470" y="520" width="380" height="340" rx="22"/></clipPath>
    <clipPath id="clipG6"><rect x="890" y="520" width="380" height="340" rx="22"/></clipPath>
  </defs>

  <rect width="1320" height="960" fill="url(#bgGrad)"/>
  <text x="660" y="58" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="26" font-weight="600" fill="#2b2f55">华丽梦幻插画样板 · 六个产品动作</text>
  <text x="660" y="88" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#5a608f">每张卡只有一个主图案，且都能用一句话解释；效果按六层预算叠加，不堆随机装饰</text>

  <g data-motif="chapter-relations" data-motif-message="知识核验把章节和概念连成关系网">
    <rect x="50" y="140" width="380" height="340" rx="22" fill="url(#cardGrad)" filter="url(#cardLift)"/>
    <ellipse cx="240" cy="260" rx="200" ry="140" fill="url(#haloV)"/>
    <rect x="56" y="146" width="368" height="328" rx="18" fill="none" stroke="#8b7cf6" stroke-opacity="0.28" stroke-width="1.4"/>
    <g clip-path="url(#clipG1)"><rect x="50" y="140" width="380" height="80" fill="url(#glossGrad)"/></g>
    <g transform="translate(240 292)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="64" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="4 7"/>
      <path d="M0 -5c-3-2.4-6.4-3.2-10.9-3.2h-7.4v21.8h7.4c4.5 0 7.9.8 10.9 3.2z" fill="#ffffff" stroke="#2b2f55" stroke-width="2.4"/>
      <path d="M0 -5c3-2.4 6.4-3.2 10.9-3.2h7.4v21.8h-7.4c-4.5 0-7.9.8-10.9 3.2z" fill="#ffffff" stroke="#2b2f55" stroke-width="2.4"/>
      <path d="M-4 5.5l3 3 6.4-6.4" stroke="#38bdf8" stroke-width="2.4"/>
      <circle cx="0" cy="-64" r="9.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2.4"/>
      <circle cx="64" cy="0" r="9.5" fill="#8b7cf6" stroke="#ffffff" stroke-width="2.4"/>
      <path d="M60 0l2.8 2.8 5.4-5.4" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="64" r="9.5" fill="#ffb3d9" stroke="#ffffff" stroke-width="2.4"/>
      <circle cx="-64" cy="0" r="9.5" fill="#7ee8e0" stroke="#ffffff" stroke-width="2.4"/>
      <circle cx="45" cy="45" r="6.5" fill="#ffffff" stroke="#ffb3d9" stroke-width="2.2"/>
      <path d="M42.4 45l1.9 1.9 3.5-3.5" stroke="#fb7185" stroke-width="1.8"/>
    </g>
    <text x="240" y="428" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#2b2f55">章节关系</text>
    <text x="240" y="452" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">章节和概念围绕翻开的内容连成可核验的网</text>
  </g>

  <g data-motif="outline-generation" data-motif-message="从原文自动生成层级分明的提纲">
    <rect x="470" y="140" width="380" height="340" rx="22" fill="url(#cardGrad)" filter="url(#cardLift)"/>
    <ellipse cx="660" cy="260" rx="200" ry="140" fill="url(#haloC)"/>
    <rect x="476" y="146" width="368" height="328" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.4"/>
    <g clip-path="url(#clipG2)"><rect x="470" y="140" width="380" height="80" fill="url(#glossGrad)"/></g>
    <g transform="translate(660 292)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-42" y="-64" width="112" height="132" rx="12" fill="#ffffff" stroke="#2b2f55" stroke-width="2.4"/>
      <circle cx="-24" cy="-44" r="5.5" fill="#8b7cf6" stroke="none"/>
      <path d="M-12 -44h44" stroke="#2b2f55" stroke-width="2.4"/>
      <path d="M-12 -22h34" stroke="#2b2f55" stroke-width="2.4" stroke-opacity="0.75"/>
      <path d="M-4 0h38" stroke="#2b2f55" stroke-width="2.4" stroke-opacity="0.5"/>
      <path d="M4 22h32" stroke="#2b2f55" stroke-width="2.4" stroke-opacity="0.28" stroke-dasharray="5 6"/>
      <path d="M-28 -22v44" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="2 6"/>
      <circle cx="-4" cy="0" r="3.4" fill="#38bdf8" stroke="none"/>
      <circle cx="4" cy="22" r="3.4" fill="#38bdf8" stroke-opacity="0.55" stroke="none"/>
      <g transform="translate(-110 -28)">
        <path d="M0 -3c-2.1-1.7-4.5-2.2-7.6-2.2h-5.2v15.2h5.2c3.1 0 5.5.5 7.6 2.2z" fill="#ffffff" stroke="#2b2f55" stroke-width="2.2"/>
        <path d="M0 -3c2.1-1.7 4.5-2.2 7.6-2.2h5.2v15.2h-5.2c-3.1 0-5.5.5-7.6 2.2z" fill="#ffffff" stroke="#2b2f55" stroke-width="2.2"/>
      </g>
      <path d="M-88 -22c14 2 24 -8 36 -12" stroke="#8b7cf6" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="1 7"/>
      <path d="M-56 -38l6 3-2.4 6" stroke="#8b7cf6" stroke-width="2" fill="none"/>
      <text x="-110" y="6" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f" stroke="none">原文</text>
    </g>
    <text x="660" y="428" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#2b2f55">提纲生成</text>
    <text x="660" y="452" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">把整章原文收敛成层级清晰的一份提纲</text>
  </g>

  <g data-motif="review-path" data-motif-message="复习路径按掌握度推进，终点是整章核验通过">
    <rect x="890" y="140" width="380" height="340" rx="22" fill="url(#cardGrad)" filter="url(#cardLift)"/>
    <ellipse cx="1080" cy="260" rx="200" ry="140" fill="url(#haloP)"/>
    <rect x="896" y="146" width="368" height="328" rx="18" fill="none" stroke="#ffb3d9" stroke-opacity="0.5" stroke-width="1.4"/>
    <g clip-path="url(#clipG3)"><rect x="890" y="140" width="380" height="80" fill="url(#glossGrad)"/></g>
    <g transform="translate(1080 286)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-104 40C-58 8 -20 44 24 8C52 -14 76 -26 104 -36" stroke="#8b7cf6" stroke-opacity="0.55" stroke-width="2.4" stroke-dasharray="1 9"/>
      <circle cx="-104" cy="40" r="9.5" fill="#f1eefc" stroke="#8b7cf6" stroke-width="2.4"/>
      <circle cx="24" cy="8" r="12" fill="#38bdf8" stroke="#ffffff" stroke-width="2.4"/>
      <circle cx="24" cy="8" r="19" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.6"/>
      <circle cx="104" cy="-36" r="13" fill="#8b7cf6" stroke="#ffffff" stroke-width="2.4"/>
      <path d="M98.5 -36l3.8 3.8 7-7" stroke="#ffffff" stroke-width="2.6"/>
      <text x="-104" y="68" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#4f4b78" stroke="none">第一章 · 未开始</text>
      <text x="24" y="46" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f" stroke="none">第三章 · 复习中</text>
      <text x="104" y="-58" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f" stroke="none">整章核验通过</text>
    </g>
    <text x="1080" y="428" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#2b2f55">复习路径</text>
    <text x="1080" y="452" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">路径按掌握度延伸，终点是整章核验通过</text>
  </g>

  <g data-motif="card-verification" data-motif-message="卡片核验通过后才进入知识卡包">
    <rect x="50" y="520" width="380" height="340" rx="22" fill="url(#cardGrad)" filter="url(#cardLift)"/>
    <ellipse cx="240" cy="640" rx="200" ry="140" fill="url(#haloC)"/>
    <rect x="56" y="526" width="368" height="328" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.4"/>
    <g clip-path="url(#clipG4)"><rect x="50" y="520" width="380" height="80" fill="url(#glossGrad)"/></g>
    <g transform="translate(240 668)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-72" y="-56" width="112" height="84" rx="12" transform="rotate(-4 -16 -14)" fill="#efeafb" stroke="#8b7cf6" stroke-opacity="0.5" stroke-width="2"/>
      <rect x="-64" y="-50" width="112" height="84" rx="12" fill="#ffffff" stroke="#2b2f55" stroke-width="2.4"/>
      <path d="M-48 -30h56" stroke="#2b2f55" stroke-width="2.4"/>
      <path d="M-48 -10h40" stroke="#2b2f55" stroke-width="2.4" stroke-opacity="0.7"/>
      <path d="M-48 10h48" stroke="#2b2f55" stroke-width="2.4" stroke-opacity="0.45"/>
      <path d="M50 2l16 5.7v11.2c0 9.4-6.8 15.8-16 18.7-9.2-2.9-16-9.3-16-18.7V7.7z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="2.4"/>
      <path d="M42.5 19l5.4 5.4 10-10" stroke="#ffffff" stroke-width="2.8"/>
      <rect x="86" y="-38" width="30" height="22" rx="5" fill="none" stroke="#8b7cf6" stroke-opacity="0.5" stroke-width="1.8" stroke-dasharray="4 4"/>
      <rect x="86" y="-6" width="30" height="22" rx="5" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.65" stroke-width="1.8"/>
      <path d="M101 -16v12m0 0l-4.5-4.5m4.5 4.5l4.5-4.5" stroke="#38bdf8" stroke-width="1.8"/>
    </g>
    <text x="240" y="806" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#2b2f55">卡片核验</text>
    <text x="240" y="830" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">核验通过的卡片入库，待核验的排队等待</text>
  </g>

  <g data-motif="classroom-waveform" data-motif-message="课堂波形把讲解定位到某一秒">
    <rect x="470" y="520" width="380" height="340" rx="22" fill="url(#cardGrad)" filter="url(#cardLift)"/>
    <ellipse cx="660" cy="640" rx="200" ry="140" fill="url(#haloV)"/>
    <rect x="476" y="526" width="368" height="328" rx="18" fill="none" stroke="#8b7cf6" stroke-opacity="0.28" stroke-width="1.4"/>
    <g clip-path="url(#clipG5)"><rect x="470" y="520" width="380" height="80" fill="url(#glossGrad)"/></g>
    <g transform="translate(660 664)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-96" y="-56" width="192" height="104" rx="18" fill="#ffffff" stroke="#2b2f55" stroke-width="2.4"/>
      <circle cx="-70" cy="-2" r="14" fill="url(#waveGrad)"/>
      <path d="M-74 -8l11 6-11 6z" fill="#ffffff" stroke="none"/>
      <rect x="-46" y="-7" width="7" height="14" rx="3.5" fill="url(#waveGrad)" opacity="0.45" stroke="none"/>
      <rect x="-33" y="-13" width="7" height="26" rx="3.5" fill="url(#waveGrad)" opacity="0.55" stroke="none"/>
      <rect x="-20" y="-19" width="7" height="38" rx="3.5" fill="url(#waveGrad)" opacity="0.65" stroke="none"/>
      <rect x="-7" y="-12" width="7" height="24" rx="3.5" fill="url(#waveGrad)" opacity="0.8" stroke="none"/>
      <rect x="6" y="-22" width="7" height="44" rx="3.5" fill="url(#waveGrad)" stroke="none"/>
      <rect x="19" y="-15" width="7" height="30" rx="3.5" fill="url(#waveGrad)" stroke="none"/>
      <rect x="32" y="-9" width="7" height="18" rx="3.5" fill="url(#waveGrad)" opacity="0.6" stroke="none"/>
      <rect x="45" y="-17" width="7" height="34" rx="3.5" fill="url(#waveGrad)" opacity="0.4" stroke="none"/>
      <rect x="58" y="-6" width="7" height="12" rx="3.5" fill="url(#waveGrad)" opacity="0.3" stroke="none"/>
      <path d="M6 -56v104" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="4 5"/>
      <rect x="28" y="58" width="68" height="26" rx="13" fill="#ffffff" stroke="#fb7185" stroke-opacity="0.6" stroke-width="1.6"/>
      <text x="62" y="76" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#2b2f55" stroke="none">02:14</text>
    </g>
    <text x="660" y="806" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#2b2f55">课堂波形</text>
    <text x="660" y="830" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">点一下波形，讲解直接跳到那一秒</text>
  </g>

  <g data-motif="export-pack" data-motif-message="笔记、卡片和提纲打包成一个导出包">
    <rect x="890" y="520" width="380" height="340" rx="22" fill="url(#cardGrad)" filter="url(#cardLift)"/>
    <ellipse cx="1080" cy="640" rx="200" ry="140" fill="url(#haloC)"/>
    <rect x="896" y="526" width="368" height="328" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.4"/>
    <g clip-path="url(#clipG6)"><rect x="890" y="520" width="380" height="80" fill="url(#glossGrad)"/></g>
    <g transform="translate(1080 664)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-88 44v20h150v-20" stroke="#2b2f55" stroke-width="2.4" stroke-opacity="0.75"/>
      <rect x="-54" y="-24" width="104" height="62" rx="10" fill="url(#boxGrad)" stroke="#2b2f55" stroke-width="2.4"/>
      <path d="M-54 -24L-72 -46h42l18 22z" fill="#efeafb" stroke="#2b2f55" stroke-width="2.4"/>
      <path d="M50 -24l18 -22H26l-18 22z" fill="#efeafb" stroke="#2b2f55" stroke-width="2.4"/>
      <rect x="-34" y="-56" width="42" height="34" rx="5" fill="#ffffff" stroke="#2b2f55" stroke-width="2.2"/>
      <path d="M-26 -46h26M-26 -38h18" stroke="#2b2f55" stroke-width="2" stroke-opacity="0.7"/>
      <rect x="12" y="-50" width="32" height="24" rx="5" fill="#ffffff" stroke="#38bdf8" stroke-width="2.2"/>
      <path d="M22 -38l3 3 6-6" stroke="#38bdf8" stroke-width="2.2"/>
      <circle cx="-2" cy="10" r="12" fill="#8b7cf6" stroke="#ffffff" stroke-width="2"/>
      <path d="M-7 10l3.4 3.4 6.6-6.6" stroke="#ffffff" stroke-width="2.4"/>
      <path d="M76 -12v40m0 0l-8-8m8 8l8-8" stroke="#38bdf8" stroke-width="2.4"/>
    </g>
    <text x="1080" y="806" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="600" fill="#2b2f55">资料导出包</text>
    <text x="1080" y="830" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5a608f">笔记、卡片和提纲一起打包，随时带走</text>
  </g>

  <text x="660" y="934" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#4f4b78">效果层次：浅色渐变底 → 环境光晕 → 有色柔和阴影 → 半透明内衬 → clipped 高光 → 单一主插画</text>
</svg>
