<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="hcT hcD">
  <title id="hcT">svg-optimization-skill · 流光体系（夏日暖域变体）：光是画出来的</title>
  <desc id="hcD">梦幻流光主视觉 · 夏日暖域变体：光谱底色上漂着三团漂移光场与微尘，一匹两端收尖的绸带手势贯穿画面，玻璃浮球连成关系图，其中一枚承载核验勾。</desc>
  <defs>
    <linearGradient id="hcBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6f0"/>
      <stop offset="0.22" stop-color="#fdefe6"/>
      <stop offset="0.45" stop-color="#fbe2da"/>
      <stop offset="0.68" stop-color="#f7dbe2"/>
      <stop offset="0.85" stop-color="#f0d6ea"/>
      <stop offset="1" stop-color="#e9d4f0"/>
    </linearGradient>
    <radialGradient id="hcBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2d9" stop-opacity="0.9"/>
      <stop offset="0.32" stop-color="#ffe6c4" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#ffd9c8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffd9c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcDriftLav" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdccb" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffdccb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcDriftRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3b8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffe3b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcDriftAqua" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0d0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffe0d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hcRibbonFill" gradientUnits="userSpaceOnUse" x1="-80" y1="480" x2="1290" y2="80">
      <stop offset="0" stop-color="#f472a0"/>
      <stop offset="0.35" stop-color="#fb9d6c"/>
      <stop offset="0.68" stop-color="#f5c86e"/>
      <stop offset="1" stop-color="#c9a2f0"/>
    </linearGradient>
    <linearGradient id="hcRibbonCore" gradientUnits="userSpaceOnUse" x1="-80" y1="480" x2="1290" y2="80">
      <stop offset="0" stop-color="#fff4e8"/>
      <stop offset="0.35" stop-color="#ffece0"/>
      <stop offset="0.68" stop-color="#ffe8ee"/>
      <stop offset="1" stop-color="#f8e6f8"/>
    </linearGradient>
    <radialGradient id="hcOrbA" cx="0.62" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fbe7d9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0b9a2" stop-opacity="0.14"/>
    </radialGradient>
    <radialGradient id="hcOrbB" cx="0.64" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.5" stop-color="#f9e2d2" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#efb4a0" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="hcOrbShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d78a6a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#d78a6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcSparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hcFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="hcSilkBlur" x="-30%" y="-220%" width="160%" height="540%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="hcEchoBlur" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="hcInkLift" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#d89a7a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 光场：光谱底 + 漂移光场（天气，不是壁纸） -->
  <rect width="1200" height="560" fill="url(#hcBase)"/>
  <ellipse cx="250" cy="170" rx="330" ry="190" fill="url(#hcDriftLav)"/>
  <ellipse cx="1000" cy="440" rx="360" ry="210" fill="url(#hcDriftRose)"/>
  <ellipse cx="640" cy="40" rx="300" ry="140" fill="url(#hcDriftAqua)"/>
  <circle cx="850" cy="120" r="470" fill="url(#hcBloom)"/>

  <!-- 手势：一匹绸 —— 两端收尖、中段丰盈，双层半透明 + 上缘受光 -->
  <path d="M -80 464 C 190 436 360 262 620 240 C 880 218 1082 156 1290 74 L 1290 86 C 1040 200 900 268 650 300 C 430 338 240 468 -80 500 Z" fill="url(#hcRibbonFill)" opacity="0.55" filter="url(#hcSilkBlur)"/>
  <path d="M -60 182 C 300 164 560 114 920 86 C 1080 74 1200 52 1268 36 L 1268 44 C 1192 62 1072 86 916 98 C 566 126 306 178 -60 196 Z" fill="url(#hcRibbonFill)" opacity="0.22" filter="url(#hcEchoBlur)"/>
  <path d="M -80 468 C 200 444 380 278 630 258 C 880 238 1080 176 1290 80 L 1290 88 C 1046 194 902 282 656 306 C 446 328 262 462 -80 494 Z" fill="url(#hcRibbonCore)" opacity="0.92"/>
  <path d="M -80 464 C 190 436 360 262 620 240 C 880 218 1082 156 1290 74" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M 470 296 C 540 282 610 276 690 278" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <path d="M 940 232 C 1010 210 1080 182 1140 150" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M -60 492 C 240 460 430 336 650 302 C 890 270 1050 206 1270 92" fill="none" stroke="#7a6cc8" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>

  <!-- 浮层雾 -->
  <rect x="0" y="300" width="1200" height="260" fill="url(#hcFog)"/>

  <!-- 远景浮球（左下裁切，浅景深） -->
  <circle cx="-40" cy="470" r="210" fill="url(#hcOrbA)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- 暖色视觉锚点 -->
  <ellipse cx="960" cy="360" rx="150" ry="104" fill="url(#hcDriftRose)"/>

  <!-- 中近景浮球关系图（motif：浮球连成关系，其中一枚承载核验） -->
  <g data-motif="verify-nodes" data-motif-message="浮球连成关系图，一枚承载核验勾：秩序内在于光">
    <circle cx="952" cy="352" r="92" fill="url(#hcSparkGlow)"/>
    <circle cx="566" cy="88" r="40" fill="url(#hcSparkGlow)"/>
    <!-- 关系连线 -->
    <g fill="none" stroke="#8a5f74" stroke-opacity="0.35" stroke-width="1">
      <path d="M 586 94 Q 830 120 1076 202"/>
      <path d="M 1080 220 Q 1046 288 966 336"/>
      <path d="M 582 106 Q 770 220 934 336"/>
    </g>
    <circle cx="952" cy="352" r="62" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="932" cy="326" r="7" fill="#ffffff" fill-opacity="0.9"/>
    <!-- 核验勾：秩序内在于光 -->
    <path d="M 934 356 l 13 13 l 26 -26" fill="none" stroke="#8a4a62" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="566" cy="88" r="22" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="558" cy="80" r="3" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="1088" cy="208" r="13" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
    <g fill="#ffffff">
      <circle cx="760" cy="180" r="20" fill="url(#hcSparkGlow)"/>
      <path d="M760 166 C 762.2 177.8 762.2 177.8 774 180 C 762.2 182.2 762.2 182.2 760 194 C 757.8 182.2 757.8 182.2 746 180 C 757.8 177.8 757.8 177.8 760 166 Z"/>
      <circle cx="1016" cy="116" r="14" fill="url(#hcSparkGlow)"/>
      <path d="M1016 107 C 1017.5 114.5 1017.5 114.5 1025 116 C 1017.5 117.5 1017.5 117.5 1016 125 C 1014.5 117.5 1014.5 117.5 1007 116 C 1014.5 114.5 1014.5 114.5 1016 107 Z" fill-opacity="0.95"/>
      <circle cx="560" cy="142" r="10" fill="url(#hcSparkGlow)"/>
      <path d="M560 136 C 561 141 561 141 566 142 C 561 143 561 143 560 148 C 559 143 559 143 554 142 C 559 141 559 141 560 136 Z" fill-opacity="0.9"/>
    </g>
  </g>

  <!-- 漂浮微尘：让空气可见（疏密不一，绝不排排坐） -->
  <g>
    <circle cx="368" cy="142" r="3" fill="#ffffff" fill-opacity="0.38"/>
    <circle cx="610" cy="304" r="2.2" fill="#ffffff" fill-opacity="0.45"/>
    <circle cx="540" cy="398" r="4" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="824" cy="238" r="2.6" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="1120" cy="306" r="3.4" fill="#ffffff" fill-opacity="0.35"/>
    <circle cx="232" cy="332" r="2.4" fill="#ffffff" fill-opacity="0.38"/>
    <circle cx="700" cy="140" r="2" fill="#ffffff" fill-opacity="0.48"/>
    <circle cx="984" cy="472" r="3" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="1150" cy="180" r="2.2" fill="#ffffff" fill-opacity="0.42"/>
    <circle cx="430" cy="470" r="3.6" fill="#ffffff" fill-opacity="0.33"/>
    <circle cx="884" cy="212" r="2.8" fill="#ffffff" fill-opacity="0.55"/>
    <circle cx="884" cy="212" r="10" fill="url(#hcSparkGlow)"/>
    <circle cx="180" cy="120" r="16" fill="url(#hcSparkGlow)" fill-opacity="0.5"/>
    <circle cx="1040" cy="500" r="18" fill="url(#hcSparkGlow)" fill-opacity="0.45"/>
    <!-- 成簇微尘：真实的尘埃不均匀 -->
    <circle cx="714" cy="130" r="3.2" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="688" cy="150" r="1.6" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="1132" cy="296" r="1.8" fill="#ffffff" fill-opacity="0.45"/>
  </g>

  <!-- 安静区：排印 -->
  <text x="84" y="118" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#7a5a6a" letter-spacing="5">SVG ATELIER · DREAMLIGHT N°01</text>
  <text x="84" y="246" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="72" font-weight="700" fill="#5e3a54" letter-spacing="7" filter="url(#hcInkLift)">光是画出来的</text>
  <text x="84" y="298" font-family="Georgia, Times New Roman, serif" font-size="23" font-style="italic" filter="url(#hcInkLift)" fill="#7a5268">Where light is drawn, order follows.</text>

  <g data-role="atelier-mark">
    <circle cx="1064" cy="512" r="9" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8"/>
    <path d="M 1059 512 l 4 4 l 9 -9" fill="none" stroke="#8a4a62" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1046" y="516" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" font-weight="600" fill="#6b4a5c" letter-spacing="3.5">SVG ATELIER</text>
  </g>
  <text x="96" y="510" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#6b4a5c">机器门禁 G1–G4 · 引用完整性 R1·R2 · 渲染实测 T0 / T1 / T2</text>
</svg>
