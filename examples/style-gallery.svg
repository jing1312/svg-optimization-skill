<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="sgT sgD">
  <title id="sgT">三种方向，三种语法：流光 / 暖纸压印 / 玻璃器物</title>
  <desc id="sgD">方向的区别在构图、材质与图形语法，不只是色温：漂动的场、对称的纸、居中的器，同一套门禁。</desc>
  <defs>
    <!-- 流光 -->
    <linearGradient id="p1Base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="0.4" stop-color="#ece6fb"/>
      <stop offset="0.75" stop-color="#f6e8ee"/>
      <stop offset="1" stop-color="#fdf0ea"/>
    </linearGradient>
    <linearGradient id="p1Ribbon" gradientUnits="userSpaceOnUse" x1="30" y1="676" x2="408" y2="352">
      <stop offset="0" stop-color="#49cdbd"/>
      <stop offset="0.4" stop-color="#5d95ee"/>
      <stop offset="0.75" stop-color="#8f77ec"/>
      <stop offset="1" stop-color="#ee92b6"/>
    </linearGradient>
    <linearGradient id="p1Core" gradientUnits="userSpaceOnUse" x1="30" y1="676" x2="408" y2="352">
      <stop offset="0" stop-color="#eafffb"/>
      <stop offset="0.5" stop-color="#e7efff"/>
      <stop offset="1" stop-color="#ffeaf2"/>
    </linearGradient>
    <radialGradient id="p1Orb" cx="0.64" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.5" stop-color="#cfc0f8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#8a76e0" stop-opacity="0.34"/>
    </radialGradient>
    <radialGradient id="p1Bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p1Drift" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cdd4ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#cdd4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="p1Blur8" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="p1Blur4" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <!-- 玻璃器 -->
    <linearGradient id="p3Base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14171f"/>
      <stop offset="1" stop-color="#191d29"/>
    </linearGradient>
    <radialGradient id="p3Glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3Shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06070b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#06070b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sgClipA"><rect x="48" y="236" width="352" height="500" rx="18"/></clipPath>
    <clipPath id="sgClipB"><rect x="424" y="236" width="352" height="500" rx="18"/></clipPath>
    <clipPath id="sgClipC"><rect x="800" y="236" width="352" height="500" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="860" fill="#f4f3fb"/>

  <!-- 册首 -->
  <text x="60" y="76" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#5c569c" letter-spacing="5">STYLE MASTERY · THREE GRAMMARS, NOT THREE FILTERS</text>
  <text x="60" y="128" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="40" font-weight="700" fill="#26243a">三种方向，三种语法</text>
  <text x="60" y="164" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#6b64a8">区别在构图、材质与图形语法，不只是色温 —— 每个面板都过同一组门禁</text>

  <!-- ============ 01 流光：漂动的场 ============ -->
  <text x="48" y="216" font-family="Georgia, Times New Roman, serif" font-size="15" font-style="italic" fill="#5c4bc0">01</text>
  <text x="84" y="217" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="20" font-weight="700" fill="#26243a">流光 · 漂动的场</text>
  <text x="400" y="216" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5c569c">非对称 · 绸带手势 · 玻璃浮球</text>
  <g data-style-id="dreamlight">
    <rect x="48" y="236" width="352" height="500" rx="18" fill="url(#p1Base)"/>
    <g clip-path="url(#sgClipA)">
      <ellipse cx="140" cy="340" rx="180" ry="120" fill="url(#p1Drift)"/>
      <circle cx="330" cy="270" r="96" fill="url(#p1Bloom)"/>
      <path d="M 30 676 C 130 616 180 476 268 440 C 320 420 360 384 408 352 L 408 366 C 362 402 322 432 276 450 C 190 484 140 616 30 704 Z" fill="url(#p1Ribbon)" opacity="0.62" filter="url(#p1Blur8)"/>
      <path d="M 60 330 C 160 318 260 296 400 272 L 400 278 C 262 302 164 324 60 338 Z" fill="url(#p1Ribbon)" opacity="0.2" filter="url(#p1Blur4)"/>
      <path d="M 30 682 C 132 622 184 484 270 450 C 320 432 358 398 406 358 L 406 364 C 360 400 322 428 274 444 C 192 476 142 620 30 698 Z" fill="url(#p1Core)" opacity="0.9"/>
      <path d="M 30 676 C 130 616 180 476 268 440 C 320 420 360 384 408 352" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
      <path d="M 132 340 Q 220 330 294 356" fill="none" stroke="#6b64a8" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="318" cy="366" r="30" fill="url(#p1Orb)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
      <circle cx="308" cy="354" r="4" fill="#ffffff" fill-opacity="0.92"/>
      <path d="M 310 368 l 6 6 l 12 -12" fill="none" stroke="#43398f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120" cy="336" r="12" fill="url(#p1Orb)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
      <g fill="#ffffff">
        <circle cx="90" cy="420" r="2" fill-opacity="0.4"/>
        <circle cx="368" cy="470" r="2.4" fill-opacity="0.35"/>
        <circle cx="150" cy="600" r="2" fill-opacity="0.3"/>
        <circle cx="252" cy="306" r="2.2" fill-opacity="0.45"/>
      </g>
      <circle cx="250" cy="300" r="12" fill="url(#p1Bloom)"/>
      <path d="M250 292 C 251.2 298.8 251.2 298.8 258 300 C 251.2 301.2 251.2 301.2 250 308 C 248.8 301.2 248.8 301.2 242 300 C 248.8 298.8 248.8 298.8 250 292 Z" fill="#ffffff" fill-opacity="0.95"/>
    </g>
  </g>

  <!-- ============ 02 暖纸：压印的静 ============ -->
  <text x="424" y="216" font-family="Georgia, Times New Roman, serif" font-size="15" font-style="italic" fill="#5c4bc0">02</text>
  <text x="460" y="217" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="20" font-weight="700" fill="#26243a">暖纸 · 压印的静</text>
  <text x="776" y="216" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5c569c">对称 · 硬阴影 · 缝线边框</text>
  <g data-style-id="paper">
    <rect x="424" y="236" width="352" height="500" rx="18" fill="#f8f1e4"/>
    <g clip-path="url(#sgClipB)">
      <rect x="438" y="250" width="324" height="472" fill="none" stroke="#b08a5a" stroke-opacity="0.25" stroke-width="1"/>
      <rect x="452" y="264" width="296" height="444" fill="none" stroke="#b08a5a" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="5 7"/>
      <g stroke="#b08a5a" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round">
        <path d="M448 260 l 8 8 M456 260 l -8 8"/>
        <path d="M744 260 l 8 8 M752 260 l -8 8"/>
        <path d="M448 704 l 8 8 M456 704 l -8 8"/>
        <path d="M744 704 l 8 8 M752 704 l -8 8"/>
      </g>
      <!-- 太阳：纸片 + 硬阴影 -->
      <circle cx="601" cy="393" r="34" fill="#8a5a2a" fill-opacity="0.22"/>
      <circle cx="598" cy="390" r="34" fill="#e8a84c" stroke="#c07a3a" stroke-opacity="0.6" stroke-width="1.5"/>
      <!-- 远山与近山：剪纸 + 错位硬阴影 -->
      <path d="M 470 600 L 552 452 L 610 544 L 660 456 L 744 600 Z" transform="translate(4 4)" fill="#8a5a2a" fill-opacity="0.2"/>
      <path d="M 470 600 L 552 452 L 610 544 L 660 456 L 744 600 Z" fill="#e3b878"/>
      <path d="M 494 624 L 582 496 L 644 582 L 680 532 L 730 624 Z" transform="translate(4 4)" fill="#7a4c22" fill-opacity="0.22"/>
      <path d="M 494 624 L 582 496 L 644 582 L 680 532 L 730 624 Z" fill="#c07a3a"/>
      <path d="M 452 624 H 748" stroke="#b08a5a" stroke-opacity="0.4" stroke-width="1.2"/>
    </g>
  </g>

  <!-- ============ 03 玻璃：器物的轴 ============ -->
  <text x="800" y="216" font-family="Georgia, Times New Roman, serif" font-size="15" font-style="italic" fill="#5c4bc0">03</text>
  <text x="836" y="217" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="20" font-weight="700" fill="#26243a">玻璃 · 器物的轴</text>
  <text x="1152" y="216" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5c569c">中轴 · 发丝线 · 深色玻璃</text>
  <g data-style-id="glass">
    <rect x="800" y="236" width="352" height="500" rx="18" fill="url(#p3Base)"/>
    <g clip-path="url(#sgClipC)">
      <rect x="814" y="250" width="324" height="472" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
      <ellipse cx="976" cy="430" rx="150" ry="190" fill="url(#p3Glow)"/>
      <line x1="830" y1="430" x2="900" y2="430" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <line x1="1052" y1="430" x2="1122" y2="430" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <ellipse cx="976" cy="560" rx="56" ry="11" fill="url(#p3Shadow)"/>
      <rect x="936" y="344" width="80" height="196" rx="40" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.2"/>
      <ellipse cx="976" cy="378" rx="28" ry="20" fill="#ffffff" fill-opacity="0.16"/>
      <line x1="956" y1="380" x2="956" y2="506" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2"/>
      <circle cx="860" cy="320" r="2" fill="#ffffff" fill-opacity="0.4"/>
      <circle cx="1090" cy="480" r="2.4" fill="#ffffff" fill-opacity="0.35"/>
      <text x="976" y="300" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#9aa2b1" letter-spacing="5">GLASS VESSEL</text>
      <line x1="920" y1="668" x2="1032" y2="668" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
      <text x="976" y="694" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="13" font-style="italic" fill="#8b93a1">N° 03</text>
    </g>
  </g>

  <!-- 题注 -->
  <text x="48" y="764" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5c569c">同一个光源，手势决定画面的流向</text>
  <text x="424" y="764" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5c569c">纸的语法：剪影、错位阴影与缝线</text>
  <text x="800" y="764" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#5c569c">器的语法：一根轴撑起所有留白</text>

  <line x1="60" y1="800" x2="1140" y2="800" stroke="#37326e" stroke-opacity="0.1" stroke-width="1"/>
  <text x="60" y="826" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5c569c">风格不是滤镜，是语法 —— 换方向就要换构图、材质与图形语言</text>
  <text x="1140" y="826" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-size="11.5" font-style="italic" fill="#5c569c" letter-spacing="3">DREAMLIGHT · PAPER · GLASS</text>
</svg>
