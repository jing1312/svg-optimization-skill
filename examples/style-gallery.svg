<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="sgT sgD">
  <title id="sgT">流光体系双联画：晨光与月色，一种光两种气候</title>
  <desc id="sgD">同一流光体系的两种气候 —— 暖域晨光与冷域月色，共享同一套光规则、手势与浮球景深。</desc>
  <defs>
    <linearGradient id="sgGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f6fc"/>
      <stop offset="1" stop-color="#f1f0fa"/>
    </linearGradient>
    <!-- 晨光气候 -->
    <linearGradient id="sgDawnBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece4f8"/>
      <stop offset="0.28" stop-color="#f6e0ec"/>
      <stop offset="0.55" stop-color="#fbe2dc"/>
      <stop offset="0.8" stop-color="#fdeedd"/>
      <stop offset="1" stop-color="#fff6e8"/>
    </linearGradient>
    <radialGradient id="sgDawnBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3dd" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ffe4cf" stop-opacity="0.4"/>
      <stop offset="0.72" stop-color="#ffd9d0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffd9d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sgRibbonWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a9c4"/>
      <stop offset="0.35" stop-color="#f8bd8f"/>
      <stop offset="0.7" stop-color="#f5d78e"/>
      <stop offset="1" stop-color="#c9b2ee"/>
    </linearGradient>
    <!-- 月色气候 -->
    <linearGradient id="sgMoonBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e9fb"/>
      <stop offset="0.3" stop-color="#e3e2f8"/>
      <stop offset="0.58" stop-color="#ded9f5"/>
      <stop offset="0.82" stop-color="#e8dcf4"/>
      <stop offset="1" stop-color="#f0e4f2"/>
    </linearGradient>
    <radialGradient id="sgMoonBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.42" stop-color="#f0ecff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0ecff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sgMoonDisc" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.8" stop-color="#f7f0e2"/>
      <stop offset="1" stop-color="#eee2cc"/>
    </radialGradient>
    <linearGradient id="sgRibbonCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee3d4"/>
      <stop offset="0.35" stop-color="#86a8f0"/>
      <stop offset="0.7" stop-color="#a58cf2"/>
      <stop offset="1" stop-color="#e8a8c8"/>
    </linearGradient>
    <!-- 共用 -->
    <linearGradient id="sgSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sgOrbWarm" cx="0.62" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fbe4da" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#edb0a8" stop-opacity="0.16"/>
    </radialGradient>
    <radialGradient id="sgOrbCool" cx="0.62" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.45" stop-color="#e4e0fa" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ab9dee" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="sgOrbShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f7fd8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8f7fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sgSparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sgBlurA" x="-30%" y="-220%" width="160%" height="540%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="sgBlurB" x="-30%" y="-220%" width="160%" height="540%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="sgClipA"><rect x="60" y="240" width="520" height="460" rx="18"/></clipPath>
    <clipPath id="sgClipB"><rect x="620" y="240" width="520" height="460" rx="18"/></clipPath>
  </defs>

  <!-- 册底与册首 -->
  <rect width="1200" height="820" fill="url(#sgGround)"/>
  <text x="60" y="84" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#5c569c" letter-spacing="6">STYLE MASTERY · ONE SYSTEM, TWO CLIMATES</text>
  <text x="60" y="150" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="44" font-weight="700" fill="#37326e" letter-spacing="2">一种光，两种气候</text>
  <text x="60" y="192" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#6b64a8">同一套流光体系 —— 换一个光源与色温，就是一次新的天气</text>

  <!-- ================= 晨光（暖域） ================= -->
  <g data-style-id="dawn" data-mood="warm">
    <rect x="60" y="240" width="520" height="460" rx="18" fill="url(#sgDawnBase)" stroke="#37326e" stroke-opacity="0.08" stroke-width="1"/>
    <g clip-path="url(#sgClipA)">
      <circle cx="450" cy="300" r="280" fill="url(#sgDawnBloom)"/>
      <path d="M 20 660 C 180 620 260 480 400 470 S 560 400 604 330" fill="none" stroke="url(#sgRibbonWarm)" stroke-width="64" stroke-linecap="round" opacity="0.5" filter="url(#sgBlurA)"/>
      <path d="M 20 640 C 180 602 268 462 406 452 S 566 386 604 314" fill="none" stroke="url(#sgSheen)" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
      <circle cx="40" cy="700" r="150" fill="url(#sgOrbWarm)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.1"/>
      <g data-motif="dawn-orbs" data-motif-message="暖域浮球服从右上的晨光，彼此以细线相连">
        <path d="M 500 378 Q 470 470 442 540" fill="none" stroke="#8a5f74" stroke-opacity="0.35" stroke-width="1"/>
        <ellipse cx="430" cy="618" rx="34" ry="7.5" fill="url(#sgOrbShadow)"/>
        <circle cx="430" cy="560" r="48" fill="url(#sgOrbWarm)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
        <circle cx="414" cy="540" r="5.5" fill="#ffffff" fill-opacity="0.92"/>
        <circle cx="508" cy="360" r="18" fill="url(#sgOrbWarm)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
        <circle cx="502" cy="354" r="2.6" fill="#ffffff" fill-opacity="0.95"/>
        <circle cx="400" cy="468" r="14" fill="url(#sgSparkGlow)"/>
        <path d="M400 459 C 401.5 466.5 401.5 466.5 409 468 C 401.5 469.5 401.5 469.5 400 477 C 398.5 469.5 398.5 469.5 391 468 C 398.5 466.5 398.5 466.5 400 459 Z" fill="#ffffff"/>
      </g>
    </g>
    <text x="150" y="460" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="120" font-weight="700" fill="#5e3a54">晨</text>
    <text x="152" y="512" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#6b4a5c" letter-spacing="4">DAWN · 暖域</text>
  </g>

  <!-- ================= 月色（冷域） ================= -->
  <g data-style-id="moonrise" data-mood="cool">
    <rect x="620" y="240" width="520" height="460" rx="18" fill="url(#sgMoonBase)" stroke="#37326e" stroke-opacity="0.08" stroke-width="1"/>
    <g clip-path="url(#sgClipB)">
      <circle cx="1060" cy="300" r="260" fill="url(#sgMoonBloom)"/>
      <path d="M 1180 640 C 1020 610 940 480 800 470 S 640 410 596 340" fill="none" stroke="url(#sgRibbonCool)" stroke-width="64" stroke-linecap="round" opacity="0.5" filter="url(#sgBlurB)"/>
      <path d="M 1180 622 C 1024 594 946 464 806 454 S 646 396 596 326" fill="none" stroke="url(#sgSheen)" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
      <circle cx="1180" cy="680" r="150" fill="url(#sgOrbCool)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.1"/>
      <g data-motif="moonrise-glow" data-motif-message="月亮与冷域浮球服从同一个月光源，彼此以细线相连">
        <path d="M 922 446 Q 850 512 776 556" fill="none" stroke="#6b64a8" stroke-opacity="0.35" stroke-width="1"/>
        <circle cx="1035" cy="320" r="28" fill="url(#sgMoonDisc)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
        <ellipse cx="760" cy="628" rx="34" ry="7.5" fill="url(#sgOrbShadow)"/>
        <circle cx="760" cy="570" r="48" fill="url(#sgOrbCool)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
        <circle cx="744" cy="550" r="5.5" fill="#ffffff" fill-opacity="0.92"/>
        <circle cx="930" cy="430" r="18" fill="url(#sgOrbCool)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
        <circle cx="924" cy="424" r="2.6" fill="#ffffff" fill-opacity="0.95"/>
        <circle cx="806" cy="468" r="14" fill="url(#sgSparkGlow)"/>
        <path d="M806 459 C 807.5 466.5 807.5 466.5 815 468 C 807.5 469.5 807.5 469.5 806 477 C 804.5 469.5 804.5 469.5 797 468 C 804.5 466.5 804.5 466.5 806 459 Z" fill="#ffffff"/>
      </g>
    </g>
    <text x="950" y="460" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="120" font-weight="700" fill="#3d3a6e">月</text>
    <text x="1070" y="512" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#4d4880" letter-spacing="4">MOONRISE · 冷域</text>
  </g>

  <!-- 题注与册尾 -->
  <text x="60" y="740" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5c569c">晨光 —— 日光从玫瑰金里升起，丝带是暖域的</text>
  <text x="1140" y="740" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5c569c">月色 —— 月光在紫罗兰里沉降，丝带是冷域的</text>
  <line x1="60" y1="768" x2="1140" y2="768" stroke="#37326e" stroke-opacity="0.1" stroke-width="1"/>
  <text x="60" y="796" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5c569c">色彩配方、光规则与手势纪律：references/premium-craft.md</text>
  <text x="1140" y="796" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-size="11" font-style="italic" fill="#5c569c" letter-spacing="3">DREAMLIGHT SYSTEM</text>
</svg>
