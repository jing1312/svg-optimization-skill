<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>V2 Dreamlight Hero</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080B18"/><stop offset="1" stop-color="#1B2140"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8BE9FF" stop-opacity=".35"/><stop offset="1" stop-color="#8BE9FF" stop-opacity="0"/></radialGradient>
  </defs>
  <g data-style-id="dreamlight" data-palette="night" data-layout="hero">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="820" cy="250" r="260" fill="url(#glow)"/>
    <path d="M260 390 C450 220 650 520 940 300" fill="none" stroke="#8BE9FF" stroke-opacity=".55" stroke-width="3"/>
    <text x="100" y="260" fill="white" font-size="72" font-family="Inter, sans-serif" font-weight="700">Visual System</text>
    <text x="104" y="330" fill="#B8C2D9" font-size="20" font-family="Inter, sans-serif">SVG beyond decoration</text>
  </g>
</svg>