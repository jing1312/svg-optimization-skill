<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="v2dh">
  <title id="v2dh">V2 Dreamlight Hero</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080B18"/><stop offset="1" stop-color="#1B2140"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8BE9FF" stop-opacity=".35"/><stop offset="1" stop-color="#8BE9FF" stop-opacity="0"/></radialGradient>
  </defs>
  <g data-style-id="dreamlight" data-palette="night" data-layout="hero">
    <rect width="1200" height="560" fill="url(#bg)"/>
    <circle cx="820" cy="220" r="240" fill="url(#glow)"/>
    <path d="M260 350 C450 180 650 480 940 260" fill="none" stroke="#8BE9FF" stroke-opacity=".55" stroke-width="3"/>
    <!-- font-size 72 = display token; subtitle 18 = body token; gap = 72 × 1.45 = 104 -->
    <text x="100" y="240" fill="white" font-size="72" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-weight="700">Visual System</text>
    <text x="104" y="344" fill="#B8C2D9" font-size="18" font-family="system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">SVG beyond decoration</text>
  </g>
</svg>
