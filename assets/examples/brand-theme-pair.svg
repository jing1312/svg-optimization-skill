  </g>
  <g filter="url(#pairShadow)"><rect x="578" y="320" width="510" height="286" rx="22" fill="#fbfffb"/><rect x="604" y="346" width="50" height="50" rx="15" fill="url(#summerAccent)" stroke="#fff" stroke-opacity=".72"/><circle cx="629" cy="371" r="30" fill="none" stroke="#efaa55" stroke-opacity=".25"/><g transform="translate(616 358) scale(1.55)" fill="none" stroke="#fff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="m16 12 2 2 4-4"/><path d="M22 6V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2h4.001A2 2 0 0 0 22 17v-1.344"/></g><text x="672" y="368" font-size="18" font-weight="700" fill="#176b68">开卷助手</text><text x="672" y="390" font-size="13" fill="#5b8b86">页面就绪 · 24/24</text><rect x="604" y="423" width="458" height="54" rx="16" fill="#e3faf0"/><circle cx="632" cy="450" r="13" fill="#27af9c"/><path d="m626 450 4 4 8-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="656" y="446" font-size="14" font-weight="700" fill="#176b68">同步完成</text><text x="656" y="466" font-size="12" fill="#5b8b86">已处理 24/24 个章节，可关闭窗口</text><rect x="604" y="500" width="210" height="42" rx="21" fill="#159b9d"/><text x="709" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">整理章节资料</text><rect x="830" y="500" width="210" height="42" rx="21" fill="#fff" stroke="#efaa55" stroke-width="2"/><text x="935" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#d97947">导出复习提纲</text></g>
