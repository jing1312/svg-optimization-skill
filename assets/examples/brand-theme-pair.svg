<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">开卷助手梦幻极光与夏日汽水主题套系</title>
  <desc id="desc">同一品牌语义在两个主题中的完整套系预览：梦幻极光与夏日汽水，各自包含 banner 和弹窗局部。</desc>
  <defs>
    <linearGradient id="dreamBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6c61cd"/><stop offset=".52" stop-color="#b98bdc"/><stop offset="1" stop-color="#f4a99e"/></linearGradient>
    <linearGradient id="summerBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45d5ca"/><stop offset=".55" stop-color="#8eeac4"/><stop offset="1" stop-color="#ffd46b"/></linearGradient>
    <linearGradient id="dreamAccent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8878df"/><stop offset="1" stop-color="#ef9d9a"/></linearGradient>
    <linearGradient id="summerAccent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1cabb3"/><stop offset="1" stop-color="#efaa55"/></linearGradient>
    <pattern id="dreamTexture" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="1.2" fill="#fff" fill-opacity=".22"/><circle cx="21" cy="25" r="1" fill="#fff" fill-opacity=".16"/><path d="M29 4c3 2 4 5 3 8" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1"/></pattern>
    <pattern id="summerTexture" width="46" height="46" patternUnits="userSpaceOnUse"><circle cx="9" cy="12" r="3" fill="#fff" fill-opacity=".14"/><circle cx="33" cy="31" r="2" fill="#fff" fill-opacity=".18"/><path d="M16 42c5-7 11-7 16 0" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/></pattern>
    <filter id="pairShadow" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5c4b69" flood-opacity=".2"/></filter>
    <clipPath id="dreamBanner"><rect x="32" y="112" width="510" height="184" rx="22"/></clipPath>
    <clipPath id="summerBanner"><rect x="578" y="112" width="510" height="184" rx="22"/></clipPath>
  </defs>
  <rect width="1120" height="680" fill="#fcf8f4"/>
  <text x="48" y="58" font-size="28" font-weight="700" fill="#342e3c">同一品牌，两个季节主题</text>
  <text x="48" y="86" font-size="15" fill="#817786">共享 Logo、文案和信息结构，只切换颜色、光线与装饰语言</text>

  <text x="32" y="101" font-size="16" font-weight="700" fill="#7568c8">J · 梦幻极光</text>
