    <rect x="32" y="112" width="510" height="184" fill="url(#dreamTexture)" opacity=".62"/>
    <circle cx="68" cy="112" r="76" fill="#fff" fill-opacity=".18"/><circle cx="542" cy="292" r="118" fill="#ffd6c6" fill-opacity=".24"/>
    <path d="M8 270c100-85 165 42 260-41s178-5 298-64" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="18"/>
    <path d="M8 281c100-72 169 39 263-36s176-4 296-56" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
