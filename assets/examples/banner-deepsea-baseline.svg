<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">知了学习 banner：知识组织与核验助手，深海气泡基线版</title>
  <desc>深海色渐变 banner：左侧为语义化 Logo（翻开的知识材料 + 核验），右侧文案说明把章节连成关系网。</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2740"/>
      <stop offset="0.55" stop-color="#0e3a5c"/>
      <stop offset="1" stop-color="#14537e"/>
    </linearGradient>
    <radialGradient id="haloCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ee8e0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7ee8e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubbleGrad" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#7dd3fc" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="logoHaloA" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4f7c"/>
      <stop offset="1" stop-color="#123759"/>
    </linearGradient>
    <linearGradient id="shieldA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="liftA" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#67e8f9" flood-opacity="0.28"/>
    </filter>
    <clipPath id="edgeClip"><rect x="0" y="0" width="1100" height="300" rx="0"/></clipPath>
    <clipPath id="tileClipA"><rect x="16" y="16" width="64" height="64" rx="20"/></clipPath>
    <!-- Logo glyph adapted from Lucide book-open-check, ISC license (see THIRD_PARTY_NOTICES.md) -->
    <symbol id="logoA" viewBox="0 0 96 96">
      <circle cx="48" cy="46" r="44" fill="url(#logoHaloA)"/>
      <circle cx="48" cy="48" r="40" fill="none" stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 7"/>
      <circle cx="48" cy="8" r="4.5" fill="#7dd3fc" stroke="#0a2740" stroke-width="1.5"/>
      <circle cx="88" cy="48" r="4.5" fill="#f0abfc" stroke="#0a2740" stroke-width="1.5"/>
      <circle cx="48" cy="88" r="4.5" fill="#a5f3fc" stroke="#0a2740" stroke-width="1.5"/>
      <circle cx="8" cy="48" r="4.5" fill="#7ee8e0" stroke="#0a2740" stroke-width="1.5"/>
      <rect x="16" y="16" width="64" height="64" rx="20" fill="url(#tileA)" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="1.2" filter="url(#liftA)"/>
      <rect x="21" y="21" width="54" height="54" rx="16" fill="none" stroke="#a5f3fc" stroke-opacity="0.35" stroke-width="1.4"/>
      <path d="M48 39.5c-2.5-2-5.4-2.7-9.2-2.7h-6.3v18.4h6.3c3.8 0 6.7.7 9.2 2.7z" fill="#e8f7ff" fill-opacity="0.14" stroke="#e0f2fe" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M48 39.5c2.5-2 5.4-2.7 9.2-2.7h6.3v18.4H57c-3.8 0-6.7.7-9.2 2.7z" fill="#e8f7ff" fill-opacity="0.14" stroke="#e0f2fe" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M39.5 48.5l5 5 12-12" fill="none" stroke="#0e3a5c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
      <path d="M39.5 48.5l5 5 12-12" fill="none" stroke="#67e8f9" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g clip-path="url(#tileClipA)"><rect x="16" y="16" width="64" height="26" fill="#ffffff" opacity="0.14"/></g>
      <path d="M66 55l9 3.2v6.3c0 5.3-3.8 8.9-9 10.5-5.2-1.6-9-5.2-9-10.5v-6.3z" fill="url(#shieldA)" stroke="#0a2740" stroke-width="1.4"/>
      <path d="M61.6 64.6l3 3 5.8-5.8" fill="none" stroke="#0a2740" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1100" height="300" fill="url(#bgGrad)"/>
  <ellipse cx="170" cy="40" rx="360" ry="200" fill="url(#haloCyan)"/>
  <ellipse cx="980" cy="290" rx="420" ry="220" fill="url(#haloTeal)"/>

  <g data-role="edge-clipped-bubbles" clip-path="url(#edgeClip)">
    <circle cx="55" cy="300" r="95" fill="url(#bubbleGrad)"/>
    <circle cx="1100" cy="228" r="120" fill="url(#bubbleGrad)"/>
    <circle cx="1052" cy="26" r="72" fill="url(#bubbleGrad)"/>
    <circle cx="215" cy="-42" r="84" fill="url(#bubbleGrad)"/>
    <circle cx="640" cy="316" r="70" fill="url(#bubbleGrad)"/>
    <circle cx="902" cy="96" r="9" fill="none" stroke="#a5f3fc" stroke-opacity="0.5" stroke-width="1.4"/>
    <circle cx="952" cy="58" r="5" fill="none" stroke="#a5f3fc" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="330" cy="252" r="7" fill="none" stroke="#a5f3fc" stroke-opacity="0.42" stroke-width="1.3"/>
    <circle cx="60" cy="64" r="6" fill="none" stroke="#a5f3fc" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>

  <g data-role="logo" data-logo-intent="knowledge verification" data-icon-source="lucide" data-icon-name="book-open-check" data-icon-license="ISC" data-logo-secondary-motif="chapter relationship + verification shield">
    <use href="#logoA" x="64" y="88" width="120" height="120"/>
  </g>

  <text data-role="banner-title" x="226" y="130" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="40" font-weight="600" fill="#f2fbff" letter-spacing="1">知了学习 · 知识组织与核验助手</text>
  <text x="228" y="176" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" fill="#cfe8ff" opacity="0.95">把章节连成关系网，让每次复习都有据可查</text>

  <g data-motif="chapter-relations" data-motif-message="章节节点连成可核验的知识关系网" transform="translate(872 214)" stroke="#7dd3fc" fill="none" stroke-width="1.6">
    <path d="M8 26C36 6 78 6 106 26" stroke-opacity="0.55" stroke-dasharray="4 6"/>
    <circle cx="8" cy="26" r="6" fill="#123759"/>
    <circle cx="57" cy="11" r="7" fill="#123759"/>
    <circle cx="106" cy="26" r="6" fill="#123759"/>
    <path d="M54 11l2.4 2.4 5-5" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
