<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">开卷助手 J/K 主题 Logo 精修</title>
  <desc id="desc">同一个 book-open-check 语义标记在梦幻极光和夏日汽水主题中的精修版本，保持统一靛蓝 Logo 色，只改变光线、材质与温度。</desc>
  <defs>
    <linearGradient id="brandTile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A79AE8"/><stop offset=".55" stop-color="#5F61C7"/><stop offset="1" stop-color="#383B73"/></linearGradient>
    <radialGradient id="indigoBloom"><stop stop-color="#A79AE8" stop-opacity=".34"/><stop offset="1" stop-color="#A79AE8" stop-opacity="0"/></radialGradient>
    <radialGradient id="warmBloom"><stop stop-color="#E8A38F" stop-opacity=".24"/><stop offset="1" stop-color="#E8A38F" stop-opacity="0"/></radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".42"/><stop offset=".42" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="logoShadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#54516F" flood-opacity=".18"/></filter>
  </defs>
  <rect width="960" height="430" fill="#F5F3F0"/>
  <text x="48" y="54" font-size="13" font-weight="700" letter-spacing="2" fill="#5F61C7">SAME MEANING / TWO MOODS</text>
  <text x="48" y="96" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#24263A">Logo 精修：识别度来自层次</text>
  <text x="48" y="123" font-size="15" fill="#686979">固定 book-open-check 轮廓，调整外环、内衬、光晕与光学留白。</text>

  <g transform="translate(48 160)" data-role="logo-variant" data-logo-intent="knowledge verification" data-logo-secondary-motif="chapter relationship + verification shield" data-icon-source="lucide" data-icon-name="book-open-check" data-icon-license="ISC">
    <rect width="408" height="220" rx="22" fill="#FBFAF8" stroke="#D8D8E5"/>
    <circle cx="112" cy="102" r="78" fill="url(#indigoBloom)"/>
    <circle cx="112" cy="102" r="64" fill="none" stroke="#A79AE8" stroke-opacity=".38" stroke-width="1.5"/>
    <path d="M58 91 112 50 169 95" fill="none" stroke="#5F61C7" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="91" r="4" fill="#5F61C7"/><circle cx="112" cy="50" r="4" fill="#A79AE8"/><circle cx="169" cy="95" r="4" fill="#56B59A"/>
    <rect x="55" y="45" width="114" height="114" rx="32" fill="url(#brandTile)" filter="url(#logoShadow)"/>
    <rect x="62" y="52" width="100" height="100" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity=".55"/>
    <path d="M70 57h84c-10 19-28 31-52 35-17 3-28 0-37-7Z" fill="url(#gloss)" opacity=".7"/>
    <path d="M112 78l22 9v18c0 15-10 25-22 32-12-7-22-17-22-32V87Z" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".24" stroke-width="1.5"/>
    <g data-role="logo-glyph" transform="translate(79 69) scale(2.8)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="m16 12 2 2 4-4"/><path d="M22 6V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2h4.001A2 2 0 0 0 22 17v-1.344"/></g>
    <text x="214" y="82" font-size="12" font-weight="700" letter-spacing="2" fill="#5F61C7">J · DREAMY AURORA</text>
    <text x="214" y="119" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700" fill="#24263A">梦幻极光</text>
    <text x="214" y="148" font-size="14" fill="#686979">柔和、漂浮、带一点</text><text x="214" y="168" font-size="14" fill="#686979">夜间学习的安静感。</text>
    <path d="M214 194h128" stroke="#A79AE8" stroke-width="2"/><circle cx="214" cy="194" r="3" fill="#5F61C7"/>
  </g>

  <g transform="translate(504 160)" data-role="logo-variant" data-logo-intent="knowledge verification" data-logo-secondary-motif="chapter relationship + verification shield" data-icon-source="lucide" data-icon-name="book-open-check" data-icon-license="ISC">
    <rect width="408" height="220" rx="22" fill="#FBFAF8" stroke="#D8D8E5"/>
    <circle cx="112" cy="102" r="78" fill="url(#warmBloom)"/>
    <circle cx="112" cy="102" r="64" fill="none" stroke="#E8A38F" stroke-opacity=".38" stroke-width="1.5"/>
    <path d="M58 91 112 50 169 95" fill="none" stroke="#5F61C7" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="91" r="4" fill="#5F61C7"/><circle cx="112" cy="50" r="4" fill="#A79AE8"/><circle cx="169" cy="95" r="4" fill="#56B59A"/>
    <rect x="55" y="45" width="114" height="114" rx="32" fill="url(#brandTile)" filter="url(#logoShadow)"/>
    <rect x="62" y="52" width="100" height="100" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity=".62"/>
    <path d="M70 57h84c-10 19-28 31-52 35-17 3-28 0-37-7Z" fill="url(#gloss)" opacity=".62"/>
    <path d="M112 78l22 9v18c0 15-10 25-22 32-12-7-22-17-22-32V87Z" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="1.5"/>
    <g data-role="logo-glyph" transform="translate(79 69) scale(2.8)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="m16 12 2 2 4-4"/><path d="M22 6V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2h4.001A2 2 0 0 0 22 17v-1.344"/></g>
    <text x="214" y="82" font-size="12" font-weight="700" letter-spacing="2" fill="#5F61C7">K · SUMMER SODA</text>
    <text x="214" y="119" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700" fill="#24263A">夏日汽水</text>
    <text x="214" y="148" font-size="14" fill="#686979">轻快、清爽、带一点</text><text x="214" y="168" font-size="14" fill="#686979">白天学习的明亮感。</text>
    <path d="M214 194h128" stroke="#E8A38F" stroke-width="2"/><circle cx="214" cy="194" r="3" fill="#5F61C7"/>
  </g>
</svg>
