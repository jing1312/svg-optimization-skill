<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">开卷助手 J/K 主题 Logo 精修</title>
  <desc id="desc">同一个 book-open-check 语义标记在梦幻极光和夏日汽水主题中的精修版本，包含外环、内衬、光晕与清晰的字标节奏。</desc>
  <defs>
    <linearGradient id="dreamTile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8578df"/><stop offset=".55" stop-color="#bc91df"/><stop offset="1" stop-color="#ef9e9e"/></linearGradient>
    <linearGradient id="summerTile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2db8b5"/><stop offset="1" stop-color="#efa75e"/></linearGradient>
    <filter id="logoShadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#5b526b" flood-opacity=".18"/></filter>
  </defs>
  <rect width="960" height="430" fill="#fbfaf8"/>
  <text x="48" y="54" font-size="13" font-weight="700" letter-spacing="2" fill="#8e6fa5">SAME MEANING / TWO MOODS</text>
  <text x="48" y="96" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#2f304b">Logo 精修：识别度来自层次</text>
  <text x="48" y="123" font-size="15" fill="#77758b">固定 book-open-check 轮廓，调整外环、内衬、光晕与光学留白。</text>

  <g transform="translate(48 160)" data-role="logo-variant" data-logo-intent="knowledge verification" data-icon-source="lucide" data-icon-name="book-open-check" data-icon-license="ISC">
    <rect width="408" height="220" rx="22" fill="#f5effb" stroke="#dfd1ef"/>
    <circle cx="112" cy="102" r="82" fill="#d5b7ed" fill-opacity=".25"/>
    <circle cx="112" cy="102" r="68" fill="none" stroke="#b58ed9" stroke-opacity=".44" stroke-width="1.5"/>
    <rect x="55" y="45" width="114" height="114" rx="32" fill="url(#dreamTile)" filter="url(#logoShadow)"/>
    <rect x="62" y="52" width="100" height="100" rx="27" fill="none" stroke="#fff" stroke-opacity=".55"/>
    <g data-role="logo-glyph" transform="translate(79 69) scale(2.8)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="m16 12 2 2 4-4"/><path d="M22 6V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2h4.001A2 2 0 0 0 22 17v-1.344"/></g>
    <text x="214" y="82" font-size="12" font-weight="700" letter-spacing="2" fill="#8068a9">J · DREAMY AURORA</text>
    <text x="214" y="119" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700" fill="#43395e">梦幻极光</text>
    <text x="214" y="148" font-size="14" fill="#796e8d">柔和、漂浮、带一点</text><text x="214" y="168" font-size="14" fill="#796e8d">夜间学习的安静感。</text>
    <path d="M214 194h128" stroke="#b89bd7" stroke-width="2"/><circle cx="214" cy="194" r="3" fill="#8068a9"/>
  </g>

  <g transform="translate(504 160)" data-role="logo-variant" data-logo-intent="knowledge verification" data-icon-source="lucide" data-icon-name="book-open-check" data-icon-license="ISC">
    <rect width="408" height="220" rx="22" fill="#effaf4" stroke="#c9e9d9"/>
    <circle cx="112" cy="102" r="82" fill="#aee5cb" fill-opacity=".3"/>
    <circle cx="112" cy="102" r="68" fill="none" stroke="#73c6ad" stroke-opacity=".48" stroke-width="1.5"/>
    <rect x="55" y="45" width="114" height="114" rx="32" fill="url(#summerTile)" filter="url(#logoShadow)"/>
    <rect x="62" y="52" width="100" height="100" rx="27" fill="none" stroke="#fff" stroke-opacity=".62"/>
    <g data-role="logo-glyph" transform="translate(79 69) scale(2.8)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="m16 12 2 2 4-4"/><path d="M22 6V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2h4.001A2 2 0 0 0 22 17v-1.344"/></g>
    <text x="214" y="82" font-size="12" font-weight="700" letter-spacing="2" fill="#3d907b">K · SUMMER SODA</text>
    <text x="214" y="119" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700" fill="#31524d">夏日汽水</text>
    <text x="214" y="148" font-size="14" fill="#678078">轻快、清爽、带一点</text><text x="214" y="168" font-size="14" fill="#678078">白天学习的明亮感。</text>
    <path d="M214 194h128" stroke="#83c9ad" stroke-width="2"/><circle cx="214" cy="194" r="3" fill="#3d907b"/>
  </g>
</svg>
