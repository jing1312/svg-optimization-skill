    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="dreamClip"><rect x="22" y="104" width="338" height="188" rx="20"/></clipPath>
    <clipPath id="summerClip"><rect x="392" y="104" width="338" height="188" rx="20"/></clipPath>
    <clipPath id="warmClip"><rect x="762" y="104" width="338" height="188" rx="20"/></clipPath>
