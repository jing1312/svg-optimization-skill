    <linearGradient id="dream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#383B73"/><stop offset=".48" stop-color="#5F61C7"/><stop offset="1" stop-color="#A79AE8"/></linearGradient>
    <linearGradient id="summer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5F61C7"/><stop offset=".52" stop-color="#A79AE8"/><stop offset="1" stop-color="#E8A38F"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#383B73"/><stop offset=".5" stop-color="#E8A38F"/><stop offset="1" stop-color="#F5F3F0"/></linearGradient>
    <linearGradient id="brandMini" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A79AE8"/><stop offset="1" stop-color="#5F61C7"/></linearGradient>
    <linearGradient id="warmMini" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5F61C7"/><stop offset="1" stop-color="#383B73"/></linearGradient>
