<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">开卷助手风格方向对比</title>
  <desc id="desc">三个保持相同内容的完整视觉方向：深海玻璃、活力学习和瑞士编辑，分别包含 banner 缩略图与弹窗局部。</desc>
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b43"/><stop offset="1" stop-color="#075e73"/></linearGradient>
    <linearGradient id="vital" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe66d"/><stop offset="1" stop-color="#ff8a5b"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f5ec"/><stop offset="1" stop-color="#e9e2d3"/></linearGradient>
    <clipPath id="deepClip"><rect x="22" y="100" width="338" height="190" rx="16"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1120" height="620" fill="#eef2f4"/>
  <text x="56" y="58" font-size="28" font-weight="700" fill="#14212b">选择完整视觉方向</text>
  <text x="56" y="84" font-size="15" fill="#65727d">相同内容、相同 Logo 语义，比较构图、材质、动势与气质</text>

