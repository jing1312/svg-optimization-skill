  <g transform="translate(762 0)">
    <text x="0" y="90" font-size="16" font-weight="700" fill="#1d5aa6">D · 瑞士编辑</text>
    <rect x="0" y="100" width="338" height="190" rx="16" fill="url(#paper)" stroke="#d4cbbd"/><path d="M22 126h294M22 140h210" stroke="#1d5aa6" stroke-width="2"/><text x="22" y="181" font-size="29" font-weight="700" fill="#17212b">开卷助手</text><text x="22" y="208" font-size="12" fill="#5c6972">整理课程资料 · 生成复习提纲</text><path d="M22 230h132" stroke="#e24b3b" stroke-width="4"/><rect x="266" y="154" width="54" height="54" fill="#1d5aa6"/><g transform="translate(276 164) scale(1.55)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16"/><path d="m16 12 2 2 4-4"/><path d="M22 6V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2h4.001A2 2 0 0 0 22 17v-1.344"/></g><text x="22" y="258" font-size="10" fill="#1d5aa6">01  KNOWLEDGE VERIFICATION</text>
