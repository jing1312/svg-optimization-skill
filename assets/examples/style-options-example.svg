    <linearGradient id="summer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4edbd0"/><stop offset=".52" stop-color="#8de9c1"/><stop offset="1" stop-color="#ffd66d"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd5f62"/><stop offset=".5" stop-color="#ef9274"/><stop offset="1" stop-color="#ffd19a"/></linearGradient>
    <linearGradient id="dreamMini" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7de0"/><stop offset="1" stop-color="#f3a89f"/></linearGradient>
    <linearGradient id="summerMini" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2cb7ba"/><stop offset="1" stop-color="#f5bd58"/></linearGradient>
    <linearGradient id="warmMini" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a94f5a"/><stop offset="1" stop-color="#e9866d"/></linearGradient>
