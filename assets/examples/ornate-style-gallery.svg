<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">开卷助手丰富梦幻插画样板</title>
  <desc id="desc">六张浅色渐变卡片，分别展示知识星座、资料转提纲、复习路径、记忆卡片、课堂波形和资料导出包，使用多层光晕与语义化线稿。</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefaff"/><stop offset="1" stop-color="#d5edf7"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3f8"/><stop offset="1" stop-color="#f5dce9"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effcf5"/><stop offset="1" stop-color="#d4f0e3"/></linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf7ff"/><stop offset="1" stop-color="#e8e2f8"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6ed"/><stop offset="1" stop-color="#f8e3cb"/></linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbfb"/><stop offset="1" stop-color="#d9edf3"/></linearGradient>
    <radialGradient id="blueGlow"><stop stop-color="#a4d9ee" stop-opacity=".78"/><stop offset="1" stop-color="#a4d9ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="roseGlow"><stop stop-color="#f0b6cf" stop-opacity=".7"/><stop offset="1" stop-color="#f0b6cf" stop-opacity="0"/></radialGradient>
    <radialGradient id="mintGlow"><stop stop-color="#a4ddc1" stop-opacity=".72"/><stop offset="1" stop-color="#a4ddc1" stop-opacity="0"/></radialGradient>
    <radialGradient id="lilacGlow"><stop stop-color="#c3b8e8" stop-opacity=".72"/><stop offset="1" stop-color="#c3b8e8" stop-opacity="0"/></radialGradient>
    <radialGradient id="peachGlow"><stop stop-color="#f2c18d" stop-opacity=".62"/><stop offset="1" stop-color="#f2c18d" stop-opacity="0"/></radialGradient>
    <radialGradient id="aquaGlow"><stop stop-color="#9bd9d6" stop-opacity=".68"/><stop offset="1" stop-color="#9bd9d6" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#718397" flood-opacity=".16"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <style>.line{fill:none;stroke-linecap:round;stroke-linejoin:round}.body{font-size:13px}.micro{font-size:10px;font-weight:700;letter-spacing:1.5px}</style>
  </defs>
  <rect width="1200" height="800" fill="#fbfaf8"/>
  <text x="48" y="52" class="micro" fill="#8e6fa5">KAĪJUAN / ORNATE MOTIF GALLERY</text>
  <text x="48" y="94" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#2f304b">开卷助手 · 丰富但不杂乱</text>
  <text x="48" y="121" class="body" fill="#77758b">六种主插画，统一线稿、柔光、淡出与文字层级；每个装饰都对应一个产品动作。</text>

  <g filter="url(#shadow)"><rect x="40" y="150" width="540" height="190" rx="20" fill="url(#blue)" stroke="#c3e0ec"/><rect x="58" y="168" width="504" height="154" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/><text x="78" y="198" class="micro" fill="#477da1">CHAPTER RELATIONSHIP</text><text x="78" y="235" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700" fill="#2e3557">章节关系</text><text x="78" y="262" class="body" fill="#68758a">章节、概念和核验状态</text><text x="78" y="281" class="body" fill="#68758a">在同一张知识地图上汇合。</text><path d="M78 310h205" stroke="#8dbbd3" stroke-width="2"/><circle cx="78" cy="310" r="3" fill="#477da1"/>
    <circle cx="459" cy="245" r="91" fill="url(#blueGlow)"/><circle cx="459" cy="245" r="69" fill="none" stroke="#77adc7" stroke-opacity=".32"/><path class="line" d="M405 224c18-40 54-52 82-29 26 22 44 42 69 54M412 280c25-19 52-9 67 13 17 25 44 24 72 0" stroke="#6e9ab5" stroke-opacity=".54" stroke-width="2"/><path class="line" d="M459 199l32 13v31c0 24-16 38-32 48-16-10-32-24-32-48v-31Z" fill="#fff" fill-opacity=".55" stroke="#5b7fa6" stroke-width="2"/><path class="line" d="m443 240 11 11 22-25" stroke="#42aaa8" stroke-width="4"/><circle cx="405" cy="224" r="7" fill="#8bb7d5" stroke="#5b7fa6"/><circle cx="491" cy="212" r="7" fill="#ef9cae" stroke="#a96583"/><circle cx="556" cy="249" r="7" fill="#7dc5b5" stroke="#4b9b92"/><circle cx="412" cy="280" r="7" fill="#f0ad63" stroke="#c47d44"/></g>

  <g filter="url(#shadow)"><rect x="620" y="150" width="540" height="190" rx="20" fill="url(#rose)" stroke="#edcede"/><rect x="638" y="168" width="504" height="154" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/><text x="658" y="198" class="micro" fill="#ad5d78">SOURCE TO OUTLINE</text><text x="658" y="235" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700" fill="#493452">提纲生成</text><text x="658" y="262" class="body" fill="#7d6c80">原始资料折叠成层级，</text><text x="658" y="281" class="body" fill="#7d6c80">再交给复习卡片继续核验。</text><path d="M658 310h205" stroke="#e1a6bd" stroke-width="2"/><circle cx="658" cy="310" r="3" fill="#ad5d78"/>
    <circle cx="1042" cy="246" r="92" fill="url(#roseGlow)"/><g transform="translate(925 194)"><rect x="0" y="28" width="90" height="70" rx="9" fill="#fff" fill-opacity=".56" stroke="#bf6f94" stroke-width="2"/><path d="M16 48h52M16 63h39M16 78h47" stroke="#bf6f94" stroke-opacity=".72" stroke-width="2.5" stroke-linecap="round"/><rect x="38" y="0" width="90" height="70" rx="9" fill="#fff" fill-opacity=".86" stroke="#8175bc" stroke-width="2"/><path d="M54 21h53M54 36h38M54 51h48" stroke="#8175bc" stroke-opacity=".72" stroke-width="2.5" stroke-linecap="round"/><path class="line" d="M101 111h43" stroke="#bf6f94" stroke-width="2.5"/><path class="line" d="m136 101 11 10-11 10" stroke="#bf6f94" stroke-width="2.5"/><circle cx="128" cy="52" r="10" fill="#7dc5b5"/><path class="line" d="m122 52 5 5 9-10" stroke="#fff" stroke-width="2.5"/></g></g>

  <g filter="url(#shadow)"><rect x="40" y="370" width="540" height="190" rx="20" fill="url(#mint)" stroke="#c4e3d3"/><rect x="58" y="388" width="504" height="154" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/><text x="78" y="418" class="micro" fill="#4d8974">READ / TEST / RECALL</text><text x="78" y="455" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700" fill="#31524d">复习路径</text><text x="78" y="482" class="body" fill="#678078">阅读、练习、回忆三步，</text><text x="78" y="501" class="body" fill="#678078">沿着一条曲线向前推进。</text><path d="M78 530h205" stroke="#89c8ae" stroke-width="2"/><circle cx="78" cy="530" r="3" fill="#4d8974"/>
    <circle cx="459" cy="465" r="92" fill="url(#mintGlow)"/><path class="line" d="M399 509c26-49 52-56 78-34 25 20 45 9 71-48" stroke="#4b9b92" stroke-width="3.5"/><circle cx="399" cy="509" r="16" fill="#fff" stroke="#ef9cae" stroke-width="3"/><path class="line" d="M393 509h12" stroke="#a96583" stroke-width="2"/><circle cx="477" cy="475" r="16" fill="#fff" stroke="#f0ad63" stroke-width="3"/><path class="line" d="m469 475 6 6 10-11" stroke="#c47d44" stroke-width="2"/><circle cx="548" cy="427" r="16" fill="#fff" stroke="#7a70cc" stroke-width="3"/><path class="line" d="M540 427c5-8 11 8 17 0" stroke="#655aa8" stroke-width="2"/></g>

  <g filter="url(#shadow)"><rect x="620" y="370" width="540" height="190" rx="20" fill="url(#lilac)" stroke="#d6cdeb"/><rect x="638" y="388" width="504" height="154" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/><text x="658" y="418" class="micro" fill="#7161a8">CARD VERIFICATION</text><text x="658" y="455" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700" fill="#413d64">卡片核验</text><text x="658" y="482" class="body" fill="#77718e">概念在正面，答案在背面，</text><text x="658" y="501" class="body" fill="#77718e">确认后留下清晰的印记。</text><path d="M658 530h205" stroke="#a69ad2" stroke-width="2"/><circle cx="658" cy="530" r="3" fill="#7161a8"/>
    <circle cx="1042" cy="465" r="94" fill="url(#lilacGlow)"/><g transform="rotate(-7 1037 469)"><rect x="962" y="418" width="112" height="104" rx="13" fill="#fff" stroke="#8175bc" stroke-width="2"/><rect x="974" y="430" width="88" height="78" rx="8" fill="#f7f4ff"/><path d="M991 456h53M991 471h37" stroke="#8175bc" stroke-width="2.5" stroke-linecap="round"/><path class="line" d="m1006 490 8 8 16-18" stroke="#4b9b92" stroke-width="3.5"/><rect x="1020" y="392" width="70" height="44" rx="11" fill="#fff" stroke="#8175bc" stroke-width="2"/><path d="M1034 407h35M1034 419h26" stroke="#8175bc" stroke-width="2.5" stroke-linecap="round"/><circle cx="1078" cy="413" r="7" fill="#7dc5b5"/><path class="line" d="m1074 413 3 3 6-7" stroke="#fff" stroke-width="2"/></g></g>

  <g filter="url(#shadow)"><rect x="40" y="590" width="540" height="170" rx="20" fill="url(#peach)" stroke="#ecd5ba"/><rect x="58" y="608" width="504" height="134" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/><text x="78" y="638" class="micro" fill="#a56f4f">LECTURE TRANSCRIPT</text><text x="78" y="673" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700" fill="#60453e">课堂波形</text><text x="78" y="700" class="body" fill="#80675d">声音、停顿和重点句子被整理成可读节奏。</text>
    <circle cx="468" cy="679" r="72" fill="url(#peachGlow)"/><path class="line" d="M400 687h16v-22h12v42h13v-62h13v78h13v-51h13v31h13v-46h13v30h14" stroke="#c47d70" stroke-width="3"/><path class="line" d="M399 718c33-12 56-10 78 2 28 16 55 8 86-17" stroke="#e7a16d" stroke-width="2"/><circle cx="521" cy="663" r="13" fill="#fff" stroke="#4b9b92" stroke-width="2"/><path d="m517 657 10 6-10 6Z" fill="#4b9b92"/></g>

  <g filter="url(#shadow)"><rect x="620" y="590" width="540" height="170" rx="20" fill="url(#aqua)" stroke="#c7e1e5"/><rect x="638" y="608" width="504" height="134" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/><text x="658" y="638" class="micro" fill="#4a8293">EXPORT PACKAGE</text><text x="658" y="673" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700" fill="#36515a">资料导出包</text><text x="658" y="700" class="body" fill="#67818a">把整理后的内容装进 JSON 与 Markdown 两个出口。</text>
    <circle cx="1042" cy="677" r="74" fill="url(#aquaGlow)"/><path class="line" d="M960 661h52l13 13v45h-65Z" fill="#fff" fill-opacity=".66" stroke="#5e9aa5" stroke-width="2"/><path class="line" d="M960 661h36l8 9h21" stroke="#5e9aa5" stroke-width="2"/><rect x="1008" y="649" width="58" height="28" rx="14" fill="#fff" stroke="#c47d70" stroke-width="1.5"/><text x="1037" y="667" text-anchor="middle" font-size="10" font-weight="700" fill="#a56f4f">JSON</text><rect x="1014" y="689" width="68" height="28" rx="14" fill="#fff" stroke="#4b9b92" stroke-width="1.5"/><text x="1048" y="707" text-anchor="middle" font-size="10" font-weight="700" fill="#357f7d">MARKDOWN</text><path class="line" d="M969 684h23M969 696h28" stroke="#5e9aa5" stroke-width="2"/></g>
</svg>
