<svg xmlns="http://www.w3.org/2000/svg" width="860" height="730" viewBox="0 0 860 730" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/><stop offset="1" stop-color="#2f5fb8"/>
    </linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/><stop offset="1" stop-color="#2f5fb8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#8fb4f5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8fb4f5" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#12294f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="860" height="730" fill="#e9edf4"/>

  <!-- 紧凑浏览器工具栏：44px 高，圆点 r6 + 细地址栏 -->
  <rect x="60" y="20" width="740" height="44" rx="12" fill="#ffffff" stroke="#dfe5ef"/>
  <circle cx="96" cy="42" r="6" fill="#ff5f57"/>
  <circle cx="116" cy="42" r="6" fill="#febc2e"/>
  <circle cx="136" cy="42" r="6" fill="#28c840"/>
  <rect x="170" y="30" width="500" height="24" rx="12" fill="#f2f4f9" stroke="#e3e8f0"/>
  <text x="188" y="46.5" font-size="13" fill="#8a94a6">jingtu-ai.com/smart-teaching</text>

  <!-- 弹窗卡片：560×575，≈65%×79%，近方形 -->
  <g filter="url(#sh)">
    <rect x="150" y="110" width="560" height="575" rx="16" fill="#ffffff"/>

    <!-- ① logo：光晕 + 渐变方块 + 白色手绘闪电字形 -->
    <circle cx="430" cy="218" r="128" fill="url(#halo)"/>
    <rect x="368" y="156" width="124" height="124" rx="25" fill="url(#lg)"/>
    <ellipse cx="430" cy="176" rx="42" ry="10" fill="#ffffff" opacity="0.16"/>
    <path d="M 452 182 L 406 232 h 18 L 406 268 L 474 220 H 444 Z" fill="#ffffff"/>

    <!-- 扩展名标题（logo 底 290 → 标题顶 326，间距 36px） -->
    <text x="430" y="343" font-size="24" font-weight="700" fill="#1c2733" text-anchor="middle">景图题库助手</text>

    <!-- ② 三张状态卡：同绿同宽，小勾选徽章 -->
    <g font-size="15">
      <rect x="174" y="387" width="160" height="58" rx="16" fill="#ecfdf3" stroke="#a7f3d0" stroke-width="1.5"/>
      <circle cx="228" cy="416" r="9" fill="#16a34a"/>
      <path d="M 224.5 416 L 227 418.5 L 232 413" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="262" y="421.5" font-weight="600" fill="#15803d" text-anchor="middle">平台就绪</text>

      <rect x="350" y="387" width="160" height="58" rx="16" fill="#ecfdf3" stroke="#a7f3d0" stroke-width="1.5"/>
      <circle cx="404" cy="416" r="9" fill="#16a34a"/>
      <path d="M 400.5 416 L 403 418.5 L 408 413" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="438" y="421.5" font-weight="600" fill="#15803d" text-anchor="middle">会话就绪</text>

      <rect x="526" y="387" width="160" height="58" rx="16" fill="#ecfdf3" stroke="#a7f3d0" stroke-width="1.5"/>
      <circle cx="580" cy="416" r="9" fill="#16a34a"/>
      <path d="M 576.5 416 L 579 418.5 L 584 413" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="614" y="421.5" font-weight="600" fill="#15803d" text-anchor="middle">权限就绪</text>
    </g>

    <!-- ③ 两个抓取按钮：左右并列，各 248px（44%），16px 间隙 -->
    <rect x="174" y="477" width="248" height="56" rx="12" fill="url(#ic)"/>
    <text x="298" y="510.5" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">抓取章节题库</text>
    <rect x="438" y="477" width="248" height="56" rx="12" fill="#ffffff" stroke="#2f5fb8" stroke-width="1.5"/>
    <text x="562" y="510.5" font-size="16" fill="#2f5fb8" text-anchor="middle">抓取期末考试</text>

    <!-- ④ 进度条 + 进度文字 -->
    <rect x="174" y="565" width="512" height="20" rx="10" fill="#eef1f6"/>
    <rect x="174" y="565" width="512" height="20" rx="10" fill="url(#ic)"/>
    <text x="430" y="605.5" font-size="14" fill="#5b6b82" text-anchor="middle">已完成 113/113 个测试</text>
  </g>
</svg>
