<svg xmlns="http://www.w3.org/2000/svg" width="860" height="730" viewBox="0 0 860 730" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">开卷助手示例弹窗界面</title>
  <desc id="desc">浏览器窗口中的虚构扩展弹窗，展示品牌标题、三项连接状态、两个操作按钮和同步进度。</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ed5d2"/>
      <stop offset="0.52" stop-color="#168ca0"/>
      <stop offset="1" stop-color="#126078"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#168ca0"/>
      <stop offset="1" stop-color="#0f6f85"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#072c3a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="860" height="730" fill="#0b3346"/>
  <rect x="40" y="20" width="780" height="44" rx="8" fill="#123f52" stroke="#2a6171"/>
  <circle cx="72" cy="42" r="6" fill="#ff5f57"/>
  <circle cx="92" cy="42" r="6" fill="#febc2e"/>
  <circle cx="112" cy="42" r="6" fill="#28c840"/>
  <rect x="148" y="30" width="522" height="24" rx="12" fill="#1a5264" stroke="#367687"/>
  <text x="166" y="46.5" font-size="13" fill="#c4e1e6">example.com/study-helper</text>

  <g filter="url(#shadow)">
    <rect x="130" y="92" width="600" height="590" rx="16" fill="#f8fcfc"/>

    <g data-role="logo" data-logo-intent="knowledge verification" data-icon-source="lucide" data-icon-name="book-open-check" data-icon-license="ISC">
      <circle data-role="logo-halo" cx="218" cy="174" r="60" fill="url(#halo)"/>
      <rect data-role="logo-tile" x="174" y="130" width="88" height="88" rx="22" fill="url(#tile)"/>
      <rect x="175" y="131" width="86" height="86" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
      <g data-role="logo-glyph" transform="translate(191.6 147.6) scale(2.2)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v16"/>
        <path d="m16 12 2 2 4-4"/>
        <path d="M22 6V5a2 2 0 0 0-1.999-2L16 3.002A5 5 0 0 0 12 5a5 5 0 0 0-4-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 1.999 2H8a5 5 0 0 1 4 2 5 5 0 0 1 4-2h4.001A2 2 0 0 0 22 17v-1.344"/>
      </g>
    </g>

    <text x="294" y="166" font-size="26" font-weight="700" fill="#172033">开卷助手</text>
    <text x="294" y="193" font-size="14" fill="#5d7880">公开课程资料整理示例</text>
    <line x1="166" y1="238" x2="694" y2="238" stroke="#d9e8e9"/>

    <text x="166" y="266" font-size="16" font-weight="700" fill="#334155">连接状态</text>
    <g font-size="15" font-weight="600">
      <rect x="166" y="282" width="164" height="54" rx="8" fill="#ecfdf3" stroke="#bbf7d0"/>
      <circle cx="190" cy="309" r="9" fill="#16a34a"/>
      <path d="m186.5 309 2.5 2.5 4.8-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="208" y="314.2" fill="#15803d">页面就绪</text>

      <rect x="348" y="282" width="164" height="54" rx="8" fill="#ecfdf3" stroke="#bbf7d0"/>
      <circle cx="372" cy="309" r="9" fill="#16a34a"/>
      <path d="m368.5 309 2.5 2.5 4.8-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="390" y="314.2" fill="#15803d">解析就绪</text>

      <rect x="530" y="282" width="164" height="54" rx="8" fill="#ecfdf3" stroke="#bbf7d0"/>
      <circle cx="554" cy="309" r="9" fill="#16a34a"/>
      <path d="m550.5 309 2.5 2.5 4.8-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="572" y="314.2" fill="#15803d">导出就绪</text>
    </g>

    <text x="166" y="384" font-size="16" font-weight="700" fill="#334155">选择导出范围</text>
    <rect x="166" y="402" width="256" height="56" rx="8" fill="url(#action)"/>
    <text x="294" y="435.6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">整理章节资料</text>
    <rect x="438" y="402" width="256" height="56" rx="8" fill="#ffffff" stroke="#168ca0" stroke-width="1.5"/>
    <text x="566" y="435.6" font-size="16" font-weight="600" fill="#126078" text-anchor="middle">导出复习提纲</text>

    <text x="166" y="510" font-size="16" font-weight="700" fill="#334155">同步进度</text>
    <text x="694" y="510" font-size="14" fill="#475569" text-anchor="end">24 / 24</text>
    <rect x="166" y="526" width="528" height="12" rx="6" fill="#e7edf4"/>
    <rect x="166" y="526" width="528" height="12" rx="6" fill="url(#action)"/>

    <rect x="166" y="574" width="528" height="64" rx="8" fill="#f0fdfa" stroke="#ccfbf1"/>
    <circle cx="194" cy="606" r="7" fill="#0f9f6e"/>
    <text x="214" y="603" font-size="15" font-weight="700" fill="#0f766e">同步完成</text>
    <text x="214" y="623" font-size="14" fill="#4b6f6b">已处理 24/24 个章节，可关闭窗口</text>
  </g>
</svg>
