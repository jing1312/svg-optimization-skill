<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">开卷助手语义插画细节样板</title>
  <desc id="desc">四张统一珍珠表面的卡片，以章节页映射、资料转提纲、读练忆阶段和题面答案映射表达产品动作。</desc>
  <defs>
    <linearGradient id="pearlCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFAF8"/><stop offset="1" stop-color="#F5F3F0"/></linearGradient>
    <radialGradient id="indigoGlow"><stop stop-color="#A79AE8" stop-opacity=".34"/><stop offset="1" stop-color="#A79AE8" stop-opacity="0"/></radialGradient>
    <radialGradient id="warmGlow"><stop stop-color="#E8A38F" stop-opacity=".22"/><stop offset="1" stop-color="#E8A38F" stop-opacity="0"/></radialGradient>
    <radialGradient id="successGlow"><stop stop-color="#56B59A" stop-opacity=".24"/><stop offset="1" stop-color="#56B59A" stop-opacity="0"/></radialGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#54516F" flood-opacity=".14"/></filter>
    <style>
      .motif-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .motif-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-anchor: middle; }
      .body { font-size: 14px; }
    </style>
  </defs>
  <rect width="1160" height="700" fill="#F5F3F0"/>
  <text x="54" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#5F61C7">KAĪJUAN / SEMANTIC ILLUSTRATIONS</text>
  <text x="54" y="102" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#24263A">开卷助手 · 每个元素都有语义</text>
  <text x="54" y="128" class="body" fill="#686979">柔和的背景只负责托住主插画，真正的信息由文档、步骤和状态关系完成。</text>

  <g filter="url(#cardShadow)">
    <rect x="40" y="160" width="520" height="220" rx="20" fill="url(#pearlCard)" stroke="#D8D8E5"/><rect x="58" y="178" width="484" height="184" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity=".78"/>
    <text x="78" y="211" font-size="12" font-weight="700" letter-spacing="2" fill="#5F61C7">CHAPTER RELATIONSHIP</text>
    <text x="78" y="252" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#24263A">章节关系</text>
    <text x="78" y="282" class="body" fill="#686979">章节页通过索引连接到概念卡片，</text><text x="78" y="302" class="body" fill="#686979">核验状态落在真正的关系上。</text>
    <path d="M78 337h220" stroke="#A79AE8" stroke-width="2"/><circle cx="78" cy="337" r="3" fill="#5F61C7"/>
    <g data-motif="chapter-map">
      <circle cx="460" cy="274" r="92" fill="url(#indigoGlow)"/>
      <text x="405" y="220" class="motif-label" fill="#383B73">章节页</text><text x="509" y="220" class="motif-label" fill="#383B73">概念索引</text>
      <path class="motif-line" d="M440 250H474M440 278H474M440 306H474" stroke="#5F61C7" stroke-width="2"/>
      <g transform="translate(370 232)"><rect width="70" height="34" rx="6" fill="#FFFFFF" fill-opacity=".9" stroke="#A79AE8" stroke-width="1.5"/><path d="M56 0v9h14" fill="#F5F3F0" stroke="#A79AE8" stroke-width="1.2"/><text x="35" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#383B73">01</text><path d="M9 23h42M9 28h32" stroke="#686979" stroke-width="1.5" stroke-linecap="round"/></g>
      <g transform="translate(370 260)"><rect width="70" height="34" rx="6" fill="#FFFFFF" fill-opacity=".96" stroke="#56B59A" stroke-width="2"/><path d="M56 0v9h14" fill="#F5F3F0" stroke="#56B59A" stroke-width="1.2"/><text x="35" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#383B73">02</text><path d="M9 23h42M9 28h32" stroke="#686979" stroke-width="1.5" stroke-linecap="round"/></g>
      <g transform="translate(370 288)"><rect width="70" height="34" rx="6" fill="#FFFFFF" fill-opacity=".9" stroke="#A79AE8" stroke-width="1.5"/><path d="M56 0v9h14" fill="#F5F3F0" stroke="#A79AE8" stroke-width="1.2"/><text x="35" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#383B73">03</text><path d="M9 23h42M9 28h32" stroke="#686979" stroke-width="1.5" stroke-linecap="round"/></g>
      <g><rect x="474" y="232" width="70" height="94" rx="10" fill="#FFFFFF" fill-opacity=".94" stroke="#5F61C7" stroke-width="2"/><rect x="486" y="244" width="44" height="8" rx="4" fill="#D8D8E5"/><path d="M486 267h43M486 279h34M486 291h39" stroke="#686979" stroke-width="2" stroke-linecap="round"/><path class="motif-line" d="m490 306 7 7 13-15" stroke="#56B59A" stroke-width="3"/><text x="509" y="343" class="motif-label" fill="#383B73">关系已确认</text></g>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="600" y="160" width="520" height="220" rx="20" fill="url(#pearlCard)" stroke="#D8D8E5"/><rect x="618" y="178" width="484" height="184" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity=".78"/>
    <text x="638" y="211" font-size="12" font-weight="700" letter-spacing="2" fill="#5F61C7">SOURCE TO OUTLINE</text>
    <text x="638" y="252" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#24263A">提纲生成</text>
    <text x="638" y="282" class="body" fill="#686979">资料段落被整理成有序条目，</text><text x="638" y="302" class="body" fill="#686979">最后变成一张可复习的提纲。</text>
    <path d="M638 337h220" stroke="#E8A38F" stroke-width="2"/><circle cx="638" cy="337" r="3" fill="#5F61C7"/>
    <g data-motif="source-outline">
      <circle cx="1000" cy="274" r="94" fill="url(#warmGlow)"/>
      <text x="922" y="220" class="motif-label" fill="#383B73">原文段落</text><text x="1050" y="220" class="motif-label" fill="#383B73">复习提纲</text>
      <g><rect x="878" y="240" width="88" height="92" rx="9" fill="#FFFFFF" fill-opacity=".92" stroke="#E8A38F" stroke-width="2"/><rect x="890" y="250" width="42" height="7" rx="3.5" fill="#D8D8E5"/><text x="922" y="275" text-anchor="middle" font-size="10" font-weight="700" fill="#383B73">A</text><path d="M907 271h42M907 284h34M890 302h58M890 315h46" stroke="#686979" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/></g>
      <path class="motif-line" d="M969 285H992" stroke="#5F61C7" stroke-width="2.5"/><path class="motif-line" d="m985 278 8 7-8 7" stroke="#5F61C7" stroke-width="2.5"/>
      <g><rect x="994" y="236" width="112" height="102" rx="10" fill="#FFFFFF" fill-opacity=".96" stroke="#5F61C7" stroke-width="2"/><rect x="1008" y="249" width="36" height="8" rx="4" fill="#D8D8E5"/><path d="M1008 273h78M1008 287h62M1008 301h72" stroke="#686979" stroke-opacity=".72" stroke-width="2.5" stroke-linecap="round"/><text x="1050" y="321" text-anchor="middle" font-size="10" font-weight="700" fill="#383B73">01  02  03</text><circle cx="1081" cy="318" r="9" fill="#56B59A"/><path class="motif-line" d="m1076 318 4 4 8-9" stroke="#FFFFFF" stroke-width="2.5"/></g>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="40" y="414" width="520" height="220" rx="20" fill="url(#pearlCard)" stroke="#D8D8E5"/><rect x="58" y="432" width="484" height="184" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity=".78"/>
    <text x="78" y="465" font-size="12" font-weight="700" letter-spacing="2" fill="#5F61C7">READ / TEST / RECALL</text>
    <text x="78" y="506" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#24263A">复习路径</text>
    <text x="78" y="536" class="body" fill="#686979">阅读、练习、回忆是三个有名字的阶段，</text><text x="78" y="556" class="body" fill="#686979">每一步都把内容推进到下一种状态。</text>
    <path d="M78 591h220" stroke="#56B59A" stroke-width="2"/><circle cx="78" cy="591" r="3" fill="#5F61C7"/>
    <g data-motif="review-sequence">
      <circle cx="460" cy="538" r="92" fill="url(#successGlow)"/>
      <path class="motif-line" d="M382 544H526" stroke="#D8D8E5" stroke-width="2"/><path class="motif-line" d="M428 544h12M476 544h12" stroke="#D8D8E5" stroke-width="2"/>
      <g transform="translate(368 506)"><rect width="54" height="76" rx="12" fill="#FFFFFF" fill-opacity=".94" stroke="#D8D8E5" stroke-width="1.8"/><path d="M16 18h22l7 7v28H16Z" fill="none" stroke="#5F61C7" stroke-width="2"/><path d="M38 18v9h7M22 36h17M22 44h13" stroke="#686979" stroke-width="2" stroke-linecap="round"/><text x="27" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#24263A">读</text></g>
      <g transform="translate(428 506)"><rect width="54" height="76" rx="12" fill="#F5F3F0" stroke="#56B59A" stroke-width="2.2"/><circle cx="27" cy="27" r="14" fill="#56B59A" fill-opacity=".16"/><path class="motif-line" d="m20 29 6 6 12-14" stroke="#56B59A" stroke-width="3"/><text x="27" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#383B73">练</text></g>
      <g transform="translate(488 506)"><rect width="54" height="76" rx="12" fill="#FFFFFF" fill-opacity=".94" stroke="#D8D8E5" stroke-width="1.8"/><path d="M17 18h20v29l-10-6-10 6Z" fill="none" stroke="#5F61C7" stroke-width="2" stroke-linejoin="round"/><path class="motif-line" d="m22 34 5 5 8-9" stroke="#56B59A" stroke-width="2.5"/><text x="27" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#24263A">忆</text></g>
      <text x="395" y="603" class="motif-label" fill="#686979">输入</text><text x="455" y="603" class="motif-label" fill="#56B59A">检验</text><text x="515" y="603" class="motif-label" fill="#686979">保持</text>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="600" y="414" width="520" height="220" rx="20" fill="url(#pearlCard)" stroke="#D8D8E5"/><rect x="618" y="432" width="484" height="184" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity=".78"/>
    <text x="638" y="465" font-size="12" font-weight="700" letter-spacing="2" fill="#5F61C7">CARD VERIFICATION</text>
    <text x="638" y="506" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#24263A">卡片核验</text>
    <text x="638" y="536" class="body" fill="#686979">题面与答案保持一一对应，</text><text x="638" y="556" class="body" fill="#686979">确认后才留下这枚复习印记。</text>
    <path d="M638 591h220" stroke="#A79AE8" stroke-width="2"/><circle cx="638" cy="591" r="3" fill="#5F61C7"/>
    <g data-motif="card-mapping">
      <circle cx="1000" cy="538" r="92" fill="url(#indigoGlow)"/>
      <text x="935" y="462" class="motif-label" fill="#383B73">题面</text><text x="1038" y="462" class="motif-label" fill="#383B73">答案</text>
      <g><rect x="894" y="478" width="82" height="92" rx="10" fill="#FFFFFF" stroke="#A79AE8" stroke-width="2"/><rect x="907" y="492" width="28" height="8" rx="4" fill="#D8D8E5"/><path d="M907 518h52M907 532h40M907 546h46" stroke="#686979" stroke-width="2.3" stroke-linecap="round"/><text x="935" y="560" text-anchor="middle" font-size="12" font-weight="700" fill="#383B73">Q</text></g>
      <path class="motif-line" d="M977 520H994" stroke="#5F61C7" stroke-width="2.5"/><path class="motif-line" d="m987 513 8 7-8 7" stroke="#5F61C7" stroke-width="2.5"/>
      <g><rect x="994" y="490" width="88" height="98" rx="10" fill="#FFFFFF" fill-opacity=".96" stroke="#5F61C7" stroke-width="2"/><rect x="1008" y="504" width="38" height="8" rx="4" fill="#D8D8E5"/><path d="M1008 527h56M1008 541h43M1008 555h49" stroke="#686979" stroke-width="2.3" stroke-linecap="round"/><path class="motif-line" d="m1010 574 7 7 14-16" stroke="#56B59A" stroke-width="3"/><text x="1038" y="577" text-anchor="middle" font-size="12" font-weight="700" fill="#56B59A">A</text></g>
    </g>
  </g>
</svg>
