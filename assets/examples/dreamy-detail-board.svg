<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">开卷助手语义化梦幻细节样板</title>
  <desc id="desc">四张浅色渐变卡片，图案分别对应章节关系、资料到提纲、复习路径和卡片核验状态；每张卡片都使用统一的文字层级和底部基线。</desc>
  <defs>
    <linearGradient id="skyCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9ff"/><stop offset="1" stop-color="#dceff8"/></linearGradient>
    <linearGradient id="roseCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3f8"/><stop offset="1" stop-color="#f8e6ef"/></linearGradient>
    <linearGradient id="mintCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbf4"/><stop offset="1" stop-color="#dbf1e6"/></linearGradient>
    <linearGradient id="lilacCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ff"/><stop offset="1" stop-color="#ebe5fa"/></linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8194a6" flood-opacity=".14"/></filter>
    <filter id="motifBlur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1160" height="700" fill="#fbfaf8"/>
  <text x="54" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#8e6fa5">KAĪJUAN / SEMANTIC MOTIFS</text>
  <text x="54" y="102" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#2f304b">开卷助手 · 图案也要有理由</text>
  <text x="54" y="128" font-size="15" fill="#77758b">每条线、每个节点都对应文案中的一个动作，不再把装饰当作随机贴纸。</text>

  <g filter="url(#cardShadow)">
    <rect x="40" y="160" width="520" height="220" rx="20" fill="url(#skyCard)" stroke="#c6e1ee"/><rect x="58" y="178" width="484" height="184" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/>
    <text x="78" y="211" font-size="12" font-weight="700" letter-spacing="2" fill="#477da1">CHAPTER RELATIONSHIP</text>
    <text x="78" y="252" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#2e3557">章节关系</text>
    <text x="78" y="282" font-size="14" fill="#68758a">把章节、概念与核验关系</text><text x="78" y="302" font-size="14" fill="#68758a">连成一张可读的知识地图。</text>
    <path d="M78 337h220" stroke="#8dbbd3" stroke-width="2"/><circle cx="78" cy="337" r="3" fill="#477da1"/>
    <circle cx="447" cy="265" r="74" fill="#acd9e8" fill-opacity=".23" filter="url(#motifBlur)"/><circle cx="447" cy="265" r="63" fill="none" stroke="#77adc7" stroke-opacity=".28"/>
    <path d="M408 252 435 224 474 238 495 272 458 303 420 289Z" fill="none" stroke="#5b7fa6" stroke-width="2"/>
    <path d="M435 224 447 202M474 238l25-9M495 272l20 14M458 303l6 20M420 289l-22 14" stroke="#5b7fa6" stroke-width="1.5"/>
    <circle cx="435" cy="224" r="7" fill="#8bb7d5" stroke="#5b7fa6"/><circle cx="474" cy="238" r="7" fill="#ef9cae" stroke="#a96583"/><circle cx="495" cy="272" r="7" fill="#8bb7d5" stroke="#5b7fa6"/><circle cx="458" cy="303" r="7" fill="#7dc5b5" stroke="#4b9b92"/>
    <text x="420" y="214" font-size="8" fill="#477da1">章</text><text x="479" y="228" font-size="8" fill="#a96583">概</text><text x="500" y="267" font-size="8" fill="#477da1">练</text><text x="463" y="320" font-size="8" fill="#4b9b92">核</text>
    <path d="m430 263 10 10 20-25" fill="none" stroke="#40aaa8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="600" y="160" width="520" height="220" rx="20" fill="url(#roseCard)" stroke="#efd0df"/><rect x="618" y="178" width="484" height="184" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/>
    <text x="638" y="211" font-size="12" font-weight="700" letter-spacing="2" fill="#ad5d78">SOURCE TO OUTLINE</text>
    <text x="638" y="252" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#493452">提纲生成</text>
    <text x="638" y="282" font-size="14" fill="#7d6c80">从资料段落提炼层级标题，</text><text x="638" y="302" font-size="14" fill="#7d6c80">再交给复习卡片继续核验。</text>
    <path d="M638 337h220" stroke="#e1a6bd" stroke-width="2"/><circle cx="638" cy="337" r="3" fill="#ad5d78"/>
    <circle cx="1002" cy="262" r="76" fill="#f3c9d7" fill-opacity=".34" filter="url(#motifBlur)"/>
    <rect x="932" y="212" width="92" height="70" rx="8" fill="#fff" fill-opacity=".62" stroke="#bf6f94" stroke-width="1.5"/><path d="M946 230h52M946 244h38M946 258h46" stroke="#bf6f94" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/>
    <path d="M1026 247h31" stroke="#bf6f94" stroke-width="2"/><path d="m1050 237 10 10-10 10" fill="none" stroke="#bf6f94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1038" y="274" width="72" height="54" rx="8" fill="#fff" fill-opacity=".82" stroke="#8175bc" stroke-width="1.5"/><path d="M1050 291h46M1050 304h35" stroke="#8175bc" stroke-width="2" stroke-linecap="round"/><path d="m1050 316 6 6 12-13" fill="none" stroke="#4b9b92" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="934" y="202" font-size="9" font-weight="700" fill="#ad5d78">SOURCE</text><text x="1040" y="266" font-size="9" font-weight="700" fill="#7161a8">OUTLINE</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="40" y="414" width="520" height="220" rx="20" fill="url(#mintCard)" stroke="#c6e6d4"/><rect x="58" y="432" width="484" height="184" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/>
    <text x="78" y="465" font-size="12" font-weight="700" letter-spacing="2" fill="#4d8974">READ / TEST / RECALL</text>
    <text x="78" y="506" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#31524d">复习路径</text>
    <text x="78" y="536" font-size="14" fill="#678078">把阅读、练习、回忆变成</text><text x="78" y="556" font-size="14" fill="#678078">一条看得见的完成路径。</text>
    <path d="M78 591h220" stroke="#89c8ae" stroke-width="2"/><circle cx="78" cy="591" r="3" fill="#4d8974"/>
    <circle cx="446" cy="518" r="78" fill="#a9dfc6" fill-opacity=".32" filter="url(#motifBlur)"/><path d="M394 568c25-47 52-54 76-33 24 20 42 7 67-43" fill="none" stroke="#4b9b92" stroke-width="3" stroke-linecap="round"/>
    <circle cx="394" cy="568" r="14" fill="#fff" stroke="#ef9cae" stroke-width="3"/><text x="394" y="572" text-anchor="middle" font-size="10" font-weight="700" fill="#a96583">01</text><circle cx="470" cy="535" r="14" fill="#fff" stroke="#f0ad63" stroke-width="3"/><text x="470" y="539" text-anchor="middle" font-size="10" font-weight="700" fill="#c47d44">02</text><circle cx="537" cy="492" r="14" fill="#fff" stroke="#7a70cc" stroke-width="3"/><text x="537" y="496" text-anchor="middle" font-size="10" font-weight="700" fill="#655aa8">03</text>
    <text x="377" y="603" font-size="9" font-weight="700" fill="#4d8974">READ</text><text x="453" y="570" font-size="9" font-weight="700" fill="#4d8974">TEST</text><text x="521" y="527" font-size="9" font-weight="700" fill="#4d8974">RECALL</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="600" y="414" width="520" height="220" rx="20" fill="url(#lilacCard)" stroke="#d8cfee"/><rect x="618" y="432" width="484" height="184" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/>
    <text x="638" y="465" font-size="12" font-weight="700" letter-spacing="2" fill="#7161a8">CARD VERIFICATION</text>
    <text x="638" y="506" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#413d64">卡片核验</text>
    <text x="638" y="536" font-size="14" fill="#77718e">正面是概念，背面是答案，</text><text x="638" y="556" font-size="14" fill="#77718e">最后留下一个清晰的确认状态。</text>
    <path d="M638 591h220" stroke="#a69ad2" stroke-width="2"/><circle cx="638" cy="591" r="3" fill="#7161a8"/>
    <circle cx="1000" cy="522" r="76" fill="#c8c1eb" fill-opacity=".28" filter="url(#motifBlur)"/><g transform="rotate(-7 1000 522)"><rect x="944" y="468" width="112" height="104" rx="12" fill="#fff" stroke="#8175bc" stroke-width="2"/><rect x="954" y="478" width="92" height="84" rx="8" fill="#f7f4ff"/><text x="1000" y="500" text-anchor="middle" font-size="9" font-weight="700" fill="#7161a8">CONCEPT</text><path d="M973 520h54M973 535h39" stroke="#8175bc" stroke-width="2" stroke-linecap="round"/><path d="m1003 542 7 7 14-16" fill="none" stroke="#4b9b92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1072" cy="540" r="24" fill="#fff" stroke="#8175bc" stroke-width="2"/><path d="m1061 540 7 7 14-16" fill="none" stroke="#4b9b92" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>
