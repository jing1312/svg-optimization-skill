<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">开卷助手语义插画细节样板</title>
  <desc id="desc">四张柔和渐变卡片，以知识星座、资料转提纲、复习路径和核验卡片四个主插画表达产品动作。</desc>
  <defs>
    <linearGradient id="skyCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef9ff"/><stop offset="1" stop-color="#dceff8"/></linearGradient>
    <linearGradient id="roseCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3f8"/><stop offset="1" stop-color="#f8e6ef"/></linearGradient>
    <linearGradient id="mintCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbf4"/><stop offset="1" stop-color="#dbf1e6"/></linearGradient>
    <linearGradient id="lilacCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ff"/><stop offset="1" stop-color="#ebe5fa"/></linearGradient>
    <radialGradient id="skyGlow"><stop stop-color="#bfe4f1" stop-opacity=".7"/><stop offset="1" stop-color="#bfe4f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="roseGlow"><stop stop-color="#f4c8d8" stop-opacity=".72"/><stop offset="1" stop-color="#f4c8d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="mintGlow"><stop stop-color="#b5e4ca" stop-opacity=".72"/><stop offset="1" stop-color="#b5e4ca" stop-opacity="0"/></radialGradient>
    <radialGradient id="lilacGlow"><stop stop-color="#cbc4ec" stop-opacity=".72"/><stop offset="1" stop-color="#cbc4ec" stop-opacity="0"/></radialGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8194a6" flood-opacity=".14"/></filter>
    <style>
      .motif-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .motif-node { stroke-width: 2; }
      .body { font-size: 14px; }
    </style>
  </defs>
  <rect width="1160" height="700" fill="#fbfaf8"/>
  <text x="54" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#8e6fa5">KAĪJUAN / SEMANTIC ILLUSTRATIONS</text>
  <text x="54" y="102" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#2f304b">开卷助手 · 每个元素都有语义</text>
  <text x="54" y="128" class="body" fill="#77758b">柔和的背景只负责托住主插画，真正的信息由线稿、节点和动作关系完成。</text>

  <g filter="url(#cardShadow)">
    <rect x="40" y="160" width="520" height="220" rx="20" fill="url(#skyCard)" stroke="#c6e1ee"/><rect x="58" y="178" width="484" height="184" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/>
    <text x="78" y="211" font-size="12" font-weight="700" letter-spacing="2" fill="#477da1">CHAPTER RELATIONSHIP</text>
    <text x="78" y="252" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#2e3557">章节关系</text>
    <text x="78" y="282" class="body" fill="#68758a">章节与概念相互连接，</text><text x="78" y="302" class="body" fill="#68758a">核验状态停在关系的中心。</text>
    <path d="M78 337h220" stroke="#8dbbd3" stroke-width="2"/><circle cx="78" cy="337" r="3" fill="#477da1"/>
    <circle cx="447" cy="264" r="94" fill="url(#skyGlow)"/>
    <path class="motif-line" d="M396 245c18-40 55-57 88-35 26 17 39 45 59 61M402 293c25-12 48-2 62 20 18 27 47 19 73-5" stroke="#779db8" stroke-opacity=".45" stroke-width="2"/>
    <path class="motif-line" d="M446 214l34 14v35c0 25-17 39-34 49-17-10-34-24-34-49v-35Z" fill="#fff" fill-opacity=".48" stroke="#5b7fa6" stroke-width="2"/>
    <path class="motif-line" d="m429 255 12 12 24-28" stroke="#42aaa8" stroke-width="4"/>
    <circle cx="398" cy="244" r="7" fill="#8bb7d5" stroke="#5b7fa6" class="motif-node"/><circle cx="480" cy="228" r="7" fill="#ef9cae" stroke="#a96583" class="motif-node"/><circle cx="544" cy="272" r="7" fill="#7dc5b5" stroke="#4b9b92" class="motif-node"/><circle cx="402" cy="293" r="7" fill="#f0ad63" stroke="#c47d44" class="motif-node"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="600" y="160" width="520" height="220" rx="20" fill="url(#roseCard)" stroke="#efd0df"/><rect x="618" y="178" width="484" height="184" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/>
    <text x="638" y="211" font-size="12" font-weight="700" letter-spacing="2" fill="#ad5d78">SOURCE TO OUTLINE</text>
    <text x="638" y="252" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#493452">提纲生成</text>
    <text x="638" y="282" class="body" fill="#7d6c80">资料段落被折叠成层级，</text><text x="638" y="302" class="body" fill="#7d6c80">最后变成一张可复习的提纲。</text>
    <path d="M638 337h220" stroke="#e1a6bd" stroke-width="2"/><circle cx="638" cy="337" r="3" fill="#ad5d78"/>
    <circle cx="1005" cy="263" r="96" fill="url(#roseGlow)"/>
    <g transform="translate(918 205)"><rect x="0" y="24" width="90" height="70" rx="9" fill="#fff" fill-opacity=".56" stroke="#bf6f94" stroke-width="2"/><path d="M16 45h51M16 60h37M16 75h46" stroke="#bf6f94" stroke-opacity=".72" stroke-width="2.5" stroke-linecap="round"/><rect x="36" y="0" width="90" height="70" rx="9" fill="#fff" fill-opacity=".84" stroke="#8175bc" stroke-width="2"/><path d="M52 21h52M52 36h37M52 51h47" stroke="#8175bc" stroke-opacity=".72" stroke-width="2.5" stroke-linecap="round"/><path class="motif-line" d="M96 84h45" stroke="#bf6f94" stroke-width="2.5"/><path class="motif-line" d="m131 74 11 10-11 10" stroke="#bf6f94" stroke-width="2.5"/><circle cx="126" cy="52" r="9" fill="#7dc5b5"/><path class="motif-line" d="m121 52 4 4 8-9" stroke="#fff" stroke-width="2.5"/></g>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="40" y="414" width="520" height="220" rx="20" fill="url(#mintCard)" stroke="#c6e6d4"/><rect x="58" y="432" width="484" height="184" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/>
    <text x="78" y="465" font-size="12" font-weight="700" letter-spacing="2" fill="#4d8974">READ / TEST / RECALL</text>
    <text x="78" y="506" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#31524d">复习路径</text>
    <text x="78" y="536" class="body" fill="#678078">阅读、练习、回忆不是三个装饰点，</text><text x="78" y="556" class="body" fill="#678078">而是一条会向前推进的路径。</text>
    <path d="M78 591h220" stroke="#89c8ae" stroke-width="2"/><circle cx="78" cy="591" r="3" fill="#4d8974"/>
    <circle cx="447" cy="519" r="96" fill="url(#mintGlow)"/>
    <path class="motif-line" d="M390 568c25-45 49-56 75-35 25 20 45 9 71-47" stroke="#4b9b92" stroke-width="3.5"/>
    <circle cx="390" cy="568" r="15" fill="#fff" stroke="#ef9cae" stroke-width="3"/><path class="motif-line" d="M384 568h12" stroke="#a96583" stroke-width="2"/>
    <circle cx="465" cy="533" r="15" fill="#fff" stroke="#f0ad63" stroke-width="3"/><path class="motif-line" d="m458 533 5 5 9-10" stroke="#c47d44" stroke-width="2"/>
    <circle cx="536" cy="486" r="15" fill="#fff" stroke="#7a70cc" stroke-width="3"/><path class="motif-line" d="M529 486c5-7 10 7 15 0" stroke="#655aa8" stroke-width="2"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="600" y="414" width="520" height="220" rx="20" fill="url(#lilacCard)" stroke="#d8cfee"/><rect x="618" y="432" width="484" height="184" rx="15" fill="none" stroke="#fff" stroke-opacity=".72"/>
    <text x="638" y="465" font-size="12" font-weight="700" letter-spacing="2" fill="#7161a8">CARD VERIFICATION</text>
    <text x="638" y="506" font-family="Georgia, Times New Roman, serif" font-size="29" font-weight="700" fill="#413d64">卡片核验</text>
    <text x="638" y="536" class="body" fill="#77718e">正面是概念，背面是答案，</text><text x="638" y="556" class="body" fill="#77718e">确认后才留下这枚印记。</text>
    <path d="M638 591h220" stroke="#a69ad2" stroke-width="2"/><circle cx="638" cy="591" r="3" fill="#7161a8"/>
    <circle cx="1004" cy="522" r="96" fill="url(#lilacGlow)"/>
    <g transform="rotate(-7 1002 522)"><rect x="942" y="470" width="112" height="104" rx="13" fill="#fff" stroke="#8175bc" stroke-width="2"/><rect x="954" y="482" width="88" height="78" rx="8" fill="#f7f4ff"/><path d="M971 507h53M971 522h37" stroke="#8175bc" stroke-width="2.5" stroke-linecap="round"/><path class="motif-line" d="m986 541 8 8 16-18" stroke="#4b9b92" stroke-width="3.5"/><rect x="1000" y="445" width="70" height="44" rx="11" fill="#fff" stroke="#8175bc" stroke-width="2"/><path d="M1014 460h35M1014 472h26" stroke="#8175bc" stroke-width="2.5" stroke-linecap="round"/><circle cx="1058" cy="466" r="7" fill="#7dc5b5"/><path class="motif-line" d="m1054 466 3 3 6-7" stroke="#fff" stroke-width="2"/></g>
  </g>
</svg>
