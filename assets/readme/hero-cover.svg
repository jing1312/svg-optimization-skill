    </filter>
    <clipPath id="edge"><rect x="0" y="0" width="1200" height="300"/></clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <ellipse cx="150" cy="20" rx="420" ry="230" fill="url(#haloV)"/>
  <ellipse cx="1120" cy="310" rx="430" ry="230" fill="url(#haloC)"/>
