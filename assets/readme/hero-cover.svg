      <stop offset="1" stop-color="#f6efff"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
