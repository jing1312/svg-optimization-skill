<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="stackTitle">
  <title id="stackTitle">六层效果预算：渐变底、环境光晕、有色阴影、内衬、高光、主插画按顺序叠加</title>
  <defs>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7ff"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <linearGradient id="baseSwatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f6efff"/>
    </linearGradient>
    <radialGradient id="haloSample" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5bd0"/>
      <stop offset="1" stop-color="#3457d5"/>
    </linearGradient>
    <filter id="liftSmall" x="-60%" y="-60%" width="220%" height="260%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#8b7cf6" flood-opacity="0.32"/>
    </filter>
    <clipPath id="glossClip"><rect x="-28" y="-22" width="56" height="44" rx="10"/></clipPath>
  </defs>

  <rect width="1200" height="330" rx="18" fill="url(#pageGrad)"/>
  <text x="600" y="40" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="600" fill="#2b2f55">六层效果预算 · 按顺序叠加，多一层都算越界</text>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
    <g transform="translate(65 70)">
      <rect width="150" height="170" rx="16" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.25" stroke-width="1.3"/>
      <circle cx="24" cy="24" r="11" fill="url(#headline)"/>
      <text x="24" y="29" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1</text>
      <rect x="43" y="116" width="64" height="48" rx="10" fill="url(#baseSwatch)" stroke="#a5b4fc" stroke-opacity="0.6" stroke-width="1.2"/>
    </g>
    <g transform="translate(249 70)">
      <rect width="150" height="170" rx="16" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.25" stroke-width="1.3"/>
      <circle cx="24" cy="24" r="11" fill="url(#headline)"/>
      <text x="24" y="29" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2</text>
      <circle cx="75" cy="140" r="32" fill="url(#haloSample)"/>
      <circle cx="75" cy="140" r="7" fill="#8b7cf6"/>
    </g>
    <g transform="translate(433 70)">
      <rect width="150" height="170" rx="16" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.25" stroke-width="1.3"/>
      <circle cx="24" cy="24" r="11" fill="url(#headline)"/>
      <text x="24" y="29" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">3</text>
      <rect x="47" y="112" width="56" height="44" rx="10" fill="#ffffff" filter="url(#liftSmall)"/>
    </g>
    <g transform="translate(617 70)">
      <rect width="150" height="170" rx="16" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.25" stroke-width="1.3"/>
      <circle cx="24" cy="24" r="11" fill="url(#headline)"/>
      <text x="24" y="29" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">4</text>
      <rect x="47" y="112" width="56" height="44" rx="10" fill="#ffffff" stroke="#2b2f55" stroke-opacity="0.55" stroke-width="1.6"/>
      <rect x="53" y="120" width="44" height="28" rx="7" fill="none" stroke="#8b7cf6" stroke-opacity="0.5" stroke-width="1.3"/>
    </g>
    <g transform="translate(801 70)">
      <rect width="150" height="170" rx="16" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.25" stroke-width="1.3"/>
      <circle cx="24" cy="24" r="11" fill="url(#headline)"/>
      <text x="24" y="29" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">5</text>
      <g transform="translate(75 134)">
        <rect x="-28" y="-22" width="56" height="44" rx="10" fill="url(#baseSwatch)" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="1.2"/>
        <g clip-path="url(#glossClip)"><rect x="-28" y="-22" width="56" height="15" fill="#ffffff" opacity="0.75"/></g>
      </g>
    </g>
    <g transform="translate(985 70)">
      <rect width="150" height="170" rx="16" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.25" stroke-width="1.3"/>
      <circle cx="24" cy="24" r="11" fill="url(#headline)"/>
      <text x="24" y="29" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">6</text>
      <g transform="translate(75 136)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -6c-4.2-3.4-9-4.5-15.5-4.5h-10.5v31h10.5c6.5 0 11.3 1.1 15.5 4.5z" fill="#ffffff" stroke="#2b2f55" stroke-width="2.6"/>
        <path d="M0 -6c4.2-3.4 9-4.5 15.5-4.5H26v31H15.5C9 26.5 4.2 27.6 0 31z" fill="#ffffff" stroke="#2b2f55" stroke-width="2.6"/>
        <path d="M-9 8l6 6 14-14" stroke="#38bdf8" stroke-width="3.4"/>
      </g>
    </g>
    <g stroke="#8b7cf6" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M224 150l8 7-8 7"/>
      <path d="M408 150l8 7-8 7"/>
      <path d="M592 150l8 7-8 7"/>
      <path d="M776 150l8 7-8 7"/>
      <path d="M960 150l8 7-8 7"/>
    </g>
    <g font-size="15" font-weight="600" fill="#2b2f55" text-anchor="middle">
      <text x="140" y="264">浅色渐变底</text>
      <text x="324" y="264">环境光晕</text>
      <text x="508" y="264">有色柔和阴影</text>
      <text x="692" y="264">半透明内衬</text>
      <text x="876" y="264">clipped 高光</text>
      <text x="1060" y="264">单一主插画</text>
    </g>
    <g font-size="12.5" fill="#55517a" text-anchor="middle">
      <text x="140" y="286">打底，不抢戏</text>
      <text x="324" y="286">负责空气感</text>
      <text x="508" y="286">负责浮起</text>
      <text x="692" y="286">负责边界</text>
      <text x="876" y="286">负责材质</text>
      <text x="1060" y="286">负责语义</text>
    </g>
  </g>
  <text x="600" y="318" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#55517a">模糊 stdDeviation ≤ 24 · 高光只来一次 · 主图案只有一个 · 禁止无意义装饰堆叠</text>
</svg>
