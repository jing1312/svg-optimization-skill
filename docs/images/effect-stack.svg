<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="esT esD">
  <title id="esT">材质剖面：同一枚瓦片的六层预算逐层叠加</title>
  <desc id="esD">从渐变底开始，逐层加上光晕、有色阴影、内衬、高光与主图形；放大镜展示内衬间距与高光淡出。</desc>
  <defs>
    <linearGradient id="esTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceffb"/>
    </linearGradient>
    <radialGradient id="esHalo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="esGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="esLift" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#8b7cf6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="#f6f5fc"/>

  <!-- 标题 -->
  <text x="70" y="66" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="30" font-weight="700" fill="#26243a">材质剖面 · 六层预算</text>
  <text x="70" y="94" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#454b73">顺序不能乱，层数不能加 —— 同一枚瓦片，从打底到主图形逐层叠加</text>

  <!-- 放大镜 A：内衬间距 -->
  <g>
    <line x1="695" y1="118" x2="695" y2="152" stroke="#8b7cf6" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="695" cy="84" r="34" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect x="672" y="66" width="46" height="36" rx="9" fill="url(#esTile)" stroke="#c9c4e8" stroke-width="1"/>
    <rect x="677" y="71" width="36" height="26" rx="6" fill="none" stroke="#8b7cf6" stroke-opacity="0.55" stroke-width="1.4"/>
    <line x1="672" y1="61" x2="677" y2="66" stroke="#8b7cf6" stroke-width="1"/>
    <text x="695" y="135" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#5c569c">内衬内缩 10%</text>
  </g>
  <!-- 放大镜 B：高光淡出 -->
  <g>
    <line x1="885" y1="118" x2="885" y2="152" stroke="#8b7cf6" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="885" cy="84" r="34" fill="#ffffff" stroke="#8b7cf6" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect x="862" y="66" width="46" height="36" rx="9" fill="url(#esTile)" stroke="#c9c4e8" stroke-width="1"/>
    <rect x="862" y="66" width="46" height="16" rx="9" fill="url(#esGloss)"/>
    <text x="885" y="135" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#5c569c">高光向下淡出</text>
  </g>

  <!-- 阶段 01 底 -->
  <g transform="translate(70 155)">
    <rect width="110" height="110" rx="24" fill="url(#esTile)" stroke="#dcd7ef" stroke-width="1"/>
    <text x="55" y="150" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="15" font-style="italic" fill="#5c4bc0">01</text>
    <text x="55" y="172" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#26243a">渐变底</text>
    <text x="55" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5c569c">打底，不抢戏</text>
  </g>

  <!-- 阶段 02 +光晕 -->
  <g transform="translate(260 155)">
    <circle cx="55" cy="52" r="60" fill="url(#esHalo)"/>
    <rect width="110" height="110" rx="24" fill="url(#esTile)" stroke="#dcd7ef" stroke-width="1"/>
    <text x="55" y="150" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="15" font-style="italic" fill="#5c4bc0">02</text>
    <text x="55" y="172" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#26243a">环境光晕</text>
    <text x="55" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5c569c">负责空气感</text>
  </g>

  <!-- 阶段 03 +有色阴影 -->
  <g transform="translate(450 155)">
    <circle cx="55" cy="52" r="60" fill="url(#esHalo)"/>
    <rect width="110" height="110" rx="24" fill="url(#esTile)" stroke="#dcd7ef" stroke-width="1" filter="url(#esLift)"/>
    <text x="55" y="150" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="15" font-style="italic" fill="#5c4bc0">03</text>
    <text x="55" y="172" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#26243a">有色阴影</text>
    <text x="55" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5c569c">负责浮起</text>
  </g>

  <!-- 阶段 04 +内衬 -->
  <g transform="translate(640 155)">
    <circle cx="55" cy="52" r="60" fill="url(#esHalo)"/>
    <rect width="110" height="110" rx="24" fill="url(#esTile)" stroke="#dcd7ef" stroke-width="1" filter="url(#esLift)"/>
    <rect x="9" y="9" width="92" height="92" rx="19" fill="none" stroke="#8b7cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="55" y="150" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="15" font-style="italic" fill="#5c4bc0">04</text>
    <text x="55" y="172" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#26243a">半透明内衬</text>
    <text x="55" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5c569c">负责边界</text>
  </g>

  <!-- 阶段 05 +高光 -->
  <g transform="translate(830 155)">
    <circle cx="55" cy="52" r="60" fill="url(#esHalo)"/>
    <rect width="110" height="110" rx="24" fill="url(#esTile)" stroke="#dcd7ef" stroke-width="1" filter="url(#esLift)"/>
    <rect x="9" y="9" width="92" height="92" rx="19" fill="none" stroke="#8b7cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <clipPath id="esClip"><rect width="110" height="110" rx="24"/></clipPath>
    <g clip-path="url(#esClip)"><rect width="110" height="40" fill="url(#esGloss)"/></g>
    <text x="55" y="150" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="15" font-style="italic" fill="#5c4bc0">05</text>
    <text x="55" y="172" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#26243a">高光淡出</text>
    <text x="55" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5c569c">负责材质</text>
  </g>

  <!-- 阶段 06 +主图形 -->
  <g transform="translate(1020 155)">
    <circle cx="55" cy="52" r="60" fill="url(#esHalo)"/>
    <rect width="110" height="110" rx="24" fill="url(#esTile)" stroke="#dcd7ef" stroke-width="1" filter="url(#esLift)"/>
    <rect x="9" y="9" width="92" height="92" rx="19" fill="none" stroke="#8b7cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <g clip-path="url(#esClip)"><rect width="110" height="40" fill="url(#esGloss)"/></g>
    <g transform="translate(51 54) scale(1.06)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -21 0 C -14 8 -6 12 0 17 C 7 13 15 4 23 -7" stroke="#2b2f55" stroke-width="3.4"/>
      <path d="M -22 -2 C -15 -11 -7 -13 0 -9 C 7 -13 14 -12 18 -7" stroke="#2b2f55" stroke-width="2.6"/>
      <circle cx="25" cy="-9" r="4.2" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
    </g>
    <text x="55" y="150" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="15" font-style="italic" fill="#5c4bc0">06</text>
    <text x="55" y="172" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="600" fill="#26243a">主图形</text>
    <text x="55" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#5c569c">负责语义</text>
  </g>
</svg>
