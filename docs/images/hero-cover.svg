<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="hcT hcD">
  <title id="hcT">svg-optimization-skill：画得克制，查得彻底</title>
  <desc id="hcD">深墨编辑风主视觉：衬线大字、金色编号与细线标注，展示机器门禁与渲染实测的设计纪律。</desc>
  <defs>
    <linearGradient id="hcGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101318"/>
      <stop offset="1" stop-color="#151923"/>
    </linearGradient>
  </defs>

  <!-- 底与框 -->
  <rect width="1200" height="500" fill="url(#hcGround)"/>
  <rect x="24" y="24" width="1152" height="452" fill="none" stroke="#efe9dc" stroke-opacity="0.13" stroke-width="1"/>
  <g stroke="#c9a86a" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <path d="M28 46 V28 H46"/>
    <path d="M1154 28 H1172 V46"/>
    <path d="M28 454 V472 H46"/>
    <path d="M1172 454 V472 H1154"/>
  </g>

  <!-- 眉线 -->
  <text x="72" y="88" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#c9a86a" letter-spacing="5.5">SVG DESIGN SKILL · MACHINE-GATED VECTOR CRAFT</text>
  <text x="1128" y="88" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#8b93a1" letter-spacing="4">SPECIMEN N°01 — MMXXVI</text>

  <!-- 主陈述 -->
  <text x="72" y="252" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="92" font-weight="700" fill="#efe9dc">画得克制，</text>
  <text x="72" y="364" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="92" font-weight="700" fill="#c9a86a">查得彻底。</text>
  <text x="72" y="414" font-family="Georgia, Times New Roman, serif" font-size="19" font-style="italic" fill="#8b93a1">Drawn with restraint. Proven by gates.</text>

  <!-- 右侧样张：核心 glyph 的工程标注 -->
  <g>
    <rect x="700" y="118" width="428" height="262" fill="none" stroke="#c9a86a" stroke-opacity="0.32" stroke-width="1"/>
    <text x="732" y="146" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#8b93a1" letter-spacing="2">CORE GLYPH — BOOK-OPEN-CHECK · LUCIDE (ISC)</text>
    <line x1="732" y1="158" x2="1096" y2="158" stroke="#efe9dc" stroke-opacity="0.14" stroke-width="1"/>
    <!-- 制图式构造标注：中心轴线 + 徽章构造圆 -->
    <line x1="914" y1="208" x2="914" y2="300" stroke="#efe9dc" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 5"/>
    <circle cx="986" cy="290" r="54" fill="none" stroke="#efe9dc" stroke-opacity="0.22" stroke-width="1"/>
    <g stroke="#c9a86a" stroke-opacity="0.55" stroke-width="1.2">
      <line x1="986" y1="230" x2="986" y2="238"/>
      <line x1="986" y1="342" x2="986" y2="346"/>
      <line x1="926" y1="290" x2="934" y2="290"/>
      <line x1="1038" y1="290" x2="1046" y2="290"/>
    </g>
    <text x="1050" y="294" font-family="Georgia, Times New Roman, serif" font-size="10.5" font-style="italic" fill="#c9a86a">R 54</text>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M914 226 C 886 212, 848 210, 822 218 V 284 C 848 276, 886 278, 914 292 C 942 278, 980 276, 1006 284 V 218 C 980 210, 942 212, 914 226 Z" stroke="#c9a86a" stroke-width="1.6"/>
      <path d="M914 226 V 292" stroke="#c9a86a" stroke-width="1.2"/>
      <circle cx="986" cy="290" r="22" stroke="#efe9dc" stroke-opacity="0.85" stroke-width="1.6"/>
      <path d="M976 290 l 7.5 7.5 l 15 -15" stroke="#c9a86a" stroke-width="2.2"/>
    </g>
    <line x1="732" y1="330" x2="916" y2="330" stroke="#efe9dc" stroke-opacity="0.14" stroke-width="1"/>
    <line x1="1056" y1="330" x2="1096" y2="330" stroke="#efe9dc" stroke-opacity="0.14" stroke-width="1"/>
    <text x="732" y="364" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#8b93a1" letter-spacing="1">LEGIBLE AT 48 PX · STROKE ≥ 1.8 · SIX LAYERS MAX</text>
  </g>

  <!-- 底部数据行 -->
  <line x1="72" y1="426" x2="1128" y2="426" stroke="#efe9dc" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="372" y1="440" x2="372" y2="462" stroke="#efe9dc" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="672" y1="440" x2="672" y2="462" stroke="#efe9dc" stroke-opacity="0.12" stroke-width="1"/>
  <text x="72" y="452" font-family="Georgia, Times New Roman, serif" font-size="14" font-style="italic" fill="#c9a86a">01</text>
  <text x="72" y="469" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#c9cdd6">G1–G4 几何门禁</text>
  <text x="400" y="452" font-family="Georgia, Times New Roman, serif" font-size="14" font-style="italic" fill="#c9a86a">02</text>
  <text x="400" y="469" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#c9cdd6">R1·R2 引用完整性</text>
  <text x="700" y="452" font-family="Georgia, Times New Roman, serif" font-size="14" font-style="italic" fill="#c9a86a">03</text>
  <text x="700" y="469" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#c9cdd6">C1 WCAG 对比度</text>
  <text x="1128" y="469" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#8b93a1" letter-spacing="2">T0 · T1 · T2</text>
</svg>
