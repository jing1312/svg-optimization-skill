    <text x="856" y="171" font-size="11.5" font-weight="700" fill="#262043" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">editor.html — banner-example.svg</text>
    <line x1="786" y1="192" x2="1126" y2="192" stroke="#F1E8D8" stroke-width="1"/>
    <!-- 内嵌画布 -->
    <rect x="786" y="204" width="340" height="134" rx="10" fill="#FCF6E9"/>
    <!-- 标题组件（选中态：蓝框 + 八向手柄） -->
    <rect x="806" y="224" width="230" height="30" rx="8" fill="#E7EDFF" stroke="#2F5BFF" stroke-width="1.6"/>
    <rect x="802" y="220" width="8" height="8" fill="#FFFFFF" stroke="#2F5BFF" stroke-width="1.2"/>
    <rect x="1032" y="220" width="8" height="8" fill="#FFFFFF" stroke="#2F5BFF" stroke-width="1.2"/>
    <rect x="802" y="250" width="8" height="8" fill="#FFFFFF" stroke="#2F5BFF" stroke-width="1.2"/>
    <rect x="1032" y="250" width="8" height="8" fill="#FFFFFF" stroke="#2F5BFF" stroke-width="1.2"/>
    <text x="820" y="243" font-size="15" font-weight="800" fill="#262043">产品 Banner 组件</text>
    <!-- 门禁徽章组件 -->
    <rect x="806" y="268" width="108" height="26" rx="13" fill="#1FC79B"/>
    <text x="820" y="285" font-size="11.5" font-weight="800" fill="#262043">✓ G1–G4 通过</text>
    <!-- 红色吸附参考线 -->
    <line x1="790" y1="298" x2="1124" y2="298" stroke="#FF4D5E" stroke-width="1.5" stroke-dasharray="6 4"/>
    <!-- 正文灰线 -->
    <rect x="806" y="316" width="210" height="6" rx="3" fill="#DDD5EF"/>
    <rect x="806" y="330" width="130" height="6" rx="3" fill="#DDD5EF"/>
    <!-- 状态条 -->
    <line x1="786" y1="356" x2="1126" y2="356" stroke="#F1E8D8" stroke-width="1"/>
    <text x="788" y="376" font-size="11" font-weight="700" fill="#262043" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">12 THEMES</text>
    <rect x="944" y="365" width="14" height="14" rx="4" fill="#2F5BFF"/>
    <rect x="962" y="365" width="14" height="14" rx="4" fill="#FFC53D"/>
    <rect x="980" y="365" width="14" height="14" rx="4" fill="#FF6B4A"/>
    <text x="1126" y="376" font-size="11" font-weight="700" fill="#262043" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">21 GATES</text>
  </g>

  <!-- 贴纸 -->
  <circle cx="1176" cy="80" r="30" fill="#FFC53D"/>
  <text x="1176" y="89" font-size="20" font-weight="900" fill="#262043" text-anchor="middle">21 ✓</text>
  <circle cx="718" cy="402" r="34" fill="#1FC79B"/>
  <text x="718" y="409" font-size="18" font-weight="900" fill="#262043" text-anchor="middle">99</text>

