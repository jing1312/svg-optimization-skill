  <text x="90" y="346" font-size="15.5" font-weight="700" fill="#262043">测量驱动排版</text>
  <rect x="218" y="318" width="173" height="44" rx="22" fill="#DDF5EC"/>
  <circle cx="235" cy="340" r="6" fill="#1FC79B"/>
  <text x="252" y="346" font-size="15.5" font-weight="700" fill="#262043">99 项自动化测试</text>
  <rect x="405" y="318" width="148" height="44" rx="22" fill="#FFE5EF"/>
  <circle cx="422" cy="340" r="6" fill="#FF4D8D"/>
  <text x="439" y="346" font-size="15.5" font-weight="700" fill="#262043">组件库与布局</text>

  <text x="56" y="417" font-size="13" font-weight="700" fill="#262043" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">99 TESTS · 21 GATES · 12 THEMES · 21/21 PASS</text>

