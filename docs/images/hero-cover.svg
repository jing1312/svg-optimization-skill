<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="hcT hcD" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <title id="hcT">svg-optimization-skill · SVG 视觉系统引擎</title>
  <desc id="hcD">项目主视觉：左侧是产品定位与三大能力（主题换肤、设计 Token、质量门禁），右侧是可视化编辑器的迷你场景——选中元素的八向手柄、红色吸附参考线与等距徽章，下方挂着门禁通过的绿色徽章。</desc>
  <defs>
    <linearGradient id="hgBase" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6f7ff"/>
      <stop offset="0.4" stop-color="#f1eefc"/>
      <stop offset="0.72" stop-color="#f7ecf4"/>
      <stop offset="1" stop-color="#fdf1e9"/>
    </linearGradient>
    <radialGradient id="hgDriftLav" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cdd4ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#cdd4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hgDriftRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd4e0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffd4e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hgDriftAqua" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9f0ea" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9f0ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hgRibbon" gradientUnits="userSpaceOnUse" x1="-60" y1="500" x2="1280" y2="330">
      <stop offset="0" stop-color="#6ee3d4"/>
      <stop offset="0.4" stop-color="#82b0f2"/>
      <stop offset="0.72" stop-color="#a48df0"/>
      <stop offset="1" stop-color="#f4aac6"/>
    </linearGradient>
    <linearGradient id="hgSel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82b0f2"/>
      <stop offset="1" stop-color="#a48df0"/>
    </linearGradient>
    <linearGradient id="hgFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="hgCardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8f7fe8" flood-opacity="0.22"/>
    </filter>
    <filter id="hgSilkBlur" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- 底色光场 -->
  <rect width="1200" height="560" fill="url(#hgBase)"/>
  <ellipse cx="220" cy="140" rx="320" ry="180" fill="url(#hgDriftLav)"/>
  <ellipse cx="1030" cy="470" rx="340" ry="200" fill="url(#hgDriftRose)"/>
  <ellipse cx="660" cy="30" rx="290" ry="130" fill="url(#hgDriftAqua)"/>

  <!-- 底部绸带：氛围层，压低不抢内容 -->
  <path d="M -60 512 C 260 492 520 420 780 404 C 980 392 1140 366 1280 336 L 1280 348 C 1120 392 950 424 760 438 C 520 456 260 520 -60 536 Z" fill="url(#hgRibbon)" opacity="0.4" filter="url(#hgSilkBlur)"/>
  <path d="M -60 516 C 270 498 530 428 790 412 C 985 400 1145 374 1280 344 L 1280 350 C 1130 396 955 430 765 444 C 525 462 265 524 -60 540 Z" fill="url(#hgRibbon)" opacity="0.2"/>
  <path d="M 470 434 C 560 420 660 414 750 418" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <rect x="0" y="330" width="1200" height="230" fill="url(#hgFog)"/>

  <!-- 左：产品信息 -->
  <g>
    <text x="80" y="152" font-size="14" font-weight="700" letter-spacing="4.5" fill="#615cae">SVG-OPTIMIZATION-SKILL</text>
    <text x="80" y="248" font-size="62" font-weight="800" fill="#343063">SVG 视觉系统引擎</text>
    <text x="80" y="304" font-size="21" fill="#454079">让 AI 生成的每一张图，都有设计系统与质量门禁兜底</text>
    <text x="80" y="342" font-size="17" fill="#413c76">生成规范 · 手工打磨 · 门禁放行，一条完整工作流</text>
    <g font-size="17" font-weight="600">
      <rect x="80" y="392" width="152" height="40" rx="20" fill="#ffffff" fill-opacity="0.86" stroke="#ddd6f4" stroke-width="1"/>
      <text x="156" y="417" text-anchor="middle" fill="#4a4494">12 主题编辑器</text>
      <rect x="248" y="392" width="166" height="40" rx="20" fill="#ffffff" fill-opacity="0.86" stroke="#ddd6f4" stroke-width="1"/>
      <text x="331" y="417" text-anchor="middle" fill="#4a4494">设计 Token 系统</text>
      <rect x="430" y="392" width="172" height="40" rx="20" fill="#ffffff" fill-opacity="0.86" stroke="#ddd6f4" stroke-width="1"/>
      <text x="516" y="417" text-anchor="middle" fill="#4a4494">G1–G4 质量门禁</text>
    </g>
    <text x="80" y="498" font-size="15" font-weight="600" fill="#454079">99 项自动化测试 · 21 道静态门禁 · 离线单文件编辑器</text>
  </g>

  <!-- 右：迷你编辑器场景（motif：选中手柄 + 吸附线 + 等距徽章） -->
  <g data-motif="editor-canvas" data-motif-message="迷你编辑器画布：八向选中手柄、红色吸附参考线与等距徽章，下方门禁通过章——所见即产品">
    <!-- 画布卡片 -->
    <rect x="700" y="110" width="384" height="304" rx="20" fill="#ffffff" fill-opacity="0.9" stroke="#dcd5f5" stroke-width="1.2" filter="url(#hgCardShadow)"/>
    <!-- 画布网格点 -->
    <g fill="#b9b2e2" fill-opacity="0.4">
      <circle cx="736" cy="146" r="1.6"/><circle cx="784" cy="146" r="1.6"/><circle cx="832" cy="146" r="1.6"/><circle cx="880" cy="146" r="1.6"/><circle cx="928" cy="146" r="1.6"/><circle cx="976" cy="146" r="1.6"/><circle cx="1024" cy="146" r="1.6"/>
      <circle cx="736" cy="194" r="1.6"/><circle cx="784" cy="194" r="1.6"/><circle cx="832" cy="194" r="1.6"/><circle cx="880" cy="194" r="1.6"/><circle cx="928" cy="194" r="1.6"/><circle cx="976" cy="194" r="1.6"/><circle cx="1024" cy="194" r="1.6"/>
      <circle cx="736" cy="242" r="1.6"/><circle cx="784" cy="242" r="1.6"/><circle cx="832" cy="242" r="1.6"/><circle cx="880" cy="242" r="1.6"/><circle cx="928" cy="242" r="1.6"/><circle cx="976" cy="242" r="1.6"/><circle cx="1024" cy="242" r="1.6"/>
      <circle cx="736" cy="290" r="1.6"/><circle cx="784" cy="290" r="1.6"/><circle cx="832" cy="290" r="1.6"/><circle cx="880" cy="290" r="1.6"/><circle cx="928" cy="290" r="1.6"/><circle cx="976" cy="290" r="1.6"/><circle cx="1024" cy="290" r="1.6"/>
      <circle cx="736" cy="338" r="1.6"/><circle cx="784" cy="338" r="1.6"/><circle cx="832" cy="338" r="1.6"/><circle cx="880" cy="338" r="1.6"/><circle cx="928" cy="338" r="1.6"/><circle cx="976" cy="338" r="1.6"/><circle cx="1024" cy="338" r="1.6"/>
      <circle cx="736" cy="386" r="1.6"/><circle cx="784" cy="386" r="1.6"/><circle cx="832" cy="386" r="1.6"/><circle cx="880" cy="386" r="1.6"/><circle cx="928" cy="386" r="1.6"/><circle cx="976" cy="386" r="1.6"/><circle cx="1024" cy="386" r="1.6"/>
    </g>
    <!-- 吸附参考线（编辑器签名：红色对齐线） -->
    <line x1="1000" y1="86" x2="1000" y2="352" stroke="#ff5b7f" stroke-width="1.3" stroke-opacity="0.85"/>
    <line x1="712" y1="305" x2="1176" y2="305" stroke="#ff5b7f" stroke-width="1.3" stroke-opacity="0.85"/>
    <!-- 邻居元素 -->
    <circle cx="762" cy="212" r="30" fill="#cdd4ff"/>
    <circle cx="754" cy="204" r="9" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="928" y="140" width="72" height="72" rx="14" fill="#f3d9e6"/>
    <!-- 等距徽章：圆与选中矩形的间距 -->
    <rect x="784" y="270" width="52" height="24" rx="12" fill="#ffffff" stroke="#c9c2ef" stroke-width="1"/>
    <text x="810" y="286.5" text-anchor="middle" font-size="13" font-weight="700" fill="#5b53b8">40</text>
    <!-- 选中元素 + 八向手柄 -->
    <rect x="830" y="250" width="170" height="110" rx="10" fill="url(#hgSel)"/>
    <rect x="830" y="250" width="170" height="110" rx="10" fill="none" stroke="#5b6be8" stroke-width="1.4"/>
    <g fill="#ffffff" stroke="#5b6be8" stroke-width="1.3">
      <rect x="825" y="245" width="10" height="10" rx="2"/>
      <rect x="910" y="245" width="10" height="10" rx="2"/>
      <rect x="995" y="245" width="10" height="10" rx="2"/>
      <rect x="825" y="300" width="10" height="10" rx="2"/>
      <rect x="995" y="300" width="10" height="10" rx="2"/>
      <rect x="825" y="355" width="10" height="10" rx="2"/>
      <rect x="910" y="355" width="10" height="10" rx="2"/>
      <rect x="995" y="355" width="10" height="10" rx="2"/>
    </g>
    <!-- 卡片内标题字：示意排版测量 -->
    <text x="846" y="316" font-size="26" font-weight="700" fill="#2d2a5e">设计</text>
    <!-- 门禁通过章 -->
    <rect x="918" y="446" width="172" height="42" rx="21" fill="#ffffff" fill-opacity="0.94" stroke="#bfe8d4" stroke-width="1.2"/>
    <path d="M 944 467 l 8 8 l 15 -16" fill="none" stroke="#147a52" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="978" y="473" font-size="16" font-weight="700" fill="#147a52">G1–G4 通过</text>
  </g>
</svg>
