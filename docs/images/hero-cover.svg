<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="hcT hcD" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="hcT">svg-optimization-skill · SVG 视觉系统引擎</title>
  <desc id="hcD">浅色多巴胺主视觉：奶油底上墨色大字标题与糖果色能力胶囊，右侧是可视化编辑器的迷你场景（选中态蓝框八向手柄、门禁通过徽章、红色吸附参考线），底部五色多巴胺彩带收底。</desc>

  <defs>
    <radialGradient id="hgDrift" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1FC79B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1FC79B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景奶油底 + 漂浮薄荷光晕 -->
  <rect width="1200" height="560" fill="#FFF6E9"/>
  <circle cx="330" cy="430" r="210" fill="url(#hgDrift)"/>

  <!-- 右上电光蓝大圆（不侵入卡片，仅在右上方留一道弧） -->
  <circle cx="1218" cy="138" r="86" fill="#2F5BFF"/>

  <!-- 叠层便签（薄荷 / 淡紫） -->
  <rect x="788" y="150" width="400" height="250" rx="22" fill="#D8F2E7" transform="rotate(5 988 275)"/>
  <rect x="742" y="126" width="400" height="250" rx="22" fill="#E7E1FF" transform="rotate(-4 942 251)"/>

  <!-- ============ 编辑器场景主卡 ============ -->
  <g data-motif="editor-canvas" data-motif-message="可视化编辑器场景：选中元素八向手柄、门禁通过徽章、红色吸附参考线">
    <rect x="762" y="148" width="388" height="252" rx="20" fill="#262043" opacity="0.14"/>
    <rect x="762" y="140" width="388" height="252" rx="20" fill="#FFFFFF"/>
    <!-- 卡头 -->
    <circle cx="788" cy="166" r="6" fill="#FF6B4A"/>
    <circle cx="810" cy="166" r="6" fill="#FFC53D"/>
