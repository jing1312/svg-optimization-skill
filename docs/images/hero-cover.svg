<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="hcT hcD">
  <title id="hcT">svg-optimization-skill · 流光体系：光是画出来的</title>
  <desc id="hcD">梦幻流光主视觉：光谱底色、单一光晕、一条丝带手势贯穿画面，玻璃浮球分三个景深，衬线大字居于手势的安静区。</desc>
  <defs>
    <linearGradient id="hcBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="0.22" stop-color="#eef0ff"/>
      <stop offset="0.45" stop-color="#ece6fb"/>
      <stop offset="0.68" stop-color="#f2e4f6"/>
      <stop offset="0.85" stop-color="#f9e9ee"/>
      <stop offset="1" stop-color="#fdf0ea"/>
    </linearGradient>
    <radialGradient id="hcBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7ec" stop-opacity="0.9"/>
      <stop offset="0.32" stop-color="#ffe9d9" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#f4dded" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f4dded" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcCoolWash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8d2ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c8d2ff" stop-opacity="0"/>
    </radialGradient>
        <linearGradient id="hcEchoGrad" gradientUnits="userSpaceOnUse" x1="-80" y1="470" x2="1300" y2="84">
      <stop offset="0" stop-color="#bfeee6"/>
      <stop offset="0.35" stop-color="#c4d6f8"/>
      <stop offset="0.68" stop-color="#dccff8"/>
      <stop offset="1" stop-color="#f6d4e2"/>
    </linearGradient>
    <linearGradient id="hcRibbonCore" gradientUnits="userSpaceOnUse" x1="-80" y1="470" x2="1300" y2="84">
      <stop offset="0" stop-color="#d7fbf6"/>
      <stop offset="0.35" stop-color="#d9e2ff"/>
      <stop offset="0.68" stop-color="#e9defe"/>
      <stop offset="1" stop-color="#ffe6ef"/>
    </linearGradient>
    <linearGradient id="hcRibbon" gradientUnits="userSpaceOnUse" x1="-80" y1="470" x2="1300" y2="84">
      <stop offset="0" stop-color="#49cdbd"/>
      <stop offset="0.35" stop-color="#5d95ee"/>
      <stop offset="0.68" stop-color="#8f77ec"/>
      <stop offset="1" stop-color="#ee92b6"/>
    </linearGradient>
    <linearGradient id="hcSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hcOrbA" cx="0.62" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#e6e0fb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bcaef2" stop-opacity="0.14"/>
    </radialGradient>
    <radialGradient id="hcOrbB" cx="0.64" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.5" stop-color="#cfc0f8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8a76e0" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="hcOrbShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f7fd8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8f7fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcSparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hcFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="hcSilkBlur" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="hcEchoBlur" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="hcRibbonBlur" x="-30%" y="-220%" width="160%" height="540%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="hcOrbSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="hcInkLift" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#8f7fe8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 光场：光谱底 + 主光晕 + 冷色补光 -->
  <rect width="1200" height="560" fill="url(#hcBase)"/>
  <circle cx="880" cy="130" r="480" fill="url(#hcBloom)"/>
  <circle cx="120" cy="520" r="380" fill="url(#hcCoolWash)"/>

  <!-- 手势：一匹绸（闭合填充带，两端收尖中段丰盈，双层 + 褶皱 + 远处回声） -->
  <path d="M -80 470 C 200 452 380 300 620 258 C 830 224 1050 190 1300 78 L 1300 90 C 1060 200 840 320 640 348 C 400 380 210 470 -80 486 Z" fill="url(#hcRibbon)" opacity="0.62" filter="url(#hcSilkBlur)"/>
  <path d="M -80 464 C 200 448 380 302 620 262 C 830 230 1050 198 1300 88 L 1300 92 C 1064 202 848 310 648 336 C 412 364 214 460 -80 478 Z" fill="url(#hcRibbonCore)" opacity="0.92"/>
  <path d="M -80 470 C 200 452 380 300 620 258 C 830 224 1050 190 1300 78" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M 470 300 C 530 285 600 278 660 280" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <path d="M 880 250 C 940 238 1010 214 1080 186" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M -60 492 C 240 462 430 340 650 306 C 890 272 1050 208 1270 96" fill="none" stroke="#7a6cc8" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
  <path d="M -40 150 C 300 132 560 96 920 76 C 1090 66 1200 48 1268 34 L 1268 40 C 1200 54 1092 72 924 88 C 566 108 306 144 -40 162 Z" fill="url(#hcEchoGrad)" opacity="0.5" filter="url(#hcEchoBlur)"/>

  <rect x="0" y="300" width="1200" height="260" fill="url(#hcFog)"/>

  <!-- 远景浮球（左下裁切，浅景深） -->
  <circle cx="-40" cy="470" r="210" fill="url(#hcOrbA)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" opacity="0.85" filter="url(#hcOrbSoft)"/>

  <!-- 中近景浮球关系图（motif：浮球连成关系，其中一枚承载核验） -->
  <g data-motif="verify-nodes" data-motif-message="浮球连成关系图，一枚承载核验勾：秩序内在于光，门禁刻进画里">
    <circle cx="952" cy="352" r="92" fill="url(#hcSparkGlow)"/>
    <circle cx="566" cy="88" r="40" fill="url(#hcSparkGlow)"/>
    <!-- 关系连线 -->
    <g fill="none" stroke="#6b64a8" stroke-opacity="0.35" stroke-width="1">
      <path d="M 586 94 Q 830 120 1076 202"/>
      <path d="M 1080 220 Q 1046 288 966 336"/>
      <path d="M 582 106 Q 770 220 934 336"/>
    </g>
    <ellipse cx="952" cy="438" rx="48" ry="10" fill="url(#hcOrbShadow)" fill-opacity="1"/>
    <circle cx="952" cy="352" r="62" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
    <circle cx="930" cy="324" r="8" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M 898 321 A 62 62 0 0 1 983 298" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 核验勾：秩序内在于光 -->
    <path d="M 934 356 l 13 13 l 26 -26" fill="none" stroke="#43398f" stroke-opacity="0.95" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="566" cy="88" r="22" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
    <circle cx="558" cy="80" r="3" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="1088" cy="208" r="13" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
    <g fill="#ffffff">
      <circle cx="760" cy="180" r="20" fill="url(#hcSparkGlow)"/>
      <path d="M760 166 C 762.2 177.8 762.2 177.8 774 180 C 762.2 182.2 762.2 182.2 760 194 C 757.8 182.2 757.8 182.2 746 180 C 757.8 177.8 757.8 177.8 760 166 Z"/>
      <circle cx="1016" cy="116" r="14" fill="url(#hcSparkGlow)"/>
      <path d="M1016 107 C 1017.5 114.5 1017.5 114.5 1025 116 C 1017.5 117.5 1017.5 117.5 1016 125 C 1014.5 117.5 1014.5 117.5 1007 116 C 1014.5 114.5 1014.5 114.5 1016 107 Z" fill-opacity="0.95"/>
    </g>
  </g>

  <!-- 安静区：排印 -->
  <text x="84" y="118" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#5c569c" letter-spacing="6">SVG ATELIER · DREAMLIGHT N°01</text>
  <text x="84" y="246" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="74" font-weight="700" fill="#37326e" letter-spacing="6" filter="url(#hcInkLift)">光是画出来的</text>
  <text x="84" y="296" font-family="Georgia, Times New Roman, serif" font-size="23" font-style="italic" fill="#5f58a0">Where light is drawn, order follows.</text>
  <g data-role="atelier-mark">
    <circle cx="1064" cy="512" r="9" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.8"/>
    <path d="M 1059 512 l 4 4 l 9 -9" fill="none" stroke="#43398f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1046" y="516" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" font-weight="600" fill="#5c569c" letter-spacing="3">SVG ATELIER</text>
  </g>
  <text x="96" y="506" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5c569c">机器门禁 G1–G4 · 引用完整性 R1·R2 · 渲染实测 T0 / T1 / T2</text>
</svg>
