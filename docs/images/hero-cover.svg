  <circle cx="86" cy="62" r="5.5" fill="#FFB800"/>
  <circle cx="108" cy="62" r="5.5" fill="#FF6B4A"/>
  <circle cx="130" cy="62" r="5.5" fill="#1FC79B"/>
  <text x="152" y="67" font-size="13" font-weight="700" letter-spacing="1" fill="#262043">SVG-OPTIMIZATION · 视觉系统工具链</text>

