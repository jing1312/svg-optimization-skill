<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="hcT hcD">
  <title id="hcT">svg-optimization-skill · 流光体系：光是画出来的</title>
  <desc id="hcD">梦幻流光主视觉：光谱底色、单一光晕、一条丝带手势贯穿画面，玻璃浮球分三个景深，衬线大字居于手势的安静区。</desc>
  <defs>
    <linearGradient id="hcBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="0.22" stop-color="#eef0ff"/>
      <stop offset="0.45" stop-color="#ece6fb"/>
      <stop offset="0.68" stop-color="#f2e4f6"/>
      <stop offset="0.85" stop-color="#f9e9ee"/>
      <stop offset="1" stop-color="#fdf0ea"/>
    </linearGradient>
    <radialGradient id="hcBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7ec" stop-opacity="0.9"/>
      <stop offset="0.32" stop-color="#ffe9d9" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#f4dded" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f4dded" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcCoolWash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8d2ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c8d2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hcRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee3d4"/>
      <stop offset="0.35" stop-color="#82b0f2"/>
      <stop offset="0.68" stop-color="#a48df0"/>
      <stop offset="1" stop-color="#f4aac6"/>
    </linearGradient>
    <linearGradient id="hcSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hcOrbA" cx="0.62" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#e6e0fb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bcaef2" stop-opacity="0.14"/>
    </radialGradient>
    <radialGradient id="hcOrbB" cx="0.64" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.5" stop-color="#ddd3f8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a99aef" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="hcOrbShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f7fd8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8f7fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcSparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hcFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="hcRibbonBlur" x="-30%" y="-220%" width="160%" height="540%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="hcOrbSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="hcInkLift" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#8f7fe8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 光场：光谱底 + 主光晕 + 冷色补光 -->
  <rect width="1200" height="560" fill="url(#hcBase)"/>
  <circle cx="880" cy="130" r="480" fill="url(#hcBloom)"/>
  <circle cx="120" cy="520" r="380" fill="url(#hcCoolWash)"/>

  <!-- 手势：一条丝带的三层（雾带 / 锐锋 / 回声） -->
  <path d="M -60 470 C 260 470 380 250 660 260 S 1120 190 1290 80" fill="none" stroke="url(#hcRibbon)" stroke-width="70" stroke-linecap="round" opacity="0.5" filter="url(#hcRibbonBlur)"/>
  <path d="M -60 430 C 260 428 400 210 680 218 S 1120 150 1290 40" fill="none" stroke="url(#hcRibbon)" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
  <path d="M -40 150 C 300 130 500 92 900 72 S 1150 44 1240 22" fill="none" stroke="url(#hcRibbon)" stroke-width="2.5" stroke-linecap="round" opacity="0.22"/>
  <path d="M -60 456 C 260 456 380 236 660 246 S 1120 176 1290 66" fill="none" stroke="url(#hcSheen)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <rect x="0" y="300" width="1200" height="260" fill="url(#hcFog)"/>

  <!-- 远景浮球（左下裁切，浅景深） -->
  <circle cx="-40" cy="470" r="210" fill="url(#hcOrbA)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" opacity="0.85" filter="url(#hcOrbSoft)"/>

  <!-- 中近景浮球与星芒（motif：场景的呼吸） -->
  <g data-motif="light-orbs" data-motif-message="浮球与星芒是光场的呼吸，服从同一个光源">
    <circle cx="952" cy="352" r="92" fill="url(#hcSparkGlow)"/>
    <circle cx="566" cy="88" r="40" fill="url(#hcSparkGlow)"/>
    <ellipse cx="952" cy="436" rx="42" ry="9" fill="url(#hcOrbShadow)"/>
    <circle cx="952" cy="352" r="62" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
    <circle cx="932" cy="326" r="7" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="566" cy="88" r="22" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
    <circle cx="558" cy="80" r="3" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="1088" cy="208" r="13" fill="url(#hcOrbB)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
    <g fill="#ffffff">
      <circle cx="760" cy="180" r="20" fill="url(#hcSparkGlow)"/>
      <path d="M760 166 C 762.2 177.8 762.2 177.8 774 180 C 762.2 182.2 762.2 182.2 760 194 C 757.8 182.2 757.8 182.2 746 180 C 757.8 177.8 757.8 177.8 760 166 Z"/>
      <circle cx="1016" cy="116" r="14" fill="url(#hcSparkGlow)"/>
      <path d="M1016 107 C 1017.5 114.5 1017.5 114.5 1025 116 C 1017.5 117.5 1017.5 117.5 1016 125 C 1014.5 117.5 1014.5 117.5 1007 116 C 1014.5 114.5 1014.5 114.5 1016 107 Z" fill-opacity="0.95"/>
      <circle cx="560" cy="142" r="10" fill="url(#hcSparkGlow)"/>
      <path d="M560 136 C 561 141 561 141 566 142 C 561 143 561 143 560 148 C 559 143 559 143 554 142 C 559 141 559 141 560 136 Z" fill-opacity="0.9"/>
    </g>
  </g>

  <!-- 安静区：排印 -->
  <text x="84" y="118" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" font-weight="600" fill="#5c569c" letter-spacing="6">SVG ATELIER · DREAMLIGHT N°01</text>
  <text x="84" y="246" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif" font-size="68" font-weight="700" fill="#37326e" letter-spacing="4" filter="url(#hcInkLift)">光是画出来的</text>
  <text x="84" y="296" font-family="Georgia, Times New Roman, serif" font-size="20" font-style="italic" fill="#6b64a8">Where light is drawn, order follows.</text>
  <text x="96" y="506" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12" fill="#5c569c">机器门禁 G1–G4 · 引用完整性 R1·R2 · 渲染实测 T0 / T1 / T2</text>
</svg>
