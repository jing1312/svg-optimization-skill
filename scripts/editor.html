<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SVG 编辑器</title>
<style>
  :root { --bg:#eef1f6; --panel:#fff; --line:#dfe5ef; --ink:#2a3342; --sub:#8a94a6; --accent:#4f7cff; --danger:#e5484d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; font-size:13px; color:var(--ink);
         height:100vh; display:flex; flex-direction:column; background:var(--bg); overflow:hidden; }
  #svgo-top { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
  .tbtn { border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 12px; cursor:pointer; font-size:13px; }
  .tbtn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .tbtn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tbtn:disabled { opacity:.45; cursor:default; }
  #svgo-filename { color:var(--sub); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spacer { flex:1; }
  select.tsel { border:1px solid var(--line); border-radius:6px; padding:4px 6px; background:#fff; max-width:180px; }
  #svgo-main { flex:1; display:flex; min-height:0; }
  #svgo-left { width:176px; background:var(--panel); border-right:1px solid var(--line); padding:10px; overflow-y:auto; flex:none; }
  #svgo-right { width:228px; background:var(--panel); border-left:1px solid var(--line); padding:12px; overflow-y:auto; flex:none; }
  .panel-label { color:var(--sub); font-size:11px; margin:0 0 8px; }
  .panel-label.mt { margin-top:14px; }
  #svgo-comp-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .comp { border:1px solid var(--line); border-radius:8px; padding:8px 4px; text-align:center; cursor:grab; user-select:none; }
  .comp:hover { border-color:var(--accent); }
  .comp .glyph { height:16px; margin-bottom:5px; display:flex; align-items:center; justify-content:center; }
  #svgo-center { flex:1; position:relative; min-width:0;
    background:repeating-conic-gradient(#edf0f5 0% 25%, #f7f8fa 0% 50%) 0 0 / 20px 20px; }
  #svgo-stage { width:100%; height:100%; display:block; touch-action:none; }
  #svgo-welcome { position:absolute; inset:0; display:flex; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; color:var(--sub); pointer-events:none; }
  #svgo-welcome .big { font-size:17px; color:var(--ink); }
  #svgo-status { position:absolute; left:14px; bottom:10px; display:flex; gap:14px; font-size:12px; color:#6b7690;
    background:#ffffffee; border:1px solid var(--line); border-radius:8px; padding:4px 12px; }
  .frow { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .frow label { width:46px; color:var(--sub); flex:none; }
  .frow input[type=number], .frow input[type=text], .frow select {
    border:1px solid var(--line); border-radius:6px; padding:3px 8px; min-width:0; width:100%; font-size:12.5px; }
  .frow input[type=color] { width:32px; height:24px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; }
  #svgo-layers { line-height:1.9; }
  .layer { display:flex; gap:6px; align-items:center; padding:0 6px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .layer:hover { background:#f0f4fb; }
  .layer.sel { background:#eef3ff; }
  .layer .nm { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .layer.locked .nm, .layer.hidden .nm { opacity:.5; }
  #svgo-toast { position:fixed; top:52px; left:50%; transform:translateX(-50%); background:#333c4e; color:#fff;
    padding:6px 16px; border-radius:8px; display:none; z-index:99; max-width:70%; font-size:12.5px; }
  #svgo-textedit { position:absolute; display:none; border:1px dashed var(--accent); background:#ffffffee;
    font-size:13px; padding:2px 4px; z-index:15; outline:none; }
  #svgo-dropzone { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#4f7cff14; border:3px dashed var(--accent); z-index:90; pointer-events:none;
    font-size:20px; color:var(--accent); font-weight:700; }
</style>
</head>
<body>

<div id="svgo-top">
  <b style="margin-right:6px">SVG 编辑器</b>
  <button class="tbtn" id="svgo-open">打开</button>
  <span id="svgo-filename">未打开文件</span>
  <span class="spacer"></span>
  <button class="tbtn" id="svgo-undo" disabled title="Ctrl+Z">↩ 撤销</button>
  <button class="tbtn" id="svgo-redo" disabled title="Ctrl+Y">↪ 重做</button>
  <select class="tsel" id="svgo-theme-sel" title="主题"></select>
  <button class="tbtn primary" id="svgo-save" disabled title="Ctrl+S">💾 保存</button>
</div>

<div id="svgo-main">
  <div id="svgo-left">
    <p class="panel-label">组件库</p>
    <div id="svgo-comp-grid"></div>
    <p class="panel-label mt">图层</p>
    <div id="svgo-layers"><span style="color:var(--sub)">（未打开文件）</span></div>
  </div>

  <div id="svgo-center">
    <svg id="svgo-stage" xmlns="http://www.w3.org/2000/svg">
      <g id="svgo-content"></g>
      <g id="svgo-overlay" pointer-events="none"></g>
    </svg>
    <div id="svgo-welcome">
      <div class="big">把 .svg 文件拖进来</div>
      <div>或点左上角「打开」 · 全程本地处理，不会上传</div>
    </div>
    <div id="svgo-status"><span id="svgo-status-zoom">缩放 100%</span><span id="svgo-status-snap">未打开文件</span><span id="svgo-status-oob"></span></div>
    <input id="svgo-textedit" type="text">
  </div>

  <div id="svgo-right">
    <p class="panel-label">属性</p>
    <div class="frow"><label>X</label><input id="svgo-px" type="number" step="1" disabled></div>
    <div class="frow"><label>Y</label><input id="svgo-py" type="number" step="1" disabled></div>
    <div class="frow"><label>W × H</label><input id="svgo-pw" type="number" step="1" disabled><input id="svgo-ph" type="number" step="1" disabled></div>
    <p class="panel-label mt">选中元素</p>
    <div id="svgo-selinfo" style="color:var(--sub)">无选中</div>
    <p class="panel-label mt">填充色</p>
    <div class="frow"><label>颜色</label><input id="svgo-fill" type="color" disabled></div>
    <p class="panel-label mt">吸附控制台</p>
    <div class="frow"><label style="width:auto"><input type="checkbox" id="svgo-sn-guide" checked> 参考线吸附</label></div>
    <div class="frow"><label style="width:auto"><input type="checkbox" id="svgo-sn-spacing" checked> 等距检测</label></div>
    <div class="frow"><label style="width:auto"><input type="checkbox" id="svgo-sn-semantic" checked> 同类识别</label></div>
    <div class="frow"><label>距离</label><input id="svgo-sn-threshold" type="range" min="2" max="16" step="1" value="6" style="flex:1"><span id="svgo-sn-thval">6px</span></div>
  </div>
</div>

<div id="svgo-toast"></div>
<div id="svgo-dropzone">松手载入 SVG</div>
<input id="svgo-file-input" type="file" accept=".svg,image/svg+xml" style="display:none">

<script>
const TOKEN_KEYS = ['bg','surface','primary','primaryDark','accent','title','body','muted','success','warning','danger'];

const T = (id, name, dark, tokens, default_ = false) => ({ id, name, dark, tokens, default: default_ });

const THEMES = [
  T('aurora-light', '极光蓝紫', false, { bg:'#f4f6ff', surface:'#ffffff', primary:'#4f7cff', primaryDark:'#3b63d9', accent:'#22d3ee', title:'#1e2a5a', body:'#5a6a94', muted:'#8a94a6', success:'#10b981', warning:'#f59e0b', danger:'#e5484d' }, true),
  T('teal-bio', '生物青绿', false, { bg:'#effbf6', surface:'#ffffff', primary:'#14b8a6', primaryDark:'#0d9488', accent:'#fbbf24', title:'#0f3d33', body:'#4d7268', muted:'#6b8f85', success:'#10b981', warning:'#f59e0b', danger:'#e5484d' }),
  T('deep-neon', '深空霓虹', true, { bg:'#131a3d', surface:'#1c2454', primary:'#3f7dff', primaryDark:'#2f5fc4', accent:'#67e8f9', title:'#f2f6ff', body:'#9fb0dd', muted:'#7688b8', success:'#34d399', warning:'#fbbf24', danger:'#f87171' }),
  T('blue-orange', '经典蓝橙', false, { bg:'#f8fafc', surface:'#ffffff', primary:'#2563eb', primaryDark:'#1d4ed8', accent:'#f97316', title:'#16233f', body:'#5c6b85', muted:'#94a1b8', success:'#10b981', warning:'#f59e0b', danger:'#ef4444' }),
  T('rose', '樱花粉', false, { bg:'#fff5f8', surface:'#ffffff', primary:'#db2777', primaryDark:'#be185d', accent:'#fb7185', title:'#4c1136', body:'#96687d', muted:'#c295a8', success:'#10b981', warning:'#f59e0b', danger:'#e5484d' }),
  T('sunset', '落日橙粉', false, { bg:'#f97316', surface:'#ffffff', primary:'#ffffff', primaryDark:'#ffe1d1', accent:'#db2777', title:'#ffffff', body:'#ffe1d1', muted:'#ffc9b0', success:'#10b981', warning:'#fbbf24', danger:'#e5484d' }),
  T('grape', '葡萄紫', false, { bg:'#faf7ff', surface:'#ffffff', primary:'#7c3aed', primaryDark:'#6d28d9', accent:'#c084fc', title:'#2e1065', body:'#6d5f92', muted:'#a99cc7', success:'#10b981', warning:'#f59e0b', danger:'#e5484d' }),
  T('lime', '柠檬苏打', false, { bg:'#fdfceb', surface:'#ffffff', primary:'#65a30d', primaryDark:'#4d7c0f', accent:'#facc15', title:'#1f2a10', body:'#6b754a', muted:'#98a06f', success:'#16a34a', warning:'#f59e0b', danger:'#dc2626' }),
  T('forest', '森林墨绿', true, { bg:'#10291b', surface:'#173a26', primary:'#22c55e', primaryDark:'#16a34a', accent:'#86efac', title:'#eafff2', body:'#93b8a2', muted:'#6b8f7a', success:'#22c55e', warning:'#fbbf24', danger:'#f87171' }),
  T('graphite-gold', '石墨鎏金', true, { bg:'#191a1f', surface:'#26272e', primary:'#eab308', primaryDark:'#ca8a04', accent:'#fbbf24', title:'#f5f2ea', body:'#9b978c', muted:'#6e6a60', success:'#10b981', warning:'#fbbf24', danger:'#f87171' }),
  T('ocean', '海洋蓝青', false, { bg:'#edfbfe', surface:'#ffffff', primary:'#0891b2', primaryDark:'#0e7490', accent:'#22d3ee', title:'#083344', body:'#4b7484', muted:'#7ba3b3', success:'#10b981', warning:'#f59e0b', danger:'#e5484d' }),
  T('mono', '极简黑白', false, { bg:'#ffffff', surface:'#ffffff', primary:'#111111', primaryDark:'#000000', accent:'#555555', title:'#111111', body:'#44444a', muted:'#77777d', success:'#10b981', warning:'#f59e0b', danger:'#e5484d' }),
];

const LAYOUTS = [
  { id:'left-right', name:'左文右标' },
  { id:'centered', name:'居中对称' },
  { id:'feature-grid', name:'标题+特性格' },
  { id:'diagonal', name:'斜切动势' },
];

const MIXES = [
  { id:'solid', name:'纯色底' },
  { id:'aurora', name:'极光渐变网' },
  { id:'band', name:'渐变色带' },
  { id:'multichip', name:'多彩功能位' },
];

// 换肤配色映射 · 最终规则（文档：.superpowers/2026-09-07-color-repaint-rules.md）
// R1 同色同档：明度差 <0.02 且色距 <24 的源色聚为一簇，同簇拿同一目标 token
// R2 文字禁中间档：文字簇按原色极性只落亮端(relLum≥0.65)或暗端(relLum≤0.45)候选
// R3 对比度兜底：以「极性锁定」近似实现——原文浅色换肤后仍浅、深色仍深，
//    由 relLum 窗口保证与画布两端的安全距离；元素级背景检测留待后续升级
// R4 低透明度(<0.3)的填充/描边/渐变 stop 属高光氛围层，不参与换肤、不入源色池
// R5 语义色(success/warning/danger)不进入映射通道，全主题固定
// R6 彩色/中性分通道：sat≥0.18 且绝对色差 max-min≥24 才算彩色
// （仅看相对饱和度会让 #24263a 这类近黑深色虚高误入彩色通道，已被
//   graphite-gold 验证抓出；低明度深色的饱和度必须用绝对色差复核）

const OPACITY_ATTR = { fill: 'fill-opacity', stroke: 'stroke-opacity', 'stop-color': 'stop-opacity' };
const TEXT_TAGS = ['text', 'tspan'];
const CLUSTER_DL = 0.02;   // R1 聚类明度窗口
const CLUSTER_DIST = 24;   // R1 聚类色距窗口
const LIGHT_FLOOR = 0.65;  // R2 亮端候选下限（relLum）
const DARK_CEIL = 0.45;    // R2 暗端候选上限（relLum）
const MIN_OPACITY = 0.3;   // R4 参与换肤的最低不透明度

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function colorDist(a, b) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return Math.abs(A[0]-B[0]) + Math.abs(A[1]-B[1]) * 1.2 + Math.abs(A[2]-B[2]);
}
function sat(hex) { const [r, g, b] = hexToRgb(hex); const mx = Math.max(r, g, b), mn = Math.min(r, g, b); return mx === 0 ? 0 : (mx - mn) / mx; }
// 彩色判定：相对饱和度 + 绝对色差双门槛（防深色近黑误判，见 R6 注释）
function isChromatic(hex) {
  const [r, g, b] = hexToRgb(hex);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  return mx > 0 && (mx - mn) / mx >= 0.18 && (mx - mn) >= 24;
}

// 从任意颜色集合提炼一套组件默认配色（跨主题锁定用）：
// 彩色按 relLum 升序填 primaryDark/primary/accent，中性按 relLum 升序填
// title/body/muted/bg/surface（分位对号），语义色与缺省键沿用 baseline
const CHROMA_TARGETS = ['primaryDark', 'primary', 'accent'];
const NEUTRAL_TARGETS = ['title', 'body', 'muted', 'bg', 'surface'];
function paletteFromColors(colors, baseline) {
  const out = { ...baseline };
  const uniq = [...new Set((colors || [])
    .filter(c => /^#[0-9a-fA-F]{6}$/i.test(String(c)))
    .map(c => String(c).toLowerCase()))];
  const assign = (keys, list) => {
    if (!list.length) return;
    list.forEach((c, i) => {
      const k = keys[list.length === 1
        ? Math.floor(keys.length / 2)
        : Math.round(i * (keys.length - 1) / (list.length - 1))];
      out[k] = c;
    });
  };
  assign(CHROMA_TARGETS, uniq.filter(isChromatic).sort((a, b) => relLum(a) - relLum(b)));
  assign(NEUTRAL_TARGETS, uniq.filter(c => !isChromatic(c)).sort((a, b) => relLum(a) - relLum(b)));
  return out;
}

// 组件配色手法（混色下拉）：solid 纯色 / band 垂直渐变 / aurora 三段斜向渐变 /
// multichip 多彩轮换（primary/accent/warning 按 index 循环）。swap 交换主深色（按钮类）
function mixPaintPlan(mix, tok, index, swap) {
  const p1 = swap ? tok.primaryDark : tok.primary;
  const p2 = swap ? tok.primary : tok.primaryDark;
  if (mix === 'band') return { type: 'gradient', vertical: true, stops: [p1, p2] };
  if (mix === 'aurora') return { type: 'gradient', vertical: false, stops: [tok.accent, p1, p2] };
  if (mix === 'multichip') {
    const colors = [p1, tok.accent, tok.warning];
    return { type: 'solid', color: colors[index % colors.length] };
  }
  return { type: 'solid', color: p1 };
}

function relLum(hex) {
  const ch = hexToRgb(hex).map(v => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
function wcagContrast(a, b) {
  const l1 = relLum(a), l2 = relLum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}
// WCAG 对比度达标线：大字（≥24px，或 ≥18.66px 且加粗）3.0，普通文本 4.5
function contrastMinRatio(fontSize, bold) {
  return (fontSize >= 24 || (bold && fontSize >= 18.66)) ? 3.0 : 4.5;
}
function elemOpacityAt(el, attr) {
  let o = 1;
  const own = OPACITY_ATTR[attr];
  if (own) { const v = parseFloat(el.getAttribute(own)); if (!isNaN(v)) o *= v; }
  const g = parseFloat(el.getAttribute('opacity'));
  if (!isNaN(g)) o *= g;
  return o;
}
function isTextEl(el) {
  return TEXT_TAGS.includes((el.tagName || '').toLowerCase());
}
// entries: [{el, attr, val(hex)}]；返回 [{el, attr, before, after}]
function planThemeChanges(entries, targetTokens) {
  const out = [];
  const usable = entries.filter(e => elemOpacityAt(e.el, e.attr) >= MIN_OPACITY);
  const byLum = keys => keys.map(k => ({ k, v: String(targetTokens[k]).toLowerCase() }))
    .sort((a, b) => relLum(a.v) - relLum(b.v));
  runChannel(usable.filter(e => isChromatic(e.val)), byLum(['primary', 'primaryDark', 'accent']));
  runChannel(usable.filter(e => !isChromatic(e.val)), byLum(['bg', 'surface', 'muted', 'body', 'title']));
  return out;

  function clusterList(list) {
    const sorted = [...list].sort((a, b) => relLum(a.val) - relLum(b.val));
    const clusters = [];
    for (const e of sorted) {
      const c = clusters[clusters.length - 1];
      if (c && Math.abs(relLum(e.val) - relLum(c.rep)) < CLUSTER_DL && colorDist(e.val, c.rep) < CLUSTER_DIST) {
        c.items.push(e);
      } else clusters.push({ rep: e.val, isText: isTextEl(e.el), items: [e] });
    }
    return clusters;
  }
  function runChannel(list, targets) {
    if (!list.length || !targets.length) return;
    const clusters = clusterList(list);
    // 非文字簇：全 ramp 明度分位（保留原图层次）
    const deco = clusters.filter(c => !c.isText);
    deco.forEach((c, i) => {
      const idx = deco.length === 1 ? Math.floor(targets.length / 2)
        : Math.round(i * (targets.length - 1) / (deco.length - 1));
      c.target = targets[idx];
    });
    // 文字簇：按原色极性锁定两端，永不落中间档
    for (const pole of ['light', 'dark']) {
      const gs = clusters.filter(c => c.isText && (relLum(c.rep) > 0.5 ? 'light' : 'dark') === pole);
      if (!gs.length) continue;
      const cands = targets.filter(t => pole === 'light' ? relLum(t.v) >= LIGHT_FLOOR : relLum(t.v) <= DARK_CEIL);
      gs.forEach((c, k) => {
        if (!cands.length) { // 该极性无安全档：退到全 ramp 对应端点
          c.target = pole === 'light' ? targets[targets.length - 1] : targets[0];
          return;
        }
        c.target = gs.length === 1
          ? cands[pole === 'light' ? cands.length - 1 : 0]
          : cands[Math.min(cands.length - 1, Math.round(k * (cands.length - 1) / (gs.length - 1)))];
      });
    }
    for (const c of clusters) for (const e of c.items)
      if (e.val !== c.target.v) out.push({ el: e.el, attr: e.attr, before: e.val, after: c.target.v });
  }
}

// path/g 缩放：绕手柄对侧锚点的 scale 变换合成
// 坐标约定：rbox = mover.getBBox()（mover 本地坐标，已含内层既有 transform），
// box = elBox(mover)（= rbox + 拖动偏移 tx/ty），nb = 新框（画布坐标）。
// 生成 'translate(...) scale(...)' 前缀复合到内层元素既有 transform 之前；
// mover.getBBox() 恒反映复合后的渲染框，elBox/吸附/框选因此自动正确。

function composeScaleTransform(mode, box, rbox, nb, prev) {
  const sx = (mode.includes('e') || mode.includes('w')) ? nb.w / box.w : 1;
  const sy = (mode.includes('n') || mode.includes('s')) ? nb.h / box.h : 1;
  const ax = mode.includes('w') ? rbox.x + rbox.width : mode.includes('e') ? rbox.x : rbox.x + rbox.width / 2;
  const ay = mode.includes('n') ? rbox.y + rbox.height : mode.includes('s') ? rbox.y : rbox.y + rbox.height / 2;
  const fmt = n => Math.round(n * 10000) / 10000;
  const m = 'translate(' + Math.round(ax * (1 - sx) * 10) / 10 + ' ' + Math.round(ay * (1 - sy) * 10) / 10 + ') scale(' + fmt(sx) + ' ' + fmt(sy) + ')';
  return prev ? m + ' ' + prev : m;
}
// 把 transform 串应用到一点（支持 translate/scale 子集，足够覆盖本模块输出）
// transform 列表从右往左作用（最右最内层），故按匹配的逆序应用
function applyTransformPoint(str, x, y) {
  let px = x, py = y;
  const re = /(translate|scale)\(\s*(-?[\d.]+)[,\s]+(-?[\d.]+)\s*\)/g;
  const ops = [];
  let m;
  while ((m = re.exec(String(str)))) ops.push([m[1], parseFloat(m[2]), parseFloat(m[3])]);
  for (const [op, a, b] of ops.reverse()) {
    if (op === 'translate') { px += a; py += b; }
    else { px *= a; py *= b; }
  }
  return { x: px, y: py };
}

// 布局模板：把选中元素按画布（canvas）排版，返回与输入同序的目标坐标数组。
// 纯函数——box = elBox(mover) 形状 {x,y,w,h}，canvas = stage.__canvas 形状 {x,y,w,h}。
// 排版语义：
//   left-right   左文右标：按当前 x 排序，前一半左列、其余右列，两列垂直居中
//   centered     居中对称：按阅读序（y 优先）纵向堆叠，水平居中
//   feature-grid 标题+特性格：第一个（最靠上）作标题置顶居中，其余一行均布其下
//   diagonal     斜切动势：按当前对角位置排序，沿画布对角线分布
// 元素尺寸不变，只返回移动目标点（元素左上角目标位置）。

function arrangeLayout(id, boxes, canvas) {
  const c = canvas;
  const idx = boxes.map((_, i) => i);
  const out = idx.map(() => ({ x: 0, y: 0 }));
  if (!boxes.length) return out;
  if (boxes.length === 1) {
    out[0] = { x: c.x + c.w / 2 - boxes[0].w / 2, y: c.y + c.h / 2 - boxes[0].h / 2 };
    return out;
  }
  const byXY = [...idx].sort((a, b) => (boxes[a].y - boxes[b].y) || (boxes[a].x - boxes[b].x));
  const byX = [...idx].sort((a, b) => (boxes[a].x - boxes[b].x) || (boxes[a].y - boxes[b].y));
  const centerIn = (i, cx, cy) => { out[i] = { x: cx - boxes[i].w / 2, y: cy - boxes[i].h / 2 }; };
  const GAP = 16, MARGIN = 16, GAP_MIN = 4;
  // 在 [top,bottom] 区间内垂直堆叠（保持 list 顺序），每列元素水平中心对齐 cx
  const stack = (list, cx, top, bottom) => {
    const totalH = list.reduce((s, i) => s + boxes[i].h, 0);
    const gap = list.length > 1
      ? Math.max(GAP_MIN, Math.min(GAP, (bottom - top - totalH) / (list.length - 1)))
      : 0;
    let y = top + Math.max(0, (bottom - top - totalH - gap * (list.length - 1)) / 2);
    for (const i of list) {
      centerIn(i, cx, y + boxes[i].h / 2);
      y += boxes[i].h + gap;
    }
  };

  if (id === 'left-right') {
    const k = Math.ceil(byX.length / 2);
    stack(byX.slice(0, k), c.x + c.w * 0.25, c.y + MARGIN, c.y + c.h - MARGIN);
    stack(byX.slice(k), c.x + c.w * 0.75, c.y + MARGIN, c.y + c.h - MARGIN);
  } else if (id === 'centered') {
    stack(byXY, c.x + c.w / 2, c.y + MARGIN, c.y + c.h - MARGIN);
  } else if (id === 'feature-grid') {
    const head = byXY[0], rest = byXY.slice(1);
    centerIn(head, c.x + c.w / 2, c.y + MARGIN + boxes[head].h / 2);
    if (rest.length) {
      const rowTop = c.y + MARGIN + boxes[head].h + GAP;
      const rowBottom = c.y + c.h - MARGIN;
      const totalW = rest.reduce((s, i) => s + boxes[i].w, 0);
      const gap = rest.length > 1
        ? Math.max(GAP_MIN, Math.min(GAP, (c.w - 2 * MARGIN - totalW) / (rest.length - 1)))
        : 0;
      const total = totalW + gap * (rest.length - 1);
      let x = c.x + (c.w - total) / 2;
      const cy = (rowTop + rowBottom) / 2;
      for (const i of rest) {
        out[i] = { x, y: cy - boxes[i].h / 2 };
        x += boxes[i].w + gap;
      }
    }
  } else if (id === 'diagonal') {
    const order = [...idx].sort((a, b) =>
      (boxes[a].x + boxes[a].y) - (boxes[b].x + boxes[b].y));
    order.forEach((i, k) => {
      const t = k / (order.length - 1);
      out[i] = {
        x: c.x + MARGIN + t * (c.w - 2 * MARGIN - boxes[i].w),
        y: c.y + MARGIN + t * (c.h - 2 * MARGIN - boxes[i].h),
      };
    });
  } else {
    for (const i of idx) centerIn(i, c.x + c.w / 2, c.y + c.h / 2);
  }
  return out;
}

function unionBox(a, b) {
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  return { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y };
}
function inflateBox(b, n) { return { x: b.x - n, y: b.y - n, w: b.w + 2 * n, h: b.h + 2 * n }; }

const FONT_STACK = '"PingFang SC", "Microsoft YaHei", sans-serif';

function createTextMeasurer(measureFn, { pad = 16 } = {}) {
  return {
    pad,
    width: (text, fontSize, weight = 400) => measureFn(text, fontSize, weight),
    fitWidth(text, { fontSize, weight = 400 }) {
      return this.width(text, fontSize, weight) + pad * 2;
    },
  };
}

function bindCanvasMeasure() {
  if (typeof document === 'undefined') throw new Error('canvas unavailable in node');
  const ctx = document.createElement('canvas').getContext('2d');
  return (text, fontSize, weight = 400) => {
    ctx.font = `${weight} ${fontSize}px ${FONT_STACK}`;
    return ctx.measureText(text).width;
  };
}

function computeSnap({ moving, scene, canvas, opts, signatures }) {
  const o = { threshold: 6, guide: true, spacing: true, semantic: true, ...opts };
  const res = { dx: 0, dy: 0, guides: [], equalities: [], semantic: null };
  if (!o.guide || !moving) return res;
  const targets = [];
  for (const s of scene) {
    if (s.id === moving.id) continue;
    targets.push(s.x, s.x + s.w, s.x + s.w / 2, s.y, s.y + s.h, s.y + s.h / 2);
  }
  targets.push(canvas.x, canvas.x + canvas.w, canvas.x + canvas.w / 2,
               canvas.y, canvas.y + canvas.h, canvas.y + canvas.h / 2);
  let bestX = null, bestY = null;
  // 同类识别：同签名且尺寸 ±15% 的最近兄弟 → 大捕获半径(48px)直接吸到列 x
  const sigOf = (id) => (signatures ? signatures[id] : undefined);
  if (o.semantic && signatures && sigOf(moving.id)) {
    const sibs = scene.filter(s => s.id !== moving.id && sigOf(s.id) === sigOf(moving.id)
      && Math.abs(s.w - moving.w) / moving.w <= 0.15);
    if (sibs.length) {
      const near = sibs.reduce((p, c) => Math.abs(c.x - moving.x) < Math.abs(p.x - moving.x) ? c : p);
      if (Math.abs(near.x - moving.x) <= 48) {
        bestX = { d: near.x - moving.x, t: near.x, rank: -1 };
        res.semantic = { reason: '同类对齐 · 宽 ' + Math.round(moving.w) + ' = 同类' };
      }
    }
  }
  const consider = (t, mv, isX) => {
    const d = t - mv;
    if (Math.abs(d) > o.threshold) return;
    const rank = (mv === (isX ? moving.x + moving.w / 2 : moving.y + moving.h / 2)) ? 0 : 1;
    const cur = isX ? bestX : bestY;
    const better = !cur || rank < cur.rank || (rank === cur.rank && Math.abs(d) < Math.abs(cur.d));
    if (better) { if (isX) bestX = { d, t, rank }; else bestY = { d, t, rank }; }
  };
  for (const t of targets) {
    consider(t, moving.x, true); consider(t, moving.x + moving.w / 2, true); consider(t, moving.x + moving.w, true);
    consider(t, moving.y, false); consider(t, moving.y + moving.h / 2, false); consider(t, moving.y + moving.h, false);
  }
  if (bestX) { res.dx = bestX.d; res.guides.push({ axis: 'v', pos: bestX.t }); }
  if (bestY) { res.dy = bestY.d; res.guides.push({ axis: 'h', pos: bestY.t }); }
  if (res.guides.length > 4) res.guides = res.guides.slice(0, 4);
  return res;
}

function detectEquality({ moving, neighbors }) {
  for (const axis of ['h', 'v']) {
    const pos = axis === 'h' ? (b) => [b.x, b.x + b.w] : (b) => [b.y, b.y + b.h];
    for (const n of neighbors) {
      if (n.id === moving.id) continue;
      const gapL = Math.abs(pos(moving)[0] - pos(n)[1]);
      for (const m2 of neighbors) {
        if (m2.id === n.id || m2.id === moving.id) continue;
        const gapR = Math.abs(pos(m2)[0] - pos(moving)[1]);
        if (gapL > 0 && Math.abs(gapL - gapR) < 0.5 && gapL < 200)
          return { axis, gap: Math.round(gapL * 10) / 10,
            range: [pos(n)[1], pos(m2)[0]].sort((a, b) => a - b) };
      }
    }
  }
  return null;
}

function clusterSimilar(items, sizeTolerance = 0.15) {
  const groups = []; const used = new Set();
  for (const it of items) {
    if (used.has(it.id)) continue;
    const g = [it.id]; used.add(it.id);
    for (const other of items) {
      if (used.has(other.id)) continue;
      if (other.signature !== it.signature) continue;
      if (Math.abs(other.w - it.w) / it.w <= sizeTolerance && Math.abs(other.h - it.h) / it.h <= sizeTolerance) {
        g.push(other.id); used.add(other.id);
      }
    }
    if (g.length > 1) groups.push(g);
  }
  return groups;
}

function sanitizeSvg(svgString) {
  let s = svgString.replace(/<g id="svgo-overlay">[\s\S]*?<\/g>/, '');
  s = s.replace(/<svg\b(?![^>]*\sxmlns=)/, '<svg xmlns="http://www.w3.org/2000/svg"');
  // 剥离编辑器痕迹：data-svgo-*、data-name、mover 包装类
  s = s.replace(/\s(?:data-(?:svgo-[a-z-]+|name)|class)="(?:[^"]*)?svgo-mover(?:[^"]*)"/g, '');
  s = s.replace(/\sdata-(?:svgo-[a-z-]+|name)="[^"]*"/g, '');
  s = s.replace(/(\s[a-zA-Z-]+)="(-?\d+\.\d{2,})"/g,
    (_, attr, num) => ` ${attr}="${String(Math.round(parseFloat(num) * 10) / 10)}"`);
  return s;
}

// ============================ 状态 ============================
const S = {

  fileName: null,
  selection: new Set(),
  history: [], future: [],
  zoom: 1,
  drag: null,
  snap: { guide:true, spacing:true, semantic:true, threshold:6 },

const $ = (id) => document.getElementById(id);

// ============================ 几何辅助 ============================

    while (p && p !== el) {

      p = p.parentElement;

}
function graphicEls() {

}
function topLevelEls() { return [...contentG.children]; }
function elBox(el) {

  let bb;
  try { bb = el.getBBox(); } catch (e) { return { id: el.__uid, x: 0, y: 0, w: 0, h: 0 }; }
  const t = el.__tx || 0, u = el.__ty || 0;

// ============================ 载入 / 渲染 / 导出 ============================
function loadSvgText(text, fileName) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const root = doc.documentElement;
  if (!root || root.nodeName === 'parsererror' || root.getElementsByTagName('parsererror').length)
    return toast('解析失败：不是有效的 SVG 文件');
  if (root.getElementsByTagName('image').length)
    toast('提示：文件包含位图 image，将按原样保留');
  S.sourceRoot = root; S.fileName = fileName;
  S.selection.clear(); S.history = []; S.future = [];
  $('svgo-welcome').style.display = 'none';
  try { renderAll(); }
  catch (err) { console.error(err); toast('渲染出现问题：' + err.message); }
  updateHistoryButtons();
  $('svgo-filename').textContent = fileName;
  $('svgo-save').disabled = false;
  if (window.__editorEnableFileButtons) window.__editorEnableFileButtons();
  if (localStorage.getItem('svgEditorDraft:' + fileName))
    toast('检测到「' + fileName + '」的自动保存草稿，点工具栏 ⟲草稿 可恢复', 4200);
  setStatus('已打开，试试拖动元素');
}
function renderAll() {
  contentG.textContent = '';
  overlayG.textContent = '';
  S.contrastMarks = new Set(); S.contrastInfo = new Map(); // 新文件不保留体检标记
  if (!S.sourceRoot) return;
  for (const child of [...S.sourceRoot.children])
    contentG.appendChild(wrapAsMover(document.importNode(child, true)));
  const vb = (S.sourceRoot.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  let x = 0, y = 0, w = 800, h = 400;
  if (vb.length === 4 && vb.every(Number.isFinite)) [x, y, w, h] = vb;
  else {
    w = parseFloat(S.sourceRoot.getAttribute('width')) || 800;
    h = parseFloat(S.sourceRoot.getAttribute('height')) || 400;
  }
  stage.setAttribute('viewBox', x + ' ' + y + ' ' + w + ' ' + h);
  stage.__canvas = { x, y, w, h };
  prepareLoaded(); fitToView(); renderLayers(); drawOverlay(); syncPropertyPanel();
}
function fitToView() {
  const c = stage.__canvas; if (!c) return;
  const rect = stage.getBoundingClientRect();
  S.zoom = Math.min(rect.width / c.w, rect.height / c.h) || 1;
  setStatus();
}
function serializeCurrent() {
  if (!S.sourceRoot) return '';
  const attrs = [...S.sourceRoot.attributes].map(a => a.name + '="' + a.value + '"').join(' ');
  const parts = [];
  for (const el of topLevelEls()) {
    if (el.getAttribute('class') === 'svgo-mover') {
      for (const c of [...el.childNodes])
        parts.push(new XMLSerializer().serializeToString(c));
    } else {
      parts.push(new XMLSerializer().serializeToString(el));
    }
  }
  return sanitizeSvg('<svg ' + attrs + '>\n' + parts.join('\n') + '\n</svg>');
}
async function saveFile() {
  if (!S.sourceRoot) return;
  const text = serializeCurrent();
  if (S.fileHandle) {
    try {
      const ws = await S.fileHandle.createWritable();
      await ws.write(text); await ws.close();
      toast('已保存回原文件：' + S.fileName); return;
    } catch (e) { toast('直接写回失败，改为下载（' + e.message + '）'); }
  }
  downloadText(text, S.fileName || 'drawing.svg');
}
function downloadText(text, name) {
  const blob = new Blob([text], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function openPicker() {
  if ('showOpenFilePicker' in window) {
    try {
      const [handle] = await window.showOpenFilePicker({ types: [{ description: 'SVG', accept: { 'image/svg+xml': ['.svg'] } }] });
      const file = await handle.getFile();
      S.fileHandle = handle;
      loadSvgText(await file.text(), file.name); return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  $('svgo-file-input').value = ''; $('svgo-file-input').click();
}
$('svgo-file-input').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  S.fileHandle = null;
  loadSvgText(await f.text(), f.name);
});

// ============================ 拖拽导入（全窗口捕获，防浏览器默认打开） ============================
let dragDepth = 0;
const dropzone = $('svgo-dropzone');
window.addEventListener('dragenter', e => {
  if (![...(e.dataTransfer.types || [])].includes('Files')) return;
  e.preventDefault();
  dragDepth++;
  dropzone.style.display = 'flex';
}, true);
window.addEventListener('dragover', e => { e.preventDefault(); }, true);
window.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) dropzone.style.display = 'none';
}, true);
window.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0; dropzone.style.display = 'none';
  const f = [...(e.dataTransfer.files || [])].find(f => /\.svg$/i.test(f.name));
  if (!f) return toast('请拖入 .svg 文件');
  S.fileHandle = null;
  loadSvgText(await f.text(), f.name);
}, true);

// ============================ 撤销 / 重做 ============================
function pushCommand(cmd) {
  S.history.push(cmd);
  if (S.history.length > 100) S.history.shift();
  S.future = [];
  updateHistoryButtons();
  try { localStorage.setItem('svgEditorDraft:' + (S.fileName || ''), serializeCurrent()); } catch (e) {}
}
function makeAttrCommand(label, changes) {
  const sync = (el, attr) => {
    if (attr === 'transform' && el.classList && el.classList.contains('svgo-mover')) {
      const m = /translate\(\s*(-?[\d.]+)[ ,]+(-?[\d.]+)\s*\)/.exec(el.getAttribute('transform') || '');
      el.__tx = m ? parseFloat(m[1]) : 0;
      el.__ty = m ? parseFloat(m[2]) : 0;
    }
  };
  return {
    label,
    undo() { for (const c of changes) { c.before === null ? c.el.removeAttribute(c.attr) : c.el.setAttribute(c.attr, c.before); sync(c.el, c.attr); } },
    redo() { for (const c of changes) { c.el.setAttribute(c.attr, c.after); sync(c.el, c.attr); } },
  };
}
function makeNodeCommand(label, removed) {
  // removed: [{parent, el, next}] —— 删除类命令
  return {
    label,
    undo() { for (const r of removed) r.parent.insertBefore(r.el, r.next); },
    redo() { for (const r of removed) r.el.remove(); },

function doUndo() {
  const cmd = S.history.pop(); if (!cmd) return;
  cmd.undo(); S.future.push(cmd);

  updateHistoryButtons(); renderLayers(); drawOverlay(); syncPropertyPanel();
}
function doRedo() {
  const cmd = S.future.pop(); if (!cmd) return;
  cmd.redo(); S.history.push(cmd);
  S.selection = new Set([...S.selection].filter(el => el.isConnected));
  updateHistoryButtons(); renderLayers(); drawOverlay(); syncPropertyPanel();

  for (const g of (ex.guides || [])) {
    const line = g.axis === 'v'
      ? ovEl('line', { x1:g.pos, y1:c.y - 40, x2:g.pos, y2:c.y + c.h + 40 })
      : ovEl('line', { x1:c.x - 40, y1:g.pos, x2:c.x + c.w + 40, y2:g.pos });
    line.setAttribute('stroke', '#e5484d');
    line.setAttribute('stroke-width', 1.2 / S.zoom);
    overlayG.appendChild(line);
  }
  for (const eq of (ex.equalities || [])) {
    if (!eq || !eq.range || eq.range.length < 2) continue;
    const mid = (eq.range[0] + eq.range[1]) / 2;
    const label = String(eq.gap);
    const bw = label.length * 7 + 14, bh = 15;
    const badgeY = eq.badgeY !== undefined ? eq.badgeY : ex.eqBadgeY || c.y + c.h - 10;
    overlayG.appendChild(ovEl('rect', { x:mid - bw/2, y:badgeY - bh/2, width:bw, height:bh, rx:bh/2, fill:'#e5484d' }));
    const txt = ovEl('text', { x:mid, y:badgeY + 3.5, 'text-anchor':'middle', 'font-size':11,
      fill:'#fff', 'font-family':'PingFang SC, Microsoft YaHei, sans-serif' });
    txt.textContent = label;
    overlayG.appendChild(txt);
  }
  for (const b of selectionBoxes()) {
    const r = ovEl('rect', { x:b.x, y:b.y, width:b.w, height:b.h, fill:'none', stroke:'#4f7cff' });
    r.setAttribute('stroke-dasharray', (6 / S.zoom) + ' ' + (4 / S.zoom));
    r.setAttribute('stroke-width', 1.4 / S.zoom);
    overlayG.appendChild(r);
  }
  if (ex.semantic && ex.semanticBox) {
    const ub = ex.semanticBox;
    const bw = ex.semantic.reason.length * 11.5 + 22, bh = 19;
    overlayG.appendChild(ovEl('rect', { x:ub.x, y:ub.y - bh - 6 / S.zoom, width:bw, height:bh, rx:bh/2, fill:'#fce8e8', stroke:'#e5484d' }));
    const txt = ovEl('text', { x:ub.x + 10, y:ub.y - bh/2 - 6 / S.zoom + 4, 'font-size':11.5, fill:'#c2373b',
      'font-family':'PingFang SC, Microsoft YaHei, sans-serif' });
    txt.textContent = '✦ ' + ex.semantic.reason;
    overlayG.appendChild(txt);
  }
  if (ex.marquee) {
    const m = ovEl('rect', { x:ex.marquee.x, y:ex.marquee.y, width:ex.marquee.w, height:ex.marquee.h, fill:'#4f7cff18', stroke:'#4f7cff' });
    m.setAttribute('stroke-dasharray', '4 3');
    overlayG.appendChild(m);
  }
  // 越界：平时只在状态栏计数；拖动中的选中元素才画红框
  const oobEls = graphicEls().filter(el => {
    if (!visibleUnlocked(el)) return false;
    const b = elBox(el);
    return b.x < c.x - .5 || b.y < c.y - .5 || b.x + b.w > c.x + c.w + .5 || b.y + b.h > c.y + c.h + .5;
  });
  const oobSpan = $('svgo-status-oob');
  if (oobSpan) oobSpan.textContent = oobEls.length ? ('⚠ 越界 ' + oobEls.length + ' 个元素') : '';
  if (S.drag && S.drag.active && S.drag.kind === 'drag') {
    for (const el of oobEls) {
      if (!S.selection.has(el)) continue;
      const b = elBox(el);
      overlayG.appendChild(ovEl('rect', { x:b.x - 1, y:b.y - 1, width:b.w + 2, height:b.h + 2,
        fill:'none', stroke:'#e5484d', 'stroke-width':2 / S.zoom }));
    }
  }
}

// ============================ 指针交互 ============================
function svgPoint(evt) {
  const pt = new DOMPoint(evt.clientX, evt.clientY);
  return pt.matrixTransform(stage.getScreenCTM().inverse());
}

stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !S.sourceRoot) return;
  const p = svgPoint(e);
  const mode = hitHandle(p);
  if (mode) { beginResize(mode, e); return; }
  const hitEl = hitTopLevel(e.target);
  if (hitEl) {
    if (!S.selection.has(hitEl)) e.shiftKey ? toggleSelection(hitEl) : setSelection([hitEl]);
    else if (e.shiftKey) { toggleSelection(hitEl); return; }
    beginDrag(e, p);
  } else {
    beginMarquee(e, p);
  }
});

function beginDrag(e, p) {
  let movers = [...S.selection];
  if (!movers.length) return;
  let cloned = null;
  if (e.altKey) {
    const added = [], clones = [];
    for (const src of movers) {
      const el = src.cloneNode(true);
      el.__uid = 'el' + (++UID);
      el.__baseTransform = el.getAttribute('transform') || '';
      el.__tx = 0; el.__ty = 0;
      contentG.appendChild(el);
      clones.push(el); added.push({ parent:contentG, el, next:null });
    }
    setSelection(clones);
    movers = [...S.selection];
    cloned = added;
  }
  S.drag = {
    kind:'drag', start:p, active:false, cloned,
    movers: movers.map(el => ({
      el, before: el.getAttribute('transform'),
      box: elBox(el), tx0: el.__tx || 0, ty0: el.__ty || 0,
    })),
  };
  stage.setPointerCapture(e.pointerId);
}
function beginMarquee(e, p) {
  S.drag = { kind:'marquee', start:p, active:false, additive:e.shiftKey, base:new Set(S.selection) };
  stage.setPointerCapture(e.pointerId);
}

stage.addEventListener('pointermove', e => {
  const d = S.drag;
  if (!d || !d.start) return;
  const p = svgPoint(e);
  const dx = p.x - d.start.x, dy = p.y - d.start.y;
  if (!d.active && Math.hypot(dx, dy) * S.zoom < 3) return;
  d.active = true;

  if (d.kind === 'marquee') {
    drawOverlay({ marquee: normRect(d.start, p) });
    d.marqueeRect = normRect(d.start, p);
    return;
  }

  if (d.kind === 'resize') {
    applyResize(d, p.x - d.start.x, p.y - d.start.y, e.shiftKey);
    drawOverlay(); syncPropertyPanel();
    return;
  }

  // ---- 拖动 + 全套吸附 ----
  const selIds = new Set(d.movers.map(m => m.el.__uid));
  const sceneEls = graphicEls().filter(el => !selIds.has(el.__uid) && visibleUnlocked(el));
  const scene = sceneEls.map(elBox);
  const merged = mergeBoxes(d.movers.map(m => m.box));
  const signatures = {};
  for (const el of topLevelEls()) signatures[el.__uid] = signatureOf(el);

  const snap = computeSnap({
    moving: { ...merged },
    scene, canvas: stage.__canvas,
    opts: { threshold: S.snap.threshold,
      guide: S.snap.guide && !e.ctrlKey,
      spacing: S.snap.spacing && !e.ctrlKey,
      semantic: S.snap.semantic && !e.ctrlKey },
    signatures,
  });

  let adx = dx + snap.dx, ady = dy + snap.dy;
  for (const m of d.movers) { m.el.__tx = m.tx0 + adx; m.el.__ty = m.ty0 + ady; applyOffset(m.el); }

  // 等距检测（基于吸附后的合并盒）
  let equality = null;
  if (S.snap.spacing && !e.ctrlKey) {
    const movedMerged = mergeBoxes(d.movers.map(m => elBox(m.el)));
    equality = detectEquality({ moving: movedMerged, neighbors: scene });
    if (equality) equality.badgeY = movedMerged.y + movedMerged.h / 2;
  }

  drawOverlay({ guides: snap.guides, equalities: equality ? [equality] : [], semantic: snap.semantic, semanticBox: mergeBoxes(d.movers.map(m => elBox(m.el))) });

  const bits = [];
  if (snap.guides.length) bits.push('已吸附：参考线 ×' + snap.guides.length);
  if (equality) bits.push('等距 ' + equality.gap + ' ✓');
  if (snap.semantic) bits.push(snap.semantic.reason);
  if (e.ctrlKey) bits.push('已临时关闭吸附');
  setStatus(bits.length ? bits.join(' · ') : '自由拖动中…');
});

stage.addEventListener('pointerup', e => {
  const d = S.drag; S.drag = null;
  if (!d) { drawOverlay(); return; }
  // 手动双击检测：未拖动的快速两击同一元素 → 编辑其中的文字（不依赖浏览器 dblclick 合成）
  if (!d.active && d.kind === 'drag') {
    const now = Date.now();
    const el = [...S.selection][0];
    if (el) {
      const cur = { t: now, x: e.clientX, y: e.clientY, uid: el.__uid };
      const L = S._lastClick;
      S._lastClick = cur;
      if (L && L.uid === cur.uid && now - L.t < 400 &&
          Math.hypot(cur.x - L.x, cur.y - L.y) < 5) {
        S._lastClick = null;
        const tEl = el.tagName === 'text' ? el : el.querySelector('text');
        if (tEl) { startTextEdit(tEl); return; }
      }
    }
  }
  if (d.kind === 'resize') {
    if (d.active) commitResize(d);
    drawOverlay(); syncPropertyPanel();
    return;
  }
  if (d.kind === 'marquee') {
    if (d.marqueeRect) {
      const hits = graphicEls().filter(el => {
        if (!visibleUnlocked(el)) return false;
        const b = elBox(el), r = d.marqueeRect;
        return b.x < r.x + r.w && b.x + b.w > r.x && b.y < r.y + r.h && b.y + b.h > r.y;
      });
      setSelection(d.additive ? [...new Set([...d.base, ...hits])] : hits);
    } else if (!d.additive) setSelection([]);
    drawOverlay();
    return;
  }
  if (!d.active) { drawOverlay(); return; }
  const changes = d.movers.filter(m => m.before !== m.el.getAttribute('transform'))
    .map(m => ({ el:m.el, attr:'transform', before:m.before, after:m.el.getAttribute('transform') }));
  if (d.cloned) {
    pushCommand(makeComposite('复制并移动', [makeAddCommand('复制', d.cloned), makeAttrCommand('移动', changes)]));
  } else if (changes.length) {
    pushCommand(makeAttrCommand('移动', changes));
  }
  drawOverlay(); renderLayers();
});
stage.addEventListener('pointercancel', () => { S.drag = null; drawOverlay(); });
// ============================ 键盘 ============================
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  const mod = e.ctrlKey || e.metaKey;

  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); return; }
  if (mod && e.key.toLowerCase() === 'c') { if (S.selection.size) copySelection(); return; }
  if (mod && e.key.toLowerCase() === 'v') { pasteClipboard(); return; }
  if (e.key.toLowerCase() === 'f' && S.selection.size) { e.preventDefault(); focusSelection(); return; }
  if (mod && e.key === '0') { e.preventDefault(); resetView(); return; }
  if (!S.sourceRoot) return;

  if (mod && e.key.toLowerCase() === 'a') {
    e.preventDefault();
    setSelection(graphicEls().filter(visibleUnlocked)); return;
  }
  if (e.key === 'Escape') {
    if (S.contrastMarks && S.contrastMarks.size) { S.contrastMarks.clear(); drawOverlay(); }
    setSelection([]); return;
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.selection.size) {
    e.preventDefault();
    const removed = [...S.selection].map(el => ({ parent:contentG, el, next:el.nextSibling }));
    for (const r of removed) r.el.remove();
    S.selection.clear();
    pushCommand(makeNodeCommand('删除', removed));
    syncPropertyPanel(); renderLayers(); drawOverlay();
    return;
  }
  if (e.key.startsWith('Arrow') && S.selection.size) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    for (const el of S.selection) {
      const before = el.getAttribute('transform');
      el.__tx = (el.__tx || 0) + dx; el.__ty = (el.__ty || 0) + dy;
      applyOffset(el);
      nudgeChanges.push({ el, attr:'transform', before, after: el.getAttribute('transform') });
    }
    drawOverlay(); syncPropertyPanel();
    clearTimeout(nudgeTimer);
    nudgeTimer = setTimeout(() => {
      if (!nudgeChanges.length) return;
      pushCommand(makeAttrCommand('微调', nudgeChanges));
      nudgeChanges = [];
    }, 450);
  }
});

let nudgeTimer = null, nudgeChanges = [];

// ============================ 属性面板 ============================
function syncPropertyPanel() {
  const single = S.selection.size === 1 ? [...S.selection][0] : null;
  for (const id of ['svgo-px','svgo-py','svgo-pw','svgo-ph','svgo-fill']) $(id).disabled = !single;
  if (!single) { $('svgo-selinfo').textContent = S.selection.size > 1 ? '已选中 ' + S.selection.size + ' 个元素' : '无选中'; return; }
  const b = elBox(single);
  $('svgo-px').value = round1(b.x); $('svgo-py').value = round1(b.y);
  $('svgo-pw').value = round1(b.w); $('svgo-ph').value = round1(b.h);
  $('svgo-selinfo').textContent = single.getAttribute('data-name') || signatureOf(single);
  const fill = single.getAttribute('fill');
  $('svgo-fill').value = /^#[0-9a-fA-F]{6}$/.test(fill || '') ? fill : '#cccccc';
}
$('svgo-fill').addEventListener('input', e => {
  const el = [...S.selection][0]; if (!el) return;
  el.setAttribute('fill', e.target.value); drawOverlay();
});

// ============================ 图层面板 ============================
function layerName(el) {
  if (el.getAttribute('data-name')) return el.getAttribute('data-name');
  const txt = el.textContent ? el.textContent.trim().slice(0, 14) : '';
  return txt ? '<' + el.tagName + '> ' + txt : '<' + el.tagName + '>';
}
function renderLayers() {
  const box = $('svgo-layers');
  box.textContent = '';
  const els = graphicEls();
  if (!els.length) { box.innerHTML = '<span style="color:var(--sub)">（空）</span>'; return; }
  for (const el of [...els].reverse()) {
    const row = document.createElement('div');
    row.className = 'layer' + (S.selection.has(el) ? ' sel' : '')
      + (el.getAttribute('data-svgo-locked') === '1' ? ' locked' : '')
      + (el.getAttribute('data-svgo-hidden') === '1' ? ' hidden' : '');
    row.innerHTML =
      '<span class="eye" title="显示/隐藏">' + (el.getAttribute('data-svgo-hidden') === '1' ? '🚫' : '👁') + '</span>' +
      '<span class="lock" title="锁定/解锁">' + (el.getAttribute('data-svgo-locked') === '1' ? '🔒' : '🔓') + '</span>' +
      '<span class="nm">' + layerName(el).replace(/</g, '&lt;') + '</span>';
    row.querySelector('.eye').addEventListener('click', ev => {
      ev.stopPropagation();
      const hidden = el.getAttribute('data-svgo-hidden') === '1';
      hidden ? el.removeAttribute('data-svgo-hidden') : el.setAttribute('data-svgo-hidden', '1');
      el.style.display = hidden ? '' : 'none';
      if (!hidden) S.selection.delete(el);
      renderLayers(); drawOverlay(); syncPropertyPanel();
    });
    row.querySelector('.lock').addEventListener('click', ev => {
      ev.stopPropagation();
      const locked = el.getAttribute('data-svgo-locked') === '1';
      locked ? el.removeAttribute('data-svgo-locked') : el.setAttribute('data-svgo-locked', '1');
      renderLayers();
    });
    row.addEventListener('click', () => setSelection([el]));
    box.appendChild(row);
  }
}

// ============================ 工具栏 / 吸附控制台绑定 ============================
function bindChrome() {
  $('svgo-open').addEventListener('click', openPicker);
  $('svgo-save').addEventListener('click', saveFile);
  $('svgo-undo').addEventListener('click', doUndo);
  $('svgo-redo').addEventListener('click', doRedo);
  const sel = $('svgo-theme-sel');
  sel.textContent = '';
  for (const t of THEMES) {

    sel.appendChild(opt);
  }
  const applyBtn = document.createElement('button');
  applyBtn.className = 'tbtn'; applyBtn.id = 'svgo-theme-apply';
  applyBtn.textContent = '应用主题'; applyBtn.style.display = 'none';
  applyBtn.addEventListener('click', confirmTheme);
  sel.after(applyBtn);
  const savedTheme = localStorage.getItem('svgEditorTheme');
  if (savedTheme && THEMES.some(t => t.id === savedTheme)) sel.value = savedTheme;
  sel.addEventListener('change', () => {
    localStorage.setItem('svgEditorTheme', sel.value);
    if (S.sourceRoot) previewTheme(sel.value);
  });
  for (const key of ['guide','spacing','semantic']) {
    $('svgo-sn-' + key).addEventListener('change', e => { S.snap[key] = e.target.checked; });
  }
  const th = $('svgo-sn-threshold');
  th.addEventListener('input', () => { S.snap.threshold = +th.value; $('svgo-sn-thval').textContent = th.value + 'px'; });
  window.addEventListener('resize', () => fitToView());

  // 工具栏扩展按钮：PNG / 复制代码 / 草稿
  const top = $('svgo-top'), saveBtn = $('svgo-save');
  function addTool(label, title, fn) {
    const b = document.createElement('button');
    b.className = 'tbtn'; b.textContent = label; b.title = title; b.disabled = true;
    b.addEventListener('click', fn);
    top.insertBefore(b, saveBtn);
    return b;
  }
  const pngBtn = addTool('🖼 PNG', '导出 PNG（点击=2x，Alt=4x，Shift=按内容裁剪空白）', e => exportPNG(e.altKey ? 4 : 2, e.shiftKey));
  const copyBtn = addTool('⧉ 复制代码', '复制干净 SVG 源码', copyCode);
  const draftBtn = addTool('⟲ 草稿', '恢复上次自动保存的草稿', restoreDraft);
  const checkBtn = addTool('◐ 体检', '对比度体检：检查文本与背景的 WCAG 对比度是否达标', checkContrast);
  window.__editorEnableFileButtons = () => {
    pngBtn.disabled = copyBtn.disabled = draftBtn.disabled = checkBtn.disabled = false;
  };
  // 右栏：布局 / 混色（v1 说明见 README）

    for (const it of items) {
      const o = document.createElement('option'); o.value = it.id; o.textContent = it.name; s.appendChild(o);
    }
    s.title = tip;
    if (!(opts && opts.silent)) s.addEventListener('change', () => toast(tip));
    wrap.appendChild(lab); wrap.appendChild(s); right.appendChild(wrap);
    return s;
  };
  const layoutSel = mkSel('布局', LAYOUTS, '排列选中的元素（按画布排版，可撤销）；未选中时无效果', { silent: true });
  layoutSel.addEventListener('change', () => applyLayoutToSelection(layoutSel.value));
  const mixSel = mkSel('混色', MIXES, '新插入组件的配色手法：纯色 / 渐变带 / 极光渐变 / 多彩轮换');
  mixSel.addEventListener('change', () => { S.mixId = mixSel.value; });

  capBtn.addEventListener('click', capturePaletteFromSelection);

  folBtn.className = 'tbtn'; folBtn.textContent = '↺ 跟随主题';
  folBtn.title = '组件配色恢复为跟随主题下拉';
  folBtn.addEventListener('click', () => {
    localStorage.setItem('svgEditorPalette', JSON.stringify({ followTheme: true }));
    toast('组件配色已恢复跟随主题');
  });
  palRow.appendChild(capBtn); palRow.appendChild(folBtn);
  right.appendChild(palRow);
}

// 组件默认配色：followTheme=false 时用收藏的自定义色板，否则跟随主题下拉
function paletteStore() {
  try { return JSON.parse(localStorage.getItem('svgEditorPalette') || '{"followTheme":true}'); }
  catch (e) { return { followTheme: true }; }
}
function componentTokens() {
  const st = paletteStore();
  if (!st.followTheme && st.palette) return st.palette;
  return themeTokensOf($('svgo-theme-sel').value);
}
function capturePaletteFromSelection() {
  if (!S.selection.size) { toast('先选中元素，再收藏配色'); return; }
  const colors = [];
  for (const root of [...S.selection].filter(visibleUnlocked)) {
    const inner = innerOf(root) || root;
    const w = document.createTreeWalker(inner, NodeFilter.SHOW_ELEMENT);
    let n = w.currentNode;
    while (n) {
      if (n.nodeType === 1) for (const a of ['fill', 'stroke']) {
        const v = n.getAttribute(a);

// ============================ 对比度体检 ============================
// 文本填充 vs 其下方最上层纯色背景的 WCAG 对比度；阈值规则在 color-map.mjs
function findSolidFill(el) {
  const inner = innerOf(el) || el;
  const w = document.createTreeWalker(inner, NodeFilter.SHOW_ELEMENT);
  let n = w.currentNode, found = null;
  while (n) {
    if (n.nodeType === 1) {
      const v = n.getAttribute('fill');
      if (v && /^#[0-9a-fA-F]{6}$/i.test(v)) found = v.toLowerCase(); // 最深层 = 最上层绘制
    }
    n = w.nextNode();
  }

}
// 文本下方最上层纯色背景（文档序靠后 = 绘制更上层）；无纯色背景返回 null
function topmostSolidBg(t, scene) {
  const mb = elBox(t.closest('.svgo-mover') || t);
  if (!mb.w) return null;
  const cx = mb.x + mb.w / 2, cy = mb.y + mb.h / 2;
  let bg = null;
  for (const { el, b } of scene) {
    if (el.contains(t)) continue;
    if (cx < b.x || cx > b.x + b.w || cy < b.y || cy > b.y + b.h) continue;
    const f = findSolidFill(el);
    if (f) bg = f;
  }
  return bg;
}
function checkContrast() {
  const texts = [];
  for (const root of topLevelEls()) {
    if (!visibleUnlocked(root)) continue;
    const inner = innerOf(root) || root;
    const w = document.createTreeWalker(inner, NodeFilter.SHOW_ELEMENT);
    let n = w.currentNode;
    while (n) {
      if (n.nodeType === 1 && (n.tagName === 'text' || n.tagName === 'tspan')
        && (n.getAttribute('data-svgo-hidden') !== '1')) texts.push(n);
      n = w.nextNode();
    }
  }
  if (!texts.length) { toast('没有找到文本元素'); return; }
  const scene = graphicEls().filter(visibleUnlocked).map(el => ({ el, b: elBox(el) }));
  S.contrastMarks = new Set(); S.contrastInfo = new Map();
  let checked = 0; const bad = [];
  for (const t of texts) {
    const fill = (t.getAttribute('fill') || '').toLowerCase();
    if (!/^#[0-9a-fA-F]{6}$/.test(fill)) continue; // 渐变/继承色暂不判定
    const bg = topmostSolidBg(t, scene);
    if (!bg) continue;
    checked++;
    const fs = parseFloat(t.getAttribute('font-size')) || 16;
    const bold = /bold|[6-9]00/i.test(t.getAttribute('font-weight') || '');
    const min = contrastMinRatio(fs, bold);
    const ratio = wcagContrast(fill, bg);
    if (ratio < min) {
      const rec = { fill, bg, ratio: Math.round(ratio * 10) / 10, min };
      bad.push(rec);
      const mover = t.closest('.svgo-mover');
      if (mover) { S.contrastMarks.add(mover); S.contrastInfo.set(mover, rec); }
    }
  }
  drawOverlay();
  if (!checked) { toast('文本底下没有可判定的纯色背景，跳过体检'); return; }
  if (!bad.length) { toast('◐ 对比度体检通过：' + checked + ' 处文本全部达标'); return; }
  const worst = bad.slice().sort((a, b) => a.ratio - b.ratio)[0];
  toast('◐ 对比度体检：' + bad.length + '/' + checked + ' 处不达标，最差 '
    + worst.fill + ' vs ' + worst.bg + '（' + worst.ratio + ':1，需 ' + worst.min + ':1）', 4600);
}

async function exportPNG(scale, trim) {
  if (!S.sourceRoot) return;
  let text = serializeCurrent();
  const c = stage.__canvas;
  let vx = c.x, vy = c.y, vw = c.w, vh = c.h;
  if (trim) {
    // 按内容包围盒裁剪：去掉画布空白，四周留 8 单位出血
    const boxes = graphicEls().filter(visibleUnlocked).map(elBox).filter(b => b.w && b.h);
    if (boxes.length) {
      const u = mergeBoxes(boxes), m = 8;
      vx = round1(u.x - m); vy = round1(u.y - m);
      vw = round1(u.w + 2 * m); vh = round1(u.h + 2 * m);
      text = text.replace(/viewBox="[^"]*"/, 'viewBox="' + vx + ' ' + vy + ' ' + vw + ' ' + vh + '"');
      text = text.replace(/\swidth="[^"]*"/, ' width="' + vw + '"');
      text = text.replace(/\sheight="[^"]*"/, ' height="' + vh + '"');
    }
  }
  const img = new Image();
  const url = URL.createObjectURL(new Blob([text], { type:'image/svg+xml' }));
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(vw * scale); cv.height = Math.round(vh * scale);
    const ctx2 = cv.getContext('2d');
    ctx2.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(blob => {
      if (!blob) { toast('PNG 编码失败'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (S.fileName || 'drawing').replace(/\.svg$/i, '') + '@' + scale + 'x' + (trim ? '-trim' : '') + '.png';
      a.click();
      toast('已导出 PNG（' + scale + 'x' + (trim ? '，内容裁剪' : '') + '）');
    }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('PNG 导出失败：文件含浏览器无法光栅化的内容'); };
  img.src = url;
}

      h.setAttribute('stroke-width', 1.2 / S.zoom);
      h.setAttribute('pointer-events', 'all');
      h.setAttribute('data-handle-mode', mode);
      overlayG.appendChild(h);
    }
  }
  // 体检标记：红虚线框 + 最差对比度角标（Esc 或重新体检清除）
  if (S.contrastMarks && S.contrastMarks.size && !S.drag) {
    for (const el of S.contrastMarks) {
      const b = elBox(el);
      if (!b.w) continue;
      const r = ovEl('rect', { x:b.x-2, y:b.y-2, width:b.w+4, height:b.h+4,
        fill:'none', stroke:'#e5484d', 'stroke-dasharray': (6/S.zoom) + ' ' + (4/S.zoom) });
      r.setAttribute('stroke-width', 1.5 / S.zoom);
      r.setAttribute('pointer-events', 'none');
      overlayG.appendChild(r);
      const info = S.contrastInfo && S.contrastInfo.get(el);
      if (info) {
        const t = ovEl('text', { x:b.x, y:b.y - 6/S.zoom, 'font-size': 11/S.zoom, fill:'#e5484d',
          'font-family':'PingFang SC, Microsoft YaHei, sans-serif' });
        t.textContent = info.ratio + ':1';
        overlayG.appendChild(t);
      }
    }
  }
};

function hitHandle(p) {
  if (S.selection.size !== 1) return null;
  const b = selectionBoxes()[0];
  const tol = 7 / S.zoom;
  for (const mode of HANDLE_MODES) {
    const [hx, hy] = handlePositions(b)[mode];
    if (Math.abs(p.x - hx) <= tol && Math.abs(p.y - hy) <= tol) return mode;
  }
  return null;
}

// path / g 走 transform 缩放（scaleMode）：写内层 transform 前缀，
// mover.getBBox() 会把内层 transform 计入，elBox/吸附/框选因此始终正确
const RESIZABLE = { rect:1, circle:1, ellipse:1, text:1, image:1, path:1, g:1 };
function geometrySnapshot(el) {
  const out = {};
  for (const a of ['x','y','width','height','r','rx','ry','cx','cy','font-size','transform'])
    out[a] = el.getAttribute(a);
  return out;
}
function beginResize(mode, evt) {
  const mover = [...S.selection][0];
  const inner = innerOf(mover);
  const el = inner || mover;
  const tag = inner ? inner.tagName : mover.tagName;
  if (!RESIZABLE[tag]) { toast('「' + tag + '」暂不支持缩放（支持：rect / circle / ellipse / text / image / path / g）'); return; }
  // path/g 用 transform 缩放，允许自带 transform（直接复合前缀）；几何缩放类型仍要求先归一化
  const scaleMode = tag === 'path' || tag === 'g';
  if (!scaleMode && el.getAttribute('transform')) { toast('该元素自带 transform，暂不支持缩放，请先手动归一化'); return; }
  S.drag = {
    kind:'resize', mode, active:true, scaleMode,
    mover, el, box: elBox(mover), rbox: mover.getBBox(), bb: el.getBBox ? el.getBBox() : null,
    before: geometrySnapshot(el),
    start: svgPoint(evt),
  };
  stage.setPointerCapture(evt.pointerId);
}
function applyResize(d, dxTotal, dyTotal, shiftKey) {
  const { box, mode } = d;
  let nw = box.w, nh = box.h;
  if (mode.includes('e')) nw = box.w + dxTotal;
  if (mode.includes('s')) nh = box.h + dyTotal;
  if (mode.includes('w')) nw = box.w - dxTotal;
  if (mode.includes('n')) nh = box.h - dyTotal;
  nw = Math.max(4, nw); nh = Math.max(4, nh);
  if (shiftKey && mode.length === 2) {
    const s = Math.max(nw / box.w, nh / box.h);
    nw = box.w * s; nh = box.h * s;
  }
  const nb = { x: box.x, y: box.y, w: nw, h: nh };
  if (mode.includes('w')) nb.x = box.x + box.w - nw;
  if (mode.includes('n')) nb.y = box.y + box.h - nh;
  d.newBox = nb;

  const tx = d.mover.__tx || 0, ty = d.mover.__ty || 0;
  const el = d.el;
  if (el.tagName === 'rect' || el.tagName === 'image') {
    el.setAttribute('x', round1(nb.x - tx));
    el.setAttribute('y', round1(nb.y - ty));
    el.setAttribute('width', round1(nb.w));
    el.setAttribute('height', round1(nb.h));
    if (el.tagName === 'rect' && d.before.rx !== null)
      el.setAttribute('rx', round1(Math.min((parseFloat(d.before.rx) || 0) * (nb.h / box.h), nb.h / 2)));
  } else if (el.tagName === 'circle') {
    const r = Math.min(nb.w, nb.h) / 2;
    el.setAttribute('r', round1(r));
    el.setAttribute('cx', round1(nb.x - tx + r));
    el.setAttribute('cy', round1(nb.y - ty + r));
  } else if (el.tagName === 'ellipse') {
    el.setAttribute('rx', round1(nb.w / 2));
    el.setAttribute('ry', round1(nb.h / 2));
    el.setAttribute('cx', round1(nb.x - tx + nb.w / 2));
    el.setAttribute('cy', round1(nb.y - ty + nb.h / 2));
  } else if (el.tagName === 'text') {
    const s = nb.h / box.h;
    const fs = parseFloat(d.before['font-size']) || 16;
    el.setAttribute('font-size', round1(fs * s));
    el.setAttribute('x', round1(nb.x - tx));
    const ascentGap = (parseFloat(d.before.y) || 0) - d.bb.y;
    el.setAttribute('y', round1((nb.y - ty) + ascentGap * s));
  } else if (d.scaleMode) {
    // path/g：绕固定锚点（手柄对侧）的 scale 变换，算法在 resize-transform.mjs；
    // 顶层元素恒被 wrapAsMover 包裹，el 是内层节点，撤销走 transform 属性 diff
    el.setAttribute('transform', composeScaleTransform(d.mode, box, d.rbox, nb, d.before.transform));
  }
}
function commitResize(d) {
  const after = geometrySnapshot(d.el);
  const changes = [];
  for (const k of ['x','y','width','height','r','rx','ry','cx','cy','font-size','transform'])
    if (d.before[k] !== after[k])
      changes.push({ el:d.el, attr:k, before:d.before[k], after:after[k] });
  if (changes.length) pushCommand(makeAttrCommand('缩放', changes));
}
// ============================ 复合命令 ============================
function makeComposite(label, cmds) {
  return {
    label,
    undo() { for (let i = cmds.length - 1; i >= 0; i--) cmds[i].undo(); },
    redo() { for (const c of cmds) c.redo(); },
  };
}
function makeAddCommand(label, added) {
  return {
    label,
    undo() { for (const a of added) a.el.remove(); },
    redo() { for (const a of added) a.parent.insertBefore(a.el, a.next); },
  };
}

// ============================ 双击改字 + 自动撑框（任务 15） ============================
stage.addEventListener('dblclick', e => {
  if (!S.sourceRoot) return;
  // 穿透透明遮挡：从命中点的所有元素里找第一个可编辑的 <text>
  const pts = document.elementsFromPoint(e.clientX, e.clientY);
  let tEl = null;
  for (const cand of pts) {
    if (!contentG.contains(cand)) continue;
    const t = cand.tagName === 'text' ? cand : (cand.closest ? cand.closest('text') : null);
    if (t && contentG.contains(t)) { tEl = t; break; }
    if (isGraphic(cand)) break; // 先碰到别的图形就停，避免穿透到底层
  }
  if (!tEl) {
    const direct = e.target.closest ? e.target.closest('text') : null;
    if (direct && contentG.contains(direct)) tEl = direct;
  }
  if (!tEl) return;
  startTextEdit(tEl);
});
function findBoxRectOf(textEl) {
  const p = textEl.parentElement;
  if (p && p !== contentG) {
    const r = p.querySelector('rect');
    if (r) return r;
  }
  return null;
}
function startTextEdit(textEl) {
  const inp = $('svgo-textedit');
  const oldText = textEl.textContent;
  const fs = parseFloat(textEl.getAttribute('font-size')) || 16;
  const tr = textEl.getBoundingClientRect(), cr = $('svgo-center').getBoundingClientRect();
  inp.style.display = 'block';
  inp.style.left = (tr.left - cr.left - 4) + 'px';
  inp.style.top = (tr.top - cr.top - 2) + 'px';
  inp.style.width = Math.max(80, tr.width * S.zoom + 24) + 'px';
  inp.style.fontSize = Math.max(11, fs * S.zoom) + 'px';
  inp.value = oldText;
  inp.focus(); inp.select();

  function commit() {
    inp.style.display = 'none';
    const newText = inp.value;
    if (newText === oldText) return;
    const useFs = applyFontLadder(fs);
    const cmds = [];
    if (useFs !== fs)
      cmds.push({
        undo() { textEl.setAttribute('font-size', String(fs)); },
        redo() { textEl.setAttribute('font-size', String(useFs)); },
      });
    cmds.push({
      undo() { textEl.textContent = oldText; },
      redo() { textEl.textContent = newText; },
    });
    const boxRect = findBoxRectOf(textEl);
    if (boxRect) {
      const oldW = parseFloat(boxRect.getAttribute('width'));
      const oldTextW = MEASURER.width(oldText, fs);
      const pad = Math.min(24, Math.max(8, (oldW - oldTextW) / 2));
      const newW = round1(MEASURER.fitWidth(newText, { fontSize: useFs }) - 32 + pad * 2);
      const oldX = parseFloat(boxRect.getAttribute('x'));
      const anchor = textEl.getAttribute('text-anchor');
      const newX = round1(anchor === 'middle' ? oldX + oldW / 2 - newW / 2 : oldX);
      const bw = boxRect.getAttribute('width'), bx = boxRect.getAttribute('x');
      cmds.push({
        undo() { boxRect.setAttribute('width', bw); boxRect.setAttribute('x', bx); },
        redo() { boxRect.setAttribute('width', String(newW)); boxRect.setAttribute('x', String(newX)); },
      });
    }
    // 先应用再入栈，保证 redo 幂等
    for (const c of cmds) c.redo();
    pushCommand(makeComposite('改文字', cmds));
    renderLayers(); drawOverlay();
  }
  inp.onkeydown = ev => {
    if (ev.key === 'Enter') commit();
    if (ev.key === 'Escape') { inp.value = oldText; commit._cancel = true; inp.blur(); }
  };
  inp.onblur = () => { if (inp.style.display !== 'none') commit(); };
}

// ============================ 图层增强：重命名 / 上移下移（任务 16） ============================
function reorderLayer(el, dir) {
  const refBefore = el.nextSibling;
  const moved = dir > 0
    ? (refBefore ? (contentG.insertBefore(el, refBefore.nextSibling), true) : false)
    : (el.previousSibling ? (contentG.insertBefore(el, el.previousSibling), true) : false);
  if (!moved) return;
  const refAfter = el.nextSibling;
  pushCommand({
    label: '排序',
    undo() { contentG.insertBefore(el, refBefore); },
    redo() { contentG.insertBefore(el, refAfter); },
  });
  renderLayers();
}
// 在 renderLayers 的行内追加重命名与排序（包装原函数）
const _renderLayersBase = renderLayers;
renderLayers = function() {
  _renderLayersBase();
  const rows = [...$('svgo-layers').children];
  const els = graphicEls().reverse();
  rows.forEach((row, i) => {
    const el = els[i]; if (!el || !row.classList.contains('layer')) return;
    const nm = row.querySelector('.nm');
    nm.addEventListener('dblclick', ev => {
      ev.stopPropagation();
      const name = prompt('图层名称：', el.getAttribute('data-name') || layerName(el));
      if (name === null) return;
      const before = el.getAttribute('data-name');
      el.setAttribute('data-name', name);
      pushCommand(makeAttrCommand('重命名', [{ el, attr:'data-name', before, after:name }]));
      renderLayers();
    });
    const tools = document.createElement('span');
    tools.innerHTML = '<b class="ly" title="上移一层">▲</b><b class="ly" title="下移一层">▼</b>';
    tools.querySelector('.ly').addEventListener('click', ev => { ev.stopPropagation(); reorderLayer(el, +1); });
    tools.querySelectorAll('.ly')[1].addEventListener('click', ev => { ev.stopPropagation(); reorderLayer(el, -1); });
    row.appendChild(tools);
  });
};

// ============================ 右键菜单（任务 16） ============================
let CLIPBOARD = [];
const menu = document.createElement('div');
menu.id = 'svgo-menu';
menu.style.cssText = 'position:fixed;display:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0002;padding:4px;z-index:60;min-width:150px';
document.body.appendChild(menu);
function menuItem(label, fn) {
  const it = document.createElement('div');
  it.textContent = label;
  it.style.cssText = 'padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px';
  it.addEventListener('mouseenter', () => it.style.background = '#f0f4fb');
  it.addEventListener('mouseleave', () => it.style.background = '');
  it.addEventListener('click', () => { hideMenu(); fn(); });
  return it;
}
function hideMenu() { menu.style.display = 'none'; }
window.addEventListener('pointerdown', e => { if (!menu.contains(e.target)) hideMenu(); });

stage.addEventListener('contextmenu', e => {
  if (!S.sourceRoot) return;
  e.preventDefault();
  const hitEl = hitTopLevel(e.target);
  if (hitEl && !S.selection.has(hitEl)) setSelection([hitEl]);
  menu.textContent = '';
  if (S.selection.size) {
    menu.appendChild(menuItem('复制　Ctrl+C', copySelection));
    menu.appendChild(menuItem('删除　Del', deleteSelection));
    menu.appendChild(menuItem('置于顶层', () => orderSelection('top')));
    menu.appendChild(menuItem('置于底层', () => orderSelection('bottom')));
    menu.appendChild(menuItem('存为我的组件', saveSelectionAsComponent));
  }
  if (CLIPBOARD.length) menu.appendChild(menuItem('粘贴　Ctrl+V', pasteClipboard));
  if (!menu.children.length) return;
  menu.style.left = Math.min(e.clientX, innerWidth - 170) + 'px';
  menu.style.top = Math.min(e.clientY, innerHeight - 200) + 'px';
  menu.style.display = 'block';
});

function copySelection() { CLIPBOARD = [...S.selection].map(el => el.cloneNode(true)); toast('已复制 ' + CLIPBOARD.length + ' 个元素'); }
function deleteSelection() {
  if (!S.selection.size) return;
  const removed = [...S.selection].map(el => ({ parent:contentG, el, next:el.nextSibling }));
  for (const r of removed) r.el.remove();
  S.selection.clear();
  pushCommand(makeNodeCommand('删除', removed));
  syncPropertyPanel(); renderLayers(); drawOverlay();
}
function pasteClipboard() {
  if (!CLIPBOARD.length || !S.sourceRoot) return;
  const added = [];
  const newSel = [];
  for (const proto of CLIPBOARD) {
    const el = proto.cloneNode(true);
    el.__uid = 'el' + (++UID);
    el.__baseTransform = el.getAttribute('transform') || '';
    el.__tx = 10; el.__ty = 10; applyOffset(el);
    added.push({ parent:contentG, el, next:null });
    newSel.push(el);
  }
  for (const a of added) a.parent.appendChild(a.el);
  pushCommand(makeAddCommand('粘贴', added));
  setSelection(newSel);
}
function orderSelection(where) {
  const cmds = [];
  for (const el of [...S.selection]) {
    const refBefore = el.nextSibling;
    let redoFn;
    if (where === 'top') { const refAfter = null; contentG.appendChild(el); redoFn = () => contentG.appendChild(el); }
    else { contentG.insertBefore(el, contentG.firstChild); redoFn = () => contentG.insertBefore(el, contentG.firstChild); }
    cmds.push({ undo() { contentG.insertBefore(el, refBefore); }, redo: redoFn });
  }
  pushCommand(makeComposite('调整层级', cmds));
  renderLayers();
}

// ============================ 对齐分布工具栏（任务 17） ============================
const alignBar = document.createElement('div');
alignBar.id = 'svgo-alignbar';
alignBar.style.cssText = 'position:absolute;left:50%;transform:translateX(-50%);bottom:44px;display:none;gap:6px;' +
  'background:#ffffffee;border:1px solid var(--line);border-radius:8px;padding:4px 6px;z-index:10';
$('svgo-center').appendChild(alignBar);
const ALIGN_DEFS = [['⇤','left'],['⇔','cx'],['⇥','right'],['⇡','top'],['⇕','cy'],['⇣','bottom'],['⋮⋮','disth'],['⋯','distv']];
for (const [label, kind] of ALIGN_DEFS) {
  const b = document.createElement('button');
  b.className = 'tbtn'; b.textContent = label;
  b.title = { left:'左对齐', cx:'水平居中', right:'右对齐', top:'顶对齐', cy:'垂直居中', bottom:'底对齐',
              disth:'水平等距分布(≥3)', distv:'垂直等距分布(≥3)' }[kind];
  b.addEventListener('click', () => alignSelection(kind));
  alignBar.appendChild(b);
}
const _syncPanelBase = syncPropertyPanel;
syncPropertyPanel = function() {
  _syncPanelBase();
  alignBar.style.display = (S.sourceRoot && S.selection.size >= 2) ? 'flex' : 'none';
};
function alignSelection(kind) {
  const els = [...S.selection].filter(visibleUnlocked);
  const horizDist = kind === 'disth', vertDist = kind === 'distv';
  if ((horizDist || vertDist) && els.length < 3) { toast('等距分布需要 ≥ 3 个元素'); return; }
  const boxes = els.map(el => ({ el, b: elBox(el) }));
  const ub = mergeBoxes(boxes.map(x => x.b));
  let moves = [];
  if (horizDist || vertDist) {
    boxes.sort((a, b) => horizDist ? a.b.x - b.b.x : a.b.y - b.b.y);
    const span = horizDist ? ub.w : ub.h;
    const sizes = boxes.reduce((s, x) => s + (horizDist ? x.b.w : x.b.h), 0);
    const gap = (span - sizes) / (boxes.length - 1);
    let cur = horizDist ? ub.x : ub.y;
    moves = boxes.map(x => {
      const m = horizDist ? cur - x.b.x : cur - x.b.y;
      cur += (horizDist ? x.b.w : x.b.h) + gap;
      return { el:x.el, dx: horizDist ? m : 0, dy: horizDist ? 0 : m };
    });
  } else {
    moves = boxes.map(({ el, b }) => {
      let dx = 0, dy = 0;
      if (kind === 'left') dx = ub.x - b.x;
      if (kind === 'right') dx = ub.x + ub.w - (b.x + b.w);
      if (kind === 'cx') dx = ub.x + ub.w / 2 - (b.x + b.w / 2);
      if (kind === 'top') dy = ub.y - b.y;
      if (kind === 'bottom') dy = ub.y + ub.h - (b.y + b.h);
      if (kind === 'cy') dy = ub.y + ub.h / 2 - (b.y + b.h / 2);
      return { el, dx, dy };
    });
  }
  const changes = [];
  for (const m of moves) {
    if (!m.dx && !m.dy) continue;
    const before = m.el.getAttribute('transform');
    m.el.__tx = (m.el.__tx || 0) + m.dx; m.el.__ty = (m.el.__ty || 0) + m.dy;
    applyOffset(m.el);
    changes.push({ el:m.el, attr:'transform', before, after:m.el.getAttribute('transform') });
  }
  if (changes.length) pushCommand(makeAttrCommand('对齐分布', changes));
  drawOverlay(); syncPropertyPanel();
};
